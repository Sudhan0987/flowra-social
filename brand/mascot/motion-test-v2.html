<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="hum.js"></script>
<script src="floey.js"></script>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f7f4ee}svg{display:block}</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// Floey motion test v2: the small behaviours. Perched, she stretches, preens,
// flicks her tongue and looks around; takes off and says hello; picks a broken
// link off a wilting page-flower and flicks it away; sips, the flower blooms;
// celebrates with a spectrum flash and a shuttle display; lands, shakes, winks,
// reverses and zips off.
const C = HUM.colors, DUR = 16, MOUTH = window.MOUTHS || {};
const PERCH = { x: 770, y: 905 };
const FL = { x: 330, base: 1700, h: 430 };

// the broken link: a red chain link with a crack, on a white badge
const link = (s = 1) => `<g transform="scale(${s})"><circle r="26" fill="#fffaf2" stroke="${C.ink}" stroke-width="4"/><g transform="rotate(-40)" stroke="#d24b4b" stroke-width="6" fill="none" stroke-linecap="round"><rect x="-19" y="-8" width="20" height="16" rx="8"/><rect x="3" y="-8" width="20" height="16" rx="8"/></g><path d="M-6,-14 l4,8 l-5,4 l5,8" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;

const W = { bloom: 0, cam: 1, logo: 0 };
const wt = gsap.timeline({ paused: true });
const F = FLOEY.create({ x: PERCH.x, y: PERCH.y, perched: true, facing: 1, scale: 1.6 });

// flower geometry: the head swings round the base as it wilts (24 degrees)
function flowerHead(b) { const a = (1 - b) * 24 * Math.PI / 180; return { x: FL.x + Math.sin(a) * FL.h, y: FL.base - Math.cos(a) * FL.h, a: (1 - b) * 24 }; }
const bugAt = () => { const h = flowerHead(0), a = h.a * Math.PI / 180; return { x: h.x + Math.cos(a) * 52 - Math.sin(a) * -96, y: h.y + Math.sin(a) * 52 + Math.cos(a) * -96 }; };

// ---------- the performance ----------
F.stretch(0.35, 0.75)
 .preen(1.25, 1.0)                 // ends with two tongue flicks
 .lookAround(2.8, 0.9)
 .pivot(3.75, "front").mood(3.8, "happy")
 .takeoff(4.15)
 .say(4.55, MOUTH.hi || new Array(34).fill(0.4), "hi")
 .mood(5.95, "surprised").look(5.95, -1, 1)
 .mood(6.3, "worried").pivot(6.35, "side");
const bug = bugAt();
F.reach(6.7, bug.x, bug.y).mood(7.1, "determined")
 .pick(7.35, link(0.62), "bug")
 .tiltTo(7.7, -8, 0.15)
 .toss(7.95, 1)
 .mood(8.3, "think");
const head = flowerHead(0);
F.reach(8.5, head.x - 10, head.y - 30)
 .sip(9.0, 3)
 .sfx(9.62, "bloom")
 .mood(9.95, "party").move(10.0, 600, 860, 0.45).pivot(10.15, "front")
 .flash(10.3).chips(10.4, 3)
 .shuttle(10.9, 4, 70, 0.2)
 .mood(11.9, "happy").pivot(11.95, "side").face(11.95, -1)
 .land(12.1, PERCH.x, PERCH.y, 0.5)
 .shake(12.95)
 .pivot(13.6, "front").wink(13.85)
 .takeoff(14.3).pivot(14.35, "side").face(14.35, 1)
 .reverse(14.6, 950, 0.55)
 .exit(15.3, -300, 620);

// the flower blooms in steps with each sip
[[9.06, 0.33], [9.32, 0.66], [9.58, 1]].forEach(([t, b]) => wt.to(W, { bloom: b, duration: 0.22, ease: "back.out(2.2)" }, t));
wt.to(W, { cam: 1.08, duration: 1.4, ease: "sine.inOut" }, 4.45).to(W, { cam: 1, duration: 0.5, ease: "power2.inOut" }, 5.95);
wt.to(W, { logo: 1, duration: 0.45, ease: "power2.out" }, 15.45);
wt.set({}, {}, DUR);

function flower(b) {
  const h = flowerHead(b);
  let s = `<g transform="rotate(${h.a} ${FL.x} ${FL.base})">`;
  const hx = FL.x, hy = FL.base - FL.h;
  s += `<path d="M${hx},${FL.base} C${hx - 4},${FL.base - 120} ${hx + 4},${FL.base - 280} ${hx},${hy + 60}" stroke="#5c8a4f" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M${hx},${FL.base - 140} q-60,-20 -90,-70 q60,0 90,50z" fill="#76a865" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"/><path d="M${hx + 2},${FL.base - 200} q60,-14 92,-62 q-62,4 -92,46z" fill="#76a865" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round"/>`;
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * 360, droop = (1 - b) * 46;
    s += `<g transform="rotate(${a} ${hx} ${hy}) translate(0 ${droop * Math.max(0, Math.cos(a * Math.PI / 180))})"><ellipse cx="${hx}" cy="${hy - 92}" rx="${26 + b * 8}" ry="${46 + b * 10}" fill="${b > .2 ? [C.coral, C.amber, C.magenta][i % 3] : "#c9c1b6"}" stroke="${C.ink}" stroke-width="5" opacity="${.6 + b * .4}"/></g>`;
  }
  s += `<rect x="${hx - 62}" y="${hy - 74}" width="124" height="150" rx="14" fill="#fffaf2" stroke="${C.ink}" stroke-width="6"/>`;
  [0, 1, 2, 3].forEach((i) => s += `<rect x="${hx - 40}" y="${hy - 46 + i * 28}" width="${[80, 64, 76, 50][i]}" height="10" rx="5" fill="${b > .5 ? [C.coral, "#d9d2c6", "#d9d2c6", C.violet][i] : "#d9d2c6"}"/>`);
  const up = b > .6;
  s += `<path d="M${hx + 34},${hy + 52} l0,${up ? -26 : 26} m-10,${up ? 10 : -10} l10,${up ? -10 : 10} l10,${up ? 10 : -10}" stroke="${up ? "#2f9e62" : "#d24b4b"}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  return s + `</g>`;
}

function sparks(t, x, y, at, n = 10, size = 28) {
  const k = (t - at) / .7; if (k < 0 || k > 1) return "";
  let s = "";
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + i, d = 40 + k * (120 + (i % 3) * 40); s += `<g opacity="${1 - k}">${HUM.spark(x + Math.cos(a) * d, y + Math.sin(a) * d, size * (1 - k * .5), [C.amber, C.coral, C.magenta, C.violet][i % 4])}</g>`; }
  return s;
}

const picked = () => F.events.find((e) => e.type === "picked");
const tossed = () => F.events.find((e) => e.type === "tossed");
let tossStart = null;

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const p = F.pose(t);
  let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe9fb"/><stop offset=".6" stop-color="#f7f4ee"/><stop offset="1" stop-color="#efe7d8"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#sky)"/>`;
  s += `<g transform="translate(${p.x} ${p.y}) scale(${W.cam}) translate(${-p.x} ${-p.y})">`;
  s += `<path d="M0,1600 C260,1520 520,1580 760,1530 C900,1500 1000,1520 1080,1540 L1080,1920 L0,1920Z" fill="#e3ead6"/><path d="M0,1700 C300,1650 700,1720 1080,1660 L1080,1920 L0,1920Z" fill="#cfdcbf"/>`;
  [[880, 1560, .5], [120, 1600, .4]].forEach(([x, y, k]) => s += `<g transform="translate(${x} ${y}) scale(${k}) translate(${-FL.x} ${-(FL.base - FL.h)})" opacity=".5">${flower(1)}</g>`);
  // the perch: a branch from the right edge
  s += `<path d="M1100,1050 C980,1046 860,1062 690,1066" stroke="#7a5236" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M1100,1050 C980,1046 860,1062 690,1066" stroke="#946645" stroke-width="10" fill="none" stroke-linecap="round" transform="translate(0 -4)"/><path d="M900,1056 q30,-40 70,-46 q-20,30 -70,46z" fill="#76a865" stroke="${C.ink}" stroke-width="4"/>`;
  s += flower(W.bloom);
  // the broken link: on the flower, then in the beak, then flying away
  const pk = picked(), ts = tossed();
  if (!pk || t < pk.t) s += `<g transform="translate(${bug.x} ${bug.y}) rotate(${Math.sin(t * 7) * 6})">${link(1)}</g>`;
  if (ts && t >= ts.t) {
    if (!tossStart) tossStart = F.beakTip(ts.t);
    const k = t - ts.t, x = tossStart[0] - 1100 * k, y = tossStart[1] - 900 * k + 1500 * k * k;
    if (y < 2100) s += `<g transform="translate(${x} ${y}) rotate(${-k * 720})">${link(1)}</g>`;
  }
  s += sparks(t, flowerHead(1).x, flowerHead(1).y, 9.58, 10, 30);
  s += sparks(t, p.x, p.y - 20, 10.3, 12, 34);
  s += F.trail(t) + F.svg(t);
  s += `</g>`;
  if (W.logo > 0) s += `<g opacity="${W.logo}" transform="translate(540 ${380 - (1 - W.logo) * 30})">${HUM.spark(-150, -16, 26, C.coral)}<text x="-110" y="0" font-family="Space Grotesk" font-weight="700" font-size="84" fill="${C.ink}">Floey</text><text x="-108" y="54" font-family="Space Grotesk" font-weight="700" font-size="34" fill="${C.magenta}">from Flowra</text></g>`;
  document.getElementById("stage").innerHTML = s;
};
window.DURATION = DUR;
window.SOUND = () => F.sound(DUR);
window.render(0);
</script></body></html>
