<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Public+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="../mascot/hum.js"></script>
<script src="../world/garden.js"></script>
<style>html,body{margin:0;background:#fff}svg{display:block}</style>
</head><body>
<svg id="profile" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<svg id="profileLogo" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<svg id="cover" width="1640" height="624" viewBox="0 0 1640 624"></svg>
<script>
const C = HUM.colors;
const spectrum = `<linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C.amber}"/><stop offset=".3" stop-color="${C.coral}"/><stop offset=".6" stop-color="${C.magenta}"/><stop offset="1" stop-color="${C.violet}"/></linearGradient>
  <radialGradient id="halo" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset=".55" stop-color="#fff6e0" stop-opacity=".25"/><stop offset="1" stop-color="#fff6e0" stop-opacity="0"/></radialGradient>`;

// Profile: Floey, front, happy, wings blurred, on a warm halo over the spectrum.
// Everything that matters sits inside the central circle (Instagram crops to it).
document.getElementById("profile").innerHTML = `<defs>${spectrum}</defs>
  <rect width="1080" height="1080" fill="url(#spec)"/>
  <circle cx="540" cy="520" r="470" fill="url(#halo)"/>
  ${[[180, 230, 34], [890, 260, 26], [860, 820, 30], [210, 800, 22]].map(([x, y, r]) => HUM.spark(x, y, r, "#fff4d6")).join("")}
  <g transform="translate(540 585) scale(2.75) translate(-150 -150)">${HUM.svg({ view: "front", mood: "happy", wing: "blur", wingPhase: 0.3, beak: 0, crest: 0.8, flash: 0, feet: false })}</g>`;

// Alternative: the Flowra spark with a tiny Floey
document.getElementById("profileLogo").innerHTML = `<defs>${spectrum}</defs>
  <rect width="1080" height="1080" fill="${C.ink}"/>
  <path d="M540,190 Q600,480 890,540 Q600,600 540,890 Q480,600 190,540 Q480,480 540,190Z" fill="url(#spec)" stroke="${C.cream}" stroke-width="26" stroke-linejoin="round"/>
  <g transform="translate(700 380) scale(.8) translate(-160 -150)">${HUM.svg({ mood: "happy", wing: "blur", wingPhase: 0.3 })}</g>`;

// Facebook cover: the garden as a panorama. Phones crop the sides, so Floey,
// the message and the address all sit in the middle ~1100 px.
const cam = { camX: 540, camY: 960, zoom: 1 };
let cv = `<defs>${spectrum}</defs>` + GARDEN.defs() + `<defs><linearGradient id="csky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e2f8"/><stop offset=".6" stop-color="#f7eeee"/><stop offset="1" stop-color="#fbf3e6"/></linearGradient></defs>`;
cv += `<rect width="1640" height="624" fill="url(#csky)"/>`;
// sun with soft rays, kept inside the frame
cv += `<g transform="translate(1290 170)"><g opacity=".12">${Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2, b2 = a + 0.16; return `<path d="M0,0 L${Math.cos(a) * 900},${Math.sin(a) * 900} L${Math.cos(b2) * 900},${Math.sin(b2) * 900}Z" fill="#ffd98a"/>`; }).join("")}</g><circle r="150" fill="#ffe7b0" opacity=".55"/><circle r="74" fill="#ffe2a3"/></g>`;
// clouds
const cl = (x, y, k, o) => `<g transform="translate(${x} ${y}) scale(${k})" opacity="${o}"><path d="M-120,30 C-150,30 -160,-6 -128,-14 C-130,-52 -80,-66 -56,-40 C-40,-80 30,-82 44,-36 C70,-60 120,-40 112,-6 C150,-4 150,30 118,30Z" fill="#fff"/></g>`;
cv += cl(170, 90, 0.8, 0.9) + cl(640, 60, 0.55, 0.7) + cl(1520, 300, 0.5, 0.6);
// misty mountains, two layers, then hills with little trees
cv += `<path d="M-20,420 L120,250 L240,340 L390,190 L540,330 L700,230 L860,350 L1010,210 L1170,330 L1330,240 L1480,330 L1660,220 L1660,470 L-20,470Z" fill="#dcd3ee"/>`;
cv += `<path d="M390,190 L425,226 L400,224 L388,244 L372,222 L356,226Z M1010,210 L1042,244 L1020,242 L1008,262 L994,240 L978,244Z" fill="#fff" opacity=".7"/>`;
cv += `<path d="M-20,470 C200,380 360,360 560,400 C760,440 900,350 1120,380 C1320,410 1480,360 1660,400 L1660,520 L-20,520Z" fill="#cec8e5" opacity=".9"/>`;
cv += `<path d="M-20,500 C260,440 520,450 800,470 C1080,490 1300,440 1660,470 L1660,624 L-20,624Z" fill="#dbe7c8"/>`;
cv += [[90, 470], [180, 478], [980, 468], [1060, 474], [1560, 462]].map(([x, y], i) => `<g transform="translate(${x} ${y})"><path d="M0,0 v18" stroke="#9ab08a" stroke-width="5"/><ellipse cx="0" cy="-6" rx="${14 + (i % 3) * 3}" ry="${18 + (i % 2) * 5}" fill="${["#a9c49a", "#b7cfa6", "#9fbb92"][i % 3]}"/></g>`).join("");
cv += `<path d="M-20,560 C400,535 900,575 1660,545 L1660,624 L-20,624Z" fill="#cbdbb6"/>`;
const fl = (x, h, pal, health, seed) => `<g transform="translate(${x} 612) scale(.42) translate(${-x} -1720)">${GARDEN.flower({ x, base: 1720, h, pal, dir: 1, seed }, health, 2)}</g>`;
cv += fl(330, 520, [C.violet, C.indigo, C.magenta], 1, 3) + fl(470, 420, [C.coral, C.amber, C.magenta], 1, 7) + fl(1240, 470, [C.amber, C.coral, C.violet], 1, 11) + fl(1370, 400, [C.magenta, C.amber, C.coral], 0.95, 17);
cv += `<g transform="translate(560 300) scale(1.05) translate(-160 -150)">${HUM.svg({ mood: "happy", wing: "blur", wingPhase: 0.3, beak: 0, flash: 0, crest: 0.8 })}</g>`;
cv += `<g transform="translate(720 0)">
  <text x="0" y="232" font-family="Space Grotesk" font-weight="700" font-size="58" fill="${C.ink}">Find the pages losing clicks.</text>
  <text x="0" y="300" font-family="Space Grotesk" font-weight="700" font-size="58" fill="${C.ink}">Fix them. See if it worked.</text>
  <rect x="0" y="336" width="300" height="62" rx="31" fill="${C.ink}"/>${HUM.spark(36, 367, 14, C.coral)}
  <text x="62" y="378" font-family="Space Grotesk" font-weight="700" font-size="32" fill="#fff">useflowra.com</text></g>`;

document.getElementById("cover").innerHTML = cv;
</script></body></html>
