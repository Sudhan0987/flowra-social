html,body{width:1200px;height:1200px;overflow:hidden;background:#fff}

.txt{position:absolute;left:80px;right:80px;top:84px}

.g{background:linear-gradient(95deg,#c74e0a 0%,#d63a3d 50%,#a83a82 100%);-webkit-background-clip:text;color:transparent}
.shot{position:absolute;left:80px;right:80px;top:372px;height:500px;border:1px solid #dfe3ea;border-radius:18px;overflow:hidden;box-shadow:0 24px 48px rgba(15,23,41,.12),0 2px 6px rgba(15,23,41,.06);background:#fff}

.cap{position:absolute;left:80px;right:80px;top:896px;font:500 18px/1.4 'Public Sans',sans-serif;color:#55627a}
.gwrap{position:absolute;left:0;right:0;bottom:6px;height:240px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%)}
.garden{width:100%;height:100%;display:block}
.rule{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#f0a23d,#ee7274 28%,#c45a9e 52%,#8b6fd8 76%,#515fcd)}
