<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Public+Sans:wght@800&display=swap" rel="stylesheet">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/world/garden.js"></script>
<script src="../../brand/studio/props.js"></script>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f7f4ee}svg{display:block}</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// TEMPLATE (reel 000, "meet Floey", approved 2026-10-01) rebuilt on brand/studio/props.js.
// A new reel copies this shape: LINES, GAP and timing, the world, Floey's
// performance cued to B[id], props drawn from PROPS, window.render(t).
// Reel 000: meet Floey. Story: problem (a page losing clicks unseen), Floey
// arrives, what she does, the fix, the payoff, and a loop back to the opening.
const C = HUM.colors, FPS = 30, M = window.MOUTHS || {};
// a real reel uses the pipeline's lines: const LINES = window.LINES;
const LINES = window.LINES || [
  ["hook", "One of your pages is losing clicks right now. You just can't see it.", "ominous"],
  ["intro", "That's where I come in. I'm Floey, from Flowra.", "bright"],
  ["watch", "I watch your Search Console and spot the pages that are fading, and the ones close to page one.", "curious"],
  ["fix", "Then we fix them. You see every change before it goes live on WordPress.", "determined"],
  ["check", "Two weeks later, I check whether it actually worked.", "proud"],
  ["loop", "Somewhere on your site, another page just started fading.", "worried"],
  ["go", "Come on, let's go fix it!", "excited"],
  ["url", "useflowra.com.", "playful"],
];
// beat timing comes from the spoken lines (the pause after each line, in seconds)
const GAP = { hook: 0.5, intro: 0.45, watch: 0.5, fix: 0.6, check: 0.55, loop: 0.25, go: 0.75, url: 0.35 };
const { B, DUR } = PROPS.timing(LINES, M, GAP);

// ---------- the garden ----------
const FLOWERS = {
  C: { x: 215, base: 1720, h: 720, bloom: 1, pal: [C.violet, C.indigo, C.magenta], dir: 1, seed: 3 },
  A: { x: 590, base: 1720, h: 440, bloom: 0, pal: [C.coral, C.amber, C.magenta], dir: -1, seed: 7 },
  B: { x: 850, base: 1720, h: 480, bloom: 1, pal: [C.amber, C.coral, C.violet], dir: 1, seed: 11 },
  D: { x: 985, base: 1720, h: 380, bloom: 1, pal: [C.magenta, C.amber, C.coral], dir: 1, seed: 17 },
};
const W = { camX: 540, camY: 960, zoom: 1, A: 0, B: 1, D: 1, arrowA: 0, tagB: 0, tagC: 0, card: 0, published: 0, cal: 0, chart: 0, logo: 0, petal: 0 };
const head = PROPS.head;
const bug = PROPS.bug;
// the 404 bug wanders over page A (which leans while wilting) until Floey eats it
const bugPos = (t) => PROPS.bugOn(FLOWERS.A, t);

// ---------- Floey's performance, cued to the voice ----------
const F = FLOEY.create({ x: -260, y: 760, facing: -1, scale: 1.35, mood: "determined" });
const wt = gsap.timeline({ paused: true });
const b = B;
const hA = head(FLOWERS.A, 0);

// HOOK: tight on A's arrow sliding down, a petal drops, pull out to the garden
wt.set(W, { camX: hA.x + 30, camY: hA.y + 40, zoom: 3.1 }, 0)
  .to(W, { arrowA: 1, duration: 0.6, ease: "power2.in" }, 0.25)
  .to(W, { petal: 1, duration: 1.6, ease: "none" }, 0.6)
  .to(W, { camX: 560, camY: 1130, zoom: 1.12, duration: 1.3, ease: "power3.inOut" }, b.hook.start + 1.4);
F.sfx(0.3, "swish").sfx(0.85, "tk");
F.sfx(b.hook.start, "voice", { id: "hook", len: b.hook.len });

// INTRO: zips in, brakes beside A, snaps to camera, throat flash on "Flowra"
F.dart(b.intro.start - 0.1, 700, 780, 0.34, -1)
 .mood(b.intro.start + 0.3, "hello")
 .pivot(b.intro.start + 0.75, "front")
 .chips(b.intro.start - 0.28, 1)  // Floey's signature pip before she speaks
 .say(b.intro.start, M.intro || [], "intro")
 .flash(b.intro.end - 0.45).chips(b.intro.end + 0.05, 2);
wt.to(W, { camX: 640, camY: 1060, zoom: 1.24, duration: 1.4, ease: "sine.inOut" }, b.intro.start + 0.4);

// WATCH: fly the row, a red tag pops on B as it starts to sag, then point at C under the PAGE 1 line
F.pivot(b.watch.start + 0.1, "side").mood(b.watch.start + 0.1, "think")
 .move(b.watch.start + 0.2, 905, 900, 0.5, "power2.inOut").face(b.watch.start + 0.2, -1)
 .say(b.watch.start, M.watch || [], "watch")
 .look(b.watch.start + 0.7, -0.6, 0.8)
 .sfx(b.watch.start + 1.1, "pluck")
 .face(b.watch.start + b.watch.len * 0.55, 1)
 .dart(b.watch.start + b.watch.len * 0.55 + 0.2, 420, 940, 0.34, 1)
 .mood(b.watch.start + b.watch.len * 0.62, "determined")
 .sfx(b.watch.start + b.watch.len * 0.8, "pluck").chips(b.watch.start + b.watch.len * 0.82, 2);
wt.to(W, { camX: 560, camY: 1130, zoom: 1.12, duration: 0.6, ease: "power2.inOut" }, b.watch.start)
  .to(W, { B: 0.55, duration: 1.2, ease: "power1.inOut" }, b.watch.start + 0.6)
  .to(W, { tagB: 1, duration: 0.3, ease: "back.out(2.5)" }, b.watch.start + 1.1)
  .to(W, { tagC: 1, duration: 0.3, ease: "back.out(2.5)" }, b.watch.start + b.watch.len * 0.8);

// FIX: catch the 404 bug and eat it, change preview, tap Publish, A blooms
const bp = bugPos(b.fix.start + 0.25);
F.mood(b.fix.start - 0.4, "determined")
 .reach(b.fix.start - 0.25, bp.x, bp.y, 0.3)
 .pick(b.fix.start + 0.25, bug(0, 0.62), "bug")
 .eat(b.fix.start + 0.62)
 .say(b.fix.start, M.fix || [], "fix")
 .move(b.fix.start + 1.3, 960, 660, 0.45, "power2.inOut").face(b.fix.start + 1.3, 1).mood(b.fix.start + 1.3, "hello");
const btn = PROPS.reviewButton();
F.reach(b.fix.start + b.fix.len * 0.72, btn.x, btn.y, 0.3)
 .sfx(b.fix.start + b.fix.len * 0.72 + 0.34, "tap").sfx(b.fix.start + b.fix.len * 0.72 + 0.36, "ting")
 .sfx(b.fix.end + 0.05, "bloom").mood(b.fix.end, "party");
// ease the camera back so the card clears Instagram's header (top 150 px)
wt.to(W, { camX: 600, camY: 900, zoom: 1.1, duration: 0.6, ease: "power2.inOut" }, b.fix.start + 0.9)
  .to(W, { card: 1, duration: 0.35, ease: "back.out(1.8)" }, b.fix.start + 1.2)
  .to(W, { published: 1, duration: 0.2 }, b.fix.start + b.fix.len * 0.72 + 0.34)
  .to(W, { card: 0, duration: 0.3, ease: "power2.in" }, b.fix.end - 0.1)
  .to(W, { A: 1, duration: 0.6, ease: "back.out(2)" }, b.fix.end + 0.05);

// CHECK: calendar flips 14 days, the clicks line climbs, celebration
F.move(b.check.start, 560, 1000, 0.45).pivot(b.check.start + 0.2, "front").mood(b.check.start + 0.2, "think")
 .say(b.check.start, M.check || [], "check")
 .sfx(b.check.start + 0.4, "rustle", { n: 4 })
 .mood(b.check.end - 0.4, "party").flash(b.check.end - 0.35).shuttle(b.check.end - 0.2, 4, 60, 0.18);
wt.to(W, { camX: 560, camY: 900, zoom: 1.1, duration: 0.5, ease: "power2.inOut" }, b.check.start)
  .to(W, { cal: 1, duration: 1.1, ease: "power1.inOut" }, b.check.start + 0.35)
  .to(W, { chart: 1, duration: 0.9, ease: "power2.out" }, b.check.start + 1.5)
  .to(W, { cal: 0, chart: 0, duration: 0.3 }, b.check.end + 0.6);

// LOOP: another page (D) starts to sag; Floey spins to it
F.pivot(b.loop.start + 0.3, "side").face(b.loop.start + 0.3, -1).mood(b.loop.start + 0.3, "worried")
 .say(b.loop.start, M.loop || [], "loop")
 .look(b.loop.start + 0.4, -1, 0.6);
const hD = head(FLOWERS.D, 0.25);
wt.to(W, { tagB: 0, tagC: 0, duration: 0.25 }, b.loop.start)
  .to(W, { D: 0.25, duration: 1.4, ease: "power1.inOut" }, b.loop.start + 0.2);
F.sfx(b.loop.start + 0.3, "tk");

// GO: she turns to you, fired up, then darts towards D
F.pivot(b.go.start - 0.15, "front").mood(b.go.start - 0.15, "party")
 .say(b.go.start, M.go || [], "go")
 .chips(b.go.end - 0.05, 2)
 .pivot(b.go.end + 0.1, "side").face(b.go.end + 0.1, -1).mood(b.go.end + 0.1, "determined")
 .exit(b.go.end + 0.35, hD.x + 700, hD.y - 380, 0.4);  // zips past the page and out, so the last shot is the page alone
wt.to(W, { camX: 640, camY: 1040, zoom: 1.2, duration: 0.5, ease: "power2.out" }, b.go.start - 0.1);

// URL: after a beat, the address; the camera pushes into D's arrow, matching the opening shot
F.say(b.url.start, M.url || [], "url").chips(b.url.end + 0.1, 1);
wt.to(W, { logo: 1, duration: 0.35, ease: "back.out(1.6)" }, b.url.start - 0.15)
  .to(W, { camX: hD.x - 20, camY: hD.y + 40, zoom: 3.1, duration: 1.5, ease: "power3.inOut" }, b.go.end + 0.45);
F.sfx(b.go.end + 0.45, "swish");
wt.set({}, {}, DUR);

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  F.pose(t);
  const cam = { camX: W.camX, camY: W.camY, zoom: W.zoom };
  let s = GARDEN.defs() + GARDEN.background(t, cam);
  s += `<g transform="translate(540 960) scale(${W.zoom}) translate(${-W.camX} ${-W.camY})">`;
  s += GARDEN.ground();
  // PAGE 1 line
  s += PROPS.rankLine(930, "PAGE 1");
  s += GARDEN.flower(FLOWERS.C, 1, t);
  s += GARDEN.flower(FLOWERS.B, W.B, t);
  s += GARDEN.flower(FLOWERS.D, W.D, t);
  s += GARDEN.flower(FLOWERS.A, W.A, t, { dropPetal: W.petal, arrow: W.A > .6 ? "up" : "down" });
  // the falling petal in the hook
  { const p0 = head(FLOWERS.A, 0); s += GARDEN.fallingPetal(FLOWERS.A, W.A, p0.x + 40, p0.y + 30, W.petal); }
  // tags
  const hB = head(FLOWERS.B, W.B), hC = head(FLOWERS.C, 1);
  s += PROPS.tag(hB.x + 40, hB.y - 150, W.tagB, "fading", "#d24b4b");
  s += PROPS.tag(hC.x + 140, hC.y - 40, W.tagC, "#9", C.violet);
  // the 404 bug, until Floey catches it
  const pk = F.events.find((e) => e.type === "picked");
  if (!pk || t < pk.t) { const q = bugPos(t); s += `<g transform="translate(${q.x} ${q.y}) rotate(${q.a})">${bug(t)}</g>`; }
  s += PROPS.reviewCard(W.card, { published: W.published });
  s += PROPS.calendar(W.cal) + PROPS.chart(W.chart, 530, 330, { title: "Clicks", points: [0.15, 0.19, 0.13, 0.17, 0.38, 0.65, 0.92], markAt: 0.5 });
  s += PROPS.sparks(t, head(FLOWERS.A, 1).x, head(FLOWERS.A, 1).y, B.fix.end + 0.1, 12, 30);
  s += F.trail(t) + F.svg(t);
  s += `</g>`;
  s += GARDEN.pollen(t, cam) + GARDEN.vignette();
  s += PROPS.captions(LINES, B, t);
  s += PROPS.endCard(W.logo);
  document.getElementById("stage").innerHTML = s;
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), music: Object.values(B).map((x) => x.start) });
window.LINES = LINES;
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.render(0);
</script></body></html>
