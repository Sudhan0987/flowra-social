# Weekly social listening (src/trends.ts): searches Reddit, Hacker News and
# YouTube for what Flowra's buyers are talking about (free sources, no keys),
# then Claude ranks what to post next. Writes research/<date>/ and
# research/latest.json, which the reel researcher and Flowra Desk read; then
# rebuilds calendar/social.json and drafts the coming week's LinkedIn posts.
# Sundays 08:00 India time, before Monday's reel; or by hand.
#
# Needs: secrets.CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).

name: Social listening

on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-research
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
      L30: ${{ github.workspace }}/.last30days/skills/last30days/scripts/last30days.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: last30days (MIT), pinned
        run: |
          git clone -q https://github.com/mvanhorn/last30days-skill .last30days
          git -C .last30days checkout -q 7f582ad8c2e140eca08098b245f9e31b68e28b60
          pip install -q yt-dlp
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - name: Listen and rank
        run: npx tsx src/trends.ts
      - name: Social calendar and next week's LinkedIn drafts
        run: npx tsx src/social-calendar.ts --drafts
      - name: Save
        run: |
          git config user.name "flowra-social"
          git config user.email "flowra-social@users.noreply.github.com"
          git add research calendar posts
          git commit -m "Social listening $(date -u +%F)" || echo "nothing new"
          git pull --rebase -q && git push -q
