# Posts approved reels to Instagram (Reel), the Facebook Page and YouTube Shorts on its own
# (src/autopost.ts). A ✅ on the draft in Slack #social, or Approve in Flowra
# Desk, is all it needs. At most one reel a day, posted by the 19:00 India run
# (09:30 New York, 14:30 London), with 22:00 as the fallback; the script refuses
# outside 18:00-23:00 IST, since scheduled runs can start hours late. The other
# runs only read Slack decisions.
#
# Needs: secrets.META_ACCESS_TOKEN (instagram_content_publish, pages_manage_posts),
# secrets.SLACK_BOT_TOKEN (reactions:read, optional). Never echoes a token.

name: Post approved reels

on:
  schedule:
    # morning checks read approvals; then one check every hour inside the
    # 18:00 to 23:00 IST posting window (13:00 to 17:00 UTC), because GitHub
    # starts scheduled runs up to 2 hours late (12 Oct 2026: the 19:00 IST
    # check had not started by 20:27) and one slot can miss the window
    - cron: "30 4,7,10 * * *"
    - cron: "0 13-17 * * *"
  push:
    branches: [main]
    paths: [state/posts.json]
  workflow_dispatch:
    inputs:
      check:
        description: "true = test the Instagram upload with the last posted reel, without publishing"
        required: false
        default: "false"
      youtube:
        description: "Reel id already posted on Instagram to upload to YouTube only (optional)"
        required: false
        default: ""
      linkedin_check:
        description: "true = list the Buffer channels (names and ids) and post nothing"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      SLACK_BOT_TOKEN: ${{ vars.SLACK_OFF != 'true' && secrets.SLACK_BOT_TOKEN || '' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IG_USER_ID: "17841426622354094"
      FB_PAGE_ID: "1322809910922605"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ffmpeg (audio check before Instagram)
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Post the next approved reel
        run: npx tsx src/autopost.ts ${{ inputs.check == 'true' && '--check' || '' }} ${{ inputs.youtube != '' && format('--youtube={0}', inputs.youtube) || '' }}
      - name: Post the approved LinkedIn draft to the Flowra page (Buffer)
        if: always() && inputs.check != 'true' && (inputs.youtube == '' || inputs.youtube == null)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_CHANNEL: ${{ vars.BUFFER_LINKEDIN_CHANNEL }}
        run: npx tsx src/linkedin.ts ${{ inputs.linkedin_check == 'true' && '--check' || '' }}
      - name: Save
        if: always()
        run: |
          git config user.name "flowra-social"
          git config user.email "flowra-social@users.noreply.github.com"
          git add state/posts.json posts/linkedin
          git diff --cached --quiet || (git commit -m "Posted / approvals $(date -u +%F)" && git pull --rebase -q && git push -q)
