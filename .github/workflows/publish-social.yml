# One-off manual publish to Instagram (as a Reel) and the Facebook Page.
#
# Instagram needs the video at a public HTTPS URL (video_url) that the caller
# keeps reachable while Meta fetches and transcodes it. Facebook can instead take
# the file directly: give artifact_run_id (a make.yml run whose "reels" artifact
# holds the approved render) and it uploads that file, no public URL needed.
# skip_instagram=true posts to Facebook only (never post the same Reel twice).
# Never echoes META_ACCESS_TOKEN.
#
# Needs: secrets.META_ACCESS_TOKEN with instagram_content_publish and pages_manage_posts
# (check with meta-check.yml)

name: Publish to Instagram and Facebook

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public HTTPS URL to the reel.mp4 (needed for Instagram)"
        required: false
        default: ""
      caption:
        description: "Caption text (used for both IG and the FB Page post)"
        required: true
      ig_user_id:
        description: "Instagram Business Account id"
        required: true
      page_id:
        description: "Facebook Page id"
        required: true
      skip_instagram:
        description: "true = post to Facebook only"
        required: false
        default: "false"
      artifact_run_id:
        description: "make.yml run id whose 'reels' artifact has the video (Facebook uploads it directly)"
        required: false
        default: ""

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
    env:
      T: ${{ secrets.META_ACCESS_TOKEN }}
      VIDEO_URL: ${{ inputs.video_url }}
      CAPTION: ${{ inputs.caption }}
      IG_USER_ID: ${{ inputs.ig_user_id }}
      PAGE_ID: ${{ inputs.page_id }}
    steps:
      - name: Publish the Instagram Reel
        if: ${{ inputs.skip_instagram != 'true' }}
        run: |
          set -e
          G=https://graph.facebook.com/v23.0
          echo "== creating the IG media container"
          CREATE=$(curl -s -X POST "$G/$IG_USER_ID/media" \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "access_token=$T")
          echo "$CREATE" | jq .
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -z "$CID" ]; then echo "::error::no container id, see response above"; exit 1; fi
          echo "container id: $CID"

          echo "== waiting for Meta to finish processing the video"
          for i in $(seq 1 40); do
            STATUS=$(curl -s "$G/$CID?fields=status_code,status&access_token=$T")
            CODE=$(echo "$STATUS" | jq -r '.status_code // empty')
            echo "[$i] $STATUS"
            if [ "$CODE" = "FINISHED" ]; then break; fi
            if [ "$CODE" = "ERROR" ]; then echo "::error::Meta reported ERROR processing the video"; exit 1; fi
            sleep 10
          done
          if [ "$CODE" != "FINISHED" ]; then echo "::error::container never reached FINISHED in time"; exit 1; fi

          echo "== publishing the Reel"
          PUB=$(curl -s -X POST "$G/$IG_USER_ID/media_publish" \
            --data-urlencode "creation_id=$CID" \
            --data-urlencode "access_token=$T")
          echo "$PUB" | jq .
          MID=$(echo "$PUB" | jq -r '.id // empty')
          if [ -z "$MID" ]; then echo "::error::publish failed, see response above"; exit 1; fi
          echo "Published Instagram media id: $MID"

      - name: Fetch the approved video
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: reels
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reel-artifact

      - name: Publish the Facebook Page video
        run: |
          set -e
          G=https://graph.facebook.com/v23.0
          echo "== getting this Page's own access token"
          PAGES=$(curl -s "$G/me/accounts?fields=id,name,access_token&access_token=$T")
          PAGE_TOKEN=$(echo "$PAGES" | jq -r --arg PID "$PAGE_ID" '.data[]? | select(.id==$PID) | .access_token // empty')
          if [ -z "$PAGE_TOKEN" ]; then echo "::error::could not find a page token for $PAGE_ID"; echo "$PAGES" | jq '{data:[.data[]?|{id,name}],error:.error.message}'; exit 1; fi

          FILE=$(find reel-artifact -name reel.mp4 2>/dev/null | head -1 || true)
          echo "== posting the video to the Page"
          if [ -n "$FILE" ]; then
            echo "uploading the file directly: $FILE ($(stat -c%s "$FILE") bytes)"
            FB=$(curl -s -X POST "https://graph-video.facebook.com/v23.0/$PAGE_ID/videos" \
              --form-string "description=$CAPTION" \
              --form-string "access_token=$PAGE_TOKEN" \
              -F "source=@$FILE")
          else
            FB=$(curl -s -X POST "$G/$PAGE_ID/videos" \
              --data-urlencode "file_url=$VIDEO_URL" \
              --data-urlencode "description=$CAPTION" \
              --data-urlencode "access_token=$PAGE_TOKEN")
          fi
          echo "$FB" | jq .
          FID=$(echo "$FB" | jq -r '.id // empty')
          if [ -z "$FID" ]; then echo "::error::Facebook video post failed, see response above"; exit 1; fi
          echo "Facebook video id: $FID"

          echo "== waiting for Facebook to finish processing"
          for i in $(seq 1 30); do
            ST=$(curl -s "$G/$FID?fields=status&access_token=$PAGE_TOKEN")
            VS=$(echo "$ST" | jq -r '.status.video_status // empty')
            echo "[$i] $ST"
            if [ "$VS" = "ready" ]; then echo "Published Facebook video id: $FID"; exit 0; fi
            if [ "$VS" = "error" ]; then echo "::error::Facebook reported an error processing the video"; exit 1; fi
            sleep 10
          done
          echo "::warning::still processing after 5 minutes; check the Page"
