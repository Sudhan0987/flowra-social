# Makes the next reel through the studio process in docs/production-process.md
# (research, story, voice, storyboard, director, render, final test), all on
# the Claude subscription. Originally: Claude writes the script,
# a free local voice reads it, the page in reel/ is drawn frame by frame, and
# the video goes to Slack #social for a ✅. Monday, Wednesday and Friday at
# 10:30 India time, or by hand from the Actions tab (optionally with a topic id).
#
# Needs repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token`
#   SLACK_BOT_TOKEN          the Flowra Agents Slack app's bot token (xoxb-...)
# Optional repository variable: CLAUDE_MODEL ("opus" by default, or "sonnet").

name: Make a reel

on:
  schedule:
    - cron: "0 5 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id from calendar/topics.json (optional; empty = the next one)"
        required: false

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@v5

      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; nothing made."; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Voice and video tools
        if: steps.setup.outputs.ready == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q kokoro-onnx soundfile
          echo "PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "ESPEAK_LIB=$(find /usr/lib -name 'libespeak-ng.so*' | head -1)" >> "$GITHUB_ENV"
          echo "ESPEAK_DATA=$(dirname "$(find /usr -name phontab -path '*espeak-ng-data*' | head -1)")" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          path: .kokoro
          key: kokoro-v1.0

      - name: Voice model (Kokoro 82M, Apache 2.0)
        if: steps.setup.outputs.ready == 'true'
        run: |
          mkdir -p .kokoro/models .kokoro/voices
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s .kokoro/models/kokoro-v1.0.onnx ] || curl -sSfL -o .kokoro/models/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s .kokoro/voices/voices-v1.0.bin ] || curl -sSfL -o .kokoro/voices/voices-v1.0.bin "$base/voices-v1.0.bin"

      - if: steps.setup.outputs.ready == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Make the reel
        if: steps.setup.outputs.ready == 'true'
        run: npx tsx src/cli.ts make "$TOPIC"

      - uses: actions/upload-artifact@v4
        if: steps.setup.outputs.ready == 'true' && always()
        with:
          name: reels
          path: |
            drafts/*/reel.mp4
            drafts/*/poster.jpg
          if-no-files-found: ignore
          retention-days: 30

      - name: Save the script and state
        if: steps.setup.outputs.ready == 'true' && always()
        run: |
          git config user.name "flowra-social"
          git config user.email "flowra-social@users.noreply.github.com"
          git add drafts state
          git diff --cached --quiet || (git commit -m "Reel drafts $(date -u +%F)" && git pull --rebase -q && git push)
