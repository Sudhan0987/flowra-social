<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#efe6f3}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r019 "The note on the door". Night. Maya hammers save on her robots.txt and GPTBot is still
// refused (the red pill and a "!" are up from frame one). Floey: robots.txt is a note on the door,
// not the bouncer. The host is. Maya opens her host's bot log (her example): GPTBot 429, everyone
// else 200 OK, held through her whole line. Floey hovers in for "your host said slow down", Maya
// saves her 3-step check (on screen while she says it), Floey's "You're welcome." to camera, and
// Maya's long flat look down the lens.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.3, reframe1: 0.3, doubt2: 0.2, tip3: 0.5, check4: 0.25, payoff5: 0.4, payoff6: 0.4, button7: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
// END pushed back 0.4 s so Maya's silent look to camera plays out before the end card
const END = SPOKEN + 0.6 + 0.4, DUR = END + 1.6, b = B, SH = DUO.SHOT, SP = DUO.SPOT;

// Maya's faces for this scene. The rig's open mouth is always a grin shape, so on her worried,
// annoyed and surprised beats the open mouth is drawn as a fret (corners down) or a small "o",
// and the worried brows sit low enough to show under her fringe. "determined" is for "Right."
const EX = MAYA.EXPR;
EX.worried = { ...EX.worried, brow: [18, 10] };
EX.panic = { ...EX.panic, brow: [24, 8] };
EX.surprised = { ...EX.surprised, brow: [8, 2] };
EX.determined = { brow: [-14, 6], eye: 0.8, smile: 0.1, w: 0.8, blush: 0 };
const FRET = { worried: 1, panic: 1, sad: 1, annoyed: 0.7, deadpan: 0.5, determined: 0.3, surprised: 0, think: 0 };
const OPEN = /<path d="[^"]*" fill="#5a1f22"[^>]*\/>\s*<clipPath id="(mq\d+)"><path d="[^"]*"\/><\/clipPath>\s*<g clip-path="url\(#\1\)">[\s\S]*?<\/g>/;
const r1 = (n) => Math.round(n * 10) / 10;
function fretMouth(open, u, id) {
  const cx = 300, cy = 336, w = (u > 0 ? 30 + 8 * u : 22) + open * 6, h = 14 + open * 38, cY = cy + h * 0.3 * u, lo = cy + h * 0.6;
  const d = `M${r1(cx - w)},${r1(cY)} Q${cx},${r1(cy - h * 0.85)} ${r1(cx + w)},${r1(cY)} Q${r1(cx + w * 0.9)},${r1(lo)} ${cx},${r1(lo)} Q${r1(cx - w * 0.9)},${r1(lo)} ${r1(cx - w)},${r1(cY)}Z`;
  return `<path d="${d}" fill="#5a1f22" stroke="${HUM.colors.ink}" stroke-width="6" stroke-linejoin="round"/><clipPath id="${id}f"><path d="${d}"/></clipPath><g clip-path="url(#${id}f)"><ellipse cx="${cx}" cy="${r1(lo)}" rx="${r1(w * 0.6)}" ry="${r1(h * 0.32)}" fill="#e07a76"/></g>`;
}

// framings: the hook two-shot nudged in, Floey's tight shot (her whole lid, Maya fully out of it)
const HOOK = { camX: 575, camY: 990, zoom: 1.16 };
const FT = { camX: 235, camY: 1190, zoom: 2.5 };
const MED = { ...SH.maya };
const TIGHT = { ...SH.mayaTight };

// the host's bot log (Maya's example) and the check she saves
const LOG = {
  title: "My host's bot log (today)", sub: "Maya's example", cols: ["Bot", "Response"],
  rows: [
    { label: "GPTBot", value: "429 Too many requests", tone: "bad", hi: true },
    { label: "OAI-SearchBot", value: "200 OK", tone: "good" },
    { label: "ClaudeBot", value: "200 OK", tone: "good" },
    { label: "Googlebot", value: "200 OK", tone: "good" },
  ],
};
const CARD = {
  title: "My bot check: 3 steps", sub: "The file asks. The host or CDN decides.", cols: ["Check", "Look for"],
  rows: [
    { label: "1. robots.txt", value: "Allow: GPTBot" },
    { label: "2. Host or CDN rules", value: "GPTBot allowed", tone: "brand", hi: true },
    { label: "3. Host's bot log", value: "No 429 errors", tone: "good" },
  ],
};

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "think", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "worried", pose: "type", floey: F });
const W = { ...HOOK, down: 1, bang: 1, ask: 0, log: 0, rows: 0, hi: 0, card: 0, crows: 0, chi: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);
const cut = (t, s) => wt.set(W, { ...s }, t);
// Floey's slow, unimpressed blink
const blink = (t) => { F.tl.to(F.S, { squint: 1, duration: 0.16 }, t).to(F.S, { squint: 0, duration: 0.22 }, t + 0.42); };

// HOOK0: frame one, she is already hammering the keys, worried, the red pill and a "!" up
MY.look(0, -0.3, 0.9).say(b.hook0.start, M.hook0 || [], "hook0");
F.sfx(0.02, "typing", { d: 2.8 });
wt.to(W, { bang: 0, duration: 0.3 }, b.hook0.start + 1.6);
shot(0, { camX: 590, camY: 975, zoom: 1.22 }, b.hook0.len, "none"); // a slow drift in on the panic
// "Still bounced!": she slams the key, hands up by her head, full panic, the "!" pops again
const BOUNCED = b.hook0.start + 3.2;
F.sfx(BOUNCED - 0.3, "click");
MY.expr(BOUNCED - 0.05, "panic").pose(BOUNCED - 0.05, "panic", 0.2).jolt(BOUNCED + 0.05).look(BOUNCED, -0.9, -0.1);
wt.to(W, { bang: 1, duration: 0.25, ease: "back.out(2)" }, BOUNCED + 0.05);
F.sfx(BOUNCED + 0.5, "boing");
// Floey, unbothered: a slow tilt toward her, then one slow blink
F.tiltTo(b.hook0.start + 0.9, -12, 0.6).look(BOUNCED + 0.1, -0.3, 0).tiltTo(BOUNCED + 0.3, 0, 0.4);
blink(BOUNCED + 0.5);

// REFRAME1: Floey alone on the lid, deadpan; a head bob on "note on the door", then in closer
// on "Not the bouncer." with a tilt and a slow blink
cut(b.hook0.end + 0.1, FT);
F.mood(b.reframe1.start - 0.1, "think").say(b.reframe1.start, M.reframe1 || [], "reframe1")
  .tiltTo(b.reframe1.start + 0.85, 10, 0.12).tiltTo(b.reframe1.start + 1.0, 0, 0.18).sfx(b.reframe1.start + 0.85, "tk")
  .tiltTo(b.reframe1.start + 2.85, -16, 0.35);
blink(b.reframe1.start + 3.4);
shot(b.reframe1.start + 2.75, { ...FT, zoom: 2.75, camY: 1160 }, 1.0, "power2.inOut");
wt.to(W, { bang: 0, duration: 0.01 }, b.reframe1.start);
MY.pose(b.reframe1.start, "rest", 0.4).expr(b.reframe1.start, "worried").look(b.reframe1.start, -0.9, 0);

// the reaction once Floey has finished: Maya, hands frozen, "o" face, a small jolt
cut(b.reframe1.end + 0.05, MED);
MY.expr(b.reframe1.end, "surprised").jolt(b.reframe1.end + 0.1).look(b.reframe1.end, -0.9, -0.1);
F.tiltTo(b.reframe1.end, 0, 0.2);

// DOUBT2: she leans in and looks up toward Floey, head cocked; a "?" and a slow push on the question
MY.pose(b.doubt2.start - 0.05, "rest", 0.3).look(b.doubt2.start, -1, -0.3).tiltTo(b.doubt2.start, -8).leanTo(b.doubt2.start, -3)
  .say(b.doubt2.start, M.doubt2 || [], "doubt2").expr(b.doubt2.start + 0.5, "think").leanTo(b.doubt2.end + 0.1, 0);
shot(b.doubt2.start, { ...MED, zoom: 1.68, camY: 800 }, b.doubt2.len + 0.1, "power1.out");
wt.to(W, { ask: 1, duration: 0.25, ease: "back.out(2)" }, b.doubt2.start + 0.55);
F.sfx(b.doubt2.start + 0.55, "pop");

// TIP3: the two-shot favouring Floey; she looks down at the screen on "Your host.", then back
// with a blink; Maya nods, then types to open her host's bot log
cut(b.doubt2.end + 0.08, SH.floey);
wt.set(W, { down: 0, ask: 0 }, b.doubt2.end + 0.08); // the pill would be sliced at the edge of Floey's shot; the log carries the reason now
F.mood(b.tip3.start - 0.1, "happy").look(b.tip3.start, 0.2, 0.9, 0.15).sfx(b.tip3.start, "tk")
  .say(b.tip3.start, M.tip3 || [], "tip3").look(b.tip3.start + 0.8, -0.2, 0, 0.15).tiltTo(b.tip3.start + 0.8, -8)
  .chips(b.tip3.end - 0.05, 2);
blink(b.tip3.start + 0.95);
MY.tiltTo(b.tip3.start, 0).look(b.tip3.start, -0.9, -0.1).expr(b.tip3.start, "think").nod(b.tip3.start + 0.55, 1)
  .pose(b.tip3.start + 1.65, "type", 0.3).look(b.tip3.start + 1.65, -0.4, 0.9).expr(b.tip3.start + 1.65, "determined");
F.sfx(b.tip3.start + 1.7, "typing", { d: 1.1 });

// the check: her screen, the host's bot log; it arrives with the GPTBot row already on it, the
// other rows tick in one by one, and the log holds through all of Maya's line, so "Everyone
// else got in" is read against the 200 OK rows
const LOGIN = b.tip3.end + 0.02;
wt.set(W, { rows: 0.25 }, LOGIN).to(W, { log: 1, duration: 0.25, ease: "power3.out" }, LOGIN)
  .to(W, { rows: 1, duration: 1.2, ease: "none" }, LOGIN + 0.4);
F.sfx(LOGIN, "whoosh").sfx(LOGIN + 0.4, "tick").sfx(LOGIN + 0.8, "tick").sfx(LOGIN + 1.2, "tick");
// CHECK4: "Too many requests?": the ring grows on the 429 row with a ding
MY.expr(b.check4.start - 0.1, "surprised").say(b.check4.start, M.check4 || [], "check4").look(b.check4.start, -0.3, 0.9);
wt.to(W, { hi: 1, duration: 0.45, ease: "power2.out" }, LOGIN + 1.6);
F.sfx(LOGIN + 1.6, "ding");
MY.expr(b.check4.start + 1.3, "annoyed");
// out of the screen onto her face once she has finished: eyes narrowed at the laptop
wt.to(W, { log: 0, duration: 0.18, ease: "power2.in" }, b.check4.end + 0.02);
cut(b.check4.end + 0.2, TIGHT);
MY.pose(b.check4.end, "crossed", 0.35).look(b.check4.end, -0.5, 0.8).tiltTo(b.check4.end + 0.2, -4, 0.3);

// PAYOFF5: wide: Floey lifts off the lid and hovers by Maya's head; Maya, arms crossed, stares
// at the laptop; on "slow down" in on the two of them, Floey leans in, Maya's eyes slide over
F.takeoff(b.payoff5.start + 0.3).move(b.payoff5.start + 0.5, SP.floeyHover.x, SP.floeyHover.y, 0.6, "power2.inOut")
  .mood(b.payoff5.start, "happy").say(b.payoff5.start, M.payoff5 || [], "payoff5");
cut(b.payoff5.start + 0.42, SH.wide);
shot(b.payoff5.start + 1.3, { ...SH.floey, camY: 900 }, 0.7, "power2.inOut");
F.tiltTo(b.payoff5.start + 2.1, 14, 0.3).sfx(b.payoff5.start + 2.1, "tk");
MY.tiltTo(b.payoff5.start + 0.4, 0, 0.3).look(b.payoff5.start + 2.15, -1, -0.3, 0.4).expr(b.payoff5.start + 2.15, "deadpan");

// PAYOFF6: Maya alone: "Right." and she saves; her 3-step check is on screen while she says it
cut(b.payoff5.end + 0.01, MED);
F.tiltTo(b.payoff5.end, 0).land(b.payoff5.end + 0.01, SP.floeyLaptop.x, SP.floeyLaptop.y, 0.45).sfx(b.payoff5.end + 0.01, "flutter"); // back to the lid, out of frame
MY.expr(b.payoff6.start - 0.1, "determined").look(b.payoff6.start - 0.1, -0.4, 0.9).pose(b.payoff6.start - 0.15, "type", 0.25).tiltTo(b.payoff6.start, 0, 0.2)
  .say(b.payoff6.start, M.payoff6 || [], "payoff6").nod(b.payoff6.start + 0.05, 1);
const CARDIN = b.payoff6.start + 0.55;
wt.set(W, { crows: 0.34 }, CARDIN).to(W, { card: 1, duration: 0.25, ease: "power3.out" }, CARDIN)
  .to(W, { crows: 1, duration: 0.4, ease: "none" }, CARDIN + 0.25)
  .to(W, { chi: 1, duration: 0.35, ease: "power2.out" }, CARDIN + 0.7);
F.sfx(CARDIN, "whoosh").sfx(CARDIN + 0.45, "tick");
const CARDOUT = b.button7.start - 0.14;
wt.to(W, { card: 0, duration: 0.14, ease: "power2.in" }, CARDOUT - 0.14);

// BUTTON7: Floey, back on the lid, turns to the lens: "You're welcome." and a tiny preen
cut(CARDOUT, FT);
F.pivot(b.button7.start - 0.06, "front").mood(b.button7.start - 0.1, "happy").look(b.button7.start - 0.1, 0, 0)
  .say(b.button7.start, M.button7 || [], "button7").preen(b.button7.end + 0.02, 0.6);
MY.pose(b.button7.start - 0.3, "crossed", 0.3).expr(b.button7.start - 0.3, "annoyed").look(b.button7.start - 0.3, -0.8, 0);
// the button: cut to Maya, she turns to the lens and holds one long flat look
const LOOK = b.button7.end + 0.45;
cut(LOOK, TIGHT);
MY.look(LOOK + 0.2, 0, 0, 0.35).tiltTo(LOOK + 0.2, 3, 0.35).expr(LOOK + 0.35, "deadpan");
shot(LOOK, { ...TIGHT, zoom: 2.3, camY: 745 }, END - LOOK, "none");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// Maya with this scene's mouths
function maya(t) {
  const st = MY.state(t), u = FRET[st.expr], s = MY.svg(t);
  if (u === undefined) return s;
  const open = EX[st.expr].round ? Math.max(st.mouth, 0.2) : st.mouth;
  return s.replace(OPEN, (all, id) => fretMouth(open, u, id));
}
// the pill sits above her bun, small enough for the hook two-shot and her medium shot
const PX = 720, PY = 455;
const pill = (k, text, tone) => k > 0.01 ? `<g transform="translate(${PX} ${PY}) scale(.7) translate(${-PX} ${-PY})">${DUO.stat(PX, PY, k, text, tone)}</g>` : "";
// the cutaways are her laptop screen: the room goes dark behind them
// they pop in place (a fade and a small scale) instead of sliding up over the captions
const screen = (k, inner) => k > 0.01 ? `<g opacity="${r1(Math.min(1, k * 1.5) * 100) / 100}"><rect width="1080" height="1920" fill="#2d2f45" opacity=".96"/><g transform="translate(540 900) scale(${(0.92 + 0.08 * k).toFixed(3)}) translate(-540 -900)">${inner}</g></g>` : "";
window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const world = DUO.room(t, { night: true }) + maya(t) + DUO.deskFront() + DUO.laptop() + F.svg(t)
    + pill(W.down, "GPTBot: refused", "bad") + DUO.mark("!", 830, 690, W.bang, t) + DUO.mark("?", 865, 650, W.ask, t);
  document.getElementById("stage").innerHTML = DUO.cam(world, W)
    + screen(W.log, DUO.listInsert(1, W.rows, { ...LOG, hiK: W.hi }))
    + screen(W.card, DUO.listInsert(1, W.crows, { ...CARD, hiK: W.chi }))
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
