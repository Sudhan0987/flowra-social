<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>

<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}

</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r026 "A... Tuesday?" (duo style, night set).
// Frame one: her flat, wobbly clicks chart pinned at the top, Maya panicking under it with a "?".
// Floey: when did you rewrite it? Maya: "A... Tuesday?". The tip: mark the date on the Performance chart, then Compare.
// Shown happening: right-click menu "Add annotation"; she looks up the real date in her post's revisions (Wed 14 Oct),
// the tag "Rewrote it, Wed 14 Oct" drops on the chart with a green tick, then the chart redraws as a comparison.
// The check card: page +25%, whole site +5%. "Oh. It actually worked." Celebratory sip: cold.
// The save card (three steps, row one "Wed 14 Oct"). Floey, to camera: "It was a Wednesday." Maya's flat stare, "?". End card.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story. Two are longer so the acting fits:
// tip5 (the steps happen on her screen: the date, the tag, the comparison) and payoff8 (the cold sip)
const GAP = { hook0: 0.35, reframe1: 0.25, reframe2: 0.5, reframe3: 0.3, doubt4: 0.2, tip5: 3.2, check6: 0.35, payoff7: 0.25, payoff8: 1.8, button9: 0.4, button10: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
// the silent stare after the last line plays out before the end card
const END = Math.max(SPOKEN + 0.6, b.button10.end + 2.3), DUR = END + 1.6;

// ---------- shots for this reel (named shots nudged so nobody is sliced and cards never cover a face) ----------
const HOOK = { camX: 600, camY: 685, zoom: 1.15 };     // Maya under the pinned chart, Floey bottom left
const FLO2 = { camX: 470, camY: 960, zoom: 1.45 };     // floey: a two-shot favouring Floey, Maya's face whole
const TWO = { camX: 580, camY: 900, zoom: 1.35 };      // a two-shot favouring Maya (her shrug)
const MT = { camX: 640, camY: 825, zoom: 2.0 };      // mayaTight: her face, Floey fully off frame
const POINT = { camX: 520, camY: 900, zoom: 1.4 };     // pulls out so her point lands on the laptop and Floey
const TIPF = { camX: 480, camY: 940, zoom: 1.5 };      // floey, a little closer for the tip
const UNDER_C = { camX: 500, camY: 680, zoom: 1.1 };   // both under the pinned chart
const UNDER_L = { camX: 490, camY: 801, zoom: 1.25 };  // both under the pinned check card
const PAYF = { camX: 450, camY: 820, zoom: 1.35 };     // favouring Floey under the check card
const SAVEW = { camX: 540, camY: 731, zoom: 1.15 };    // both under the save card
const SAVEF = { camX: 470, camY: 745, zoom: 1.3 };     // favouring Floey under the save card
const STARE = { camX: 700, camY: 707, zoom: 1.6 };     // Maya's face under the save card, Floey off frame

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "think", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: "panic", floey: F });
const SIPPING = { L: [262, 640], R: [336, 400], hold: "mug" };     // the mug up at her lips
const POINT_UP = { L: [70, 300], R: [372, 705], kL: "point" };   // pointing over the lid at Floey (a lower point hides behind the laptop)
const SNAP = { L: [228, 705], R: [505, 475], hold: "phone" };    // her phone held up beside her, snapping the card (not at her ear)
const W = { ...HOOK, shake: 1, q: 1, qT: 0,chart: 1, menu: 0, menuHi: 0, tag: 0, cmp: 0, cmpDraw: 0, rev: 0, revRows: 0, revHi: 0,
  chk: 0, rows: 0, hi: 0, pill: 0, save: 0, saveRows: 0, saveHi: 0, q2: 0, end: 0, _t: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);
const cut = (t, s) => wt.set(W, { ...s }, t);

// HOOK0: frame one is the problem: the squiggle chart already up, Maya mid-panic under it, a "?" by her head.
// Floey, unbothered on the lid, preens while Maya panics.
MY.look(0, -0.2, -0.9).say(b.hook0.start, M.hook0 || [], "hook0");
F.sfx(0.05, "pop");
wt.to(W, { shake: 0, duration: 0.9, ease: "power2.out" }, 0);
F.look(0.2, 0, 0).preen(b.hook0.start + 0.7, 0.8);
// "The chart's still a squiggle!": a jolt, hands to her cheeks
const sqWord = b.hook0.start + b.hook0.len * 0.72;
MY.jolt(sqWord).pose(sqWord + 0.05, "cheeks", 0.25).look(sqWord, -0.1, -1);
shot(b.hook0.start + 0.4, { camX: 610, camY: 690, zoom: 1.16 }, 2.2, "sine.inOut");

// REFRAME1: the chart slides away; Floey, flat: a slow head tilt, one deadpan blink. Maya's hands come down.
wt.to(W, { chart: 0, q: 0, duration: 0.25, ease: "power2.in" }, b.reframe1.start - 0.35);
F.sfx(b.reframe1.start - 0.35, "swish");
cut(b.reframe1.start - 0.1, FLO2);
F.tiltTo(b.reframe1.start, 16, 0.6).say(b.reframe1.start, M.reframe1 || [], "reframe1")
  .wink(b.reframe1.end - 0.3).tiltTo(b.reframe1.end + 0.05, 0, 0.2);
MY.pose(b.reframe1.start - 0.1, "rest", 0.4).expr(b.reframe1.start - 0.1, "worried").look(b.reframe1.start, -0.9, 0)
  .expr(b.reframe1.start + b.reframe1.len * 0.7, "think").look(b.reframe1.start + b.reframe1.len * 0.7, -0.4, -0.9);

// REFRAME2: whip to the two-shot favouring Maya: "A... Tuesday?" with a shrug, worried, a "?" pops by her head
shot(b.reframe2.start - 0.25, TWO, 0.3, "power4.out");
MY.expr(b.reframe2.start - 0.1, "worried").pose(b.reframe2.start - 0.1, "shrug", 0.3).look(b.reframe2.start, -0.8, -0.2)
  .tiltTo(b.reframe2.start + 0.35, -7, 0.4).say(b.reframe2.start, M.reframe2 || [], "reframe2");
const tue = b.reframe2.start + b.reframe2.len * 0.45;
wt.to(W, { qT: 1, duration: 0.25, ease: "back.out(2)" }, tue);
F.sfx(tue, "boing");
// Floey on the lid, not impressed: she turns her head to Maya and holds it, flat
F.look(b.reframe2.start + 0.2, 0, 0.2, 0.3).tiltTo(b.reframe2.start + 0.6, -8, 0.4);

// REFRAME3: back on Floey: she preens, unbothered, and looks back to Maya on "weeks".
// Reaction cut to Maya: surprised, her shoulders drop.
cut(b.reframe3.start - 0.1, SH.floey);
wt.to(W, { qT: 0, duration: 0.2 }, b.reframe3.start - 0.1);
F.tiltTo(b.reframe3.start - 0.1, 0, 0.2).say(b.reframe3.start, M.reframe3 || [], "reframe3").preen(b.reframe3.start + 0.15, 0.85).look(b.reframe3.start + 1.05, 0, 0);
MY.tiltTo(b.reframe3.start, 0, 0.3).pose(b.reframe3.start, "rest", 0.4).expr(b.reframe3.start, "think").look(b.reframe3.start, -0.9, 0);
const react = b.reframe3.start + b.reframe3.len * 0.68;
cut(react, MT);
MY.expr(react - 0.05, "surprised").slump(react + 0.1, 0.45);

// DOUBT4: still on Maya, a slow push: annoyed, arms crossed, a flat stare at Floey (small mouth: a flat voice).
// On "squiggle" she points at the laptop; the camera pulls out so the point lands on Floey's lid.
MY.expr(b.doubt4.start - 0.1, "annoyed").pose(b.doubt4.start - 0.15, "crossed", 0.3).sit(b.doubt4.start, 0.3).look(b.doubt4.start, -1, 0.1)
  .say(b.doubt4.start, (M.doubt4 || []).map((v) => v * 0.14), "doubt4");
shot(b.doubt4.start, { camX: 630, camY: 832, zoom: 2.1 }, 0.8, "sine.inOut");
const sq2 = b.doubt4.start + b.doubt4.len * 0.62;
MY.pose(sq2, POINT_UP, 0.25).look(sq2, -1, 0.3);
shot(sq2, POINT, 0.4, "power3.out");
F.sfx(sq2 + 0.05, "tick").tiltTo(sq2 + 0.2, 10, 0.25);

// TIP5: Floey, a little closer: a wink on "No date on it"
cut(b.tip5.start - 0.1, TIPF);
F.mood(b.tip5.start - 0.1, "determined").tiltTo(b.tip5.start - 0.1, 0, 0.15).say(b.tip5.start, M.tip5 || [], "tip5").wink(b.tip5.start + 0.5);
MY.pose(b.tip5.start, "chin", 0.35).expr(b.tip5.start, "think").look(b.tip5.start, -1, 0);
// "Right-click the Performance chart": her chart pins back in, both under it; she types
const chartIn = b.tip5.start + 1.0;
wt.to(W, { chart: 1, duration: 0.35, ease: "power3.out" }, chartIn);
F.sfx(chartIn, "whoosh");
shot(chartIn, UNDER_C, 0.5);
MY.pose(chartIn + 0.15, "type", 0.3).expr(chartIn + 0.15, "neutral").look(chartIn + 0.15, -0.3, 0.7);
F.sfx(chartIn + 0.35, "typing", { d: 0.6 }).look(chartIn + 0.2, 0, 0.3);
// the right-click: a menu opens on the chart; "Add annotation" lights up as Floey says it
const menuAt = b.tip5.start + 2.1, annAt = b.tip5.start + b.tip5.len * 0.58;
wt.to(W, { menu: 1, duration: 0.2, ease: "back.out(2)" }, menuAt).to(W, { menuHi: 1, duration: 0.25 }, annAt);
F.sfx(menuAt, "click").chips(annAt, 1);
// "Then Compare.": Floey stands tall, Maya nods along
const cmpWord = b.tip5.start + b.tip5.len * 0.82;
F.chips(cmpWord, 1).tiltTo(cmpWord, -6, 0.2).tiltTo(b.tip5.end + 0.2, 0, 0.2);
MY.nod(cmpWord, 1);

// the gap: the tip happening, one step at a time.
// 1. what day was it? Her post's revisions: Big rewrite, Wed 14 Oct. Her face: Wednesday. Floey: a smug look.
const g0 = b.tip5.end;
wt.to(W, { chart: 0, menu: 0, duration: 0.25, ease: "power2.in" }, g0 + 0.05)
  .to(W, { rev: 1, duration: 0.35, ease: "power3.out" }, g0 + 0.3)
  .to(W, { revRows: 1, duration: 0.3, ease: "power1.out" }, g0 + 0.3)
  .to(W, { revHi: 1, duration: 0.3, ease: "back.out(1.6)" }, g0 + 0.95);
F.sfx(g0 + 0.3, "whoosh").sfx(g0 + 0.95, "ding");
MY.expr(g0 + 0.1, "think").look(g0 + 0.1, -0.2, -0.8).pose(g0 + 0.1, "rest", 0.3)
  .expr(g0 + 1.05, "deadpan").look(g0 + 1.2, -0.9, 0);
F.mood(g0 + 1.0, "happy").look(g0 + 1.0, 0, 0.1);
// 2. back to the chart: she types it in, the tag drops on that day with a green tick
const tagAt = g0 + 1.75;
wt.to(W, { rev: 0, duration: 0.25, ease: "power2.in" }, g0 + 1.45)
  .to(W, { chart: 1, duration: 0.3, ease: "power3.out" }, g0 + 1.55)
  .to(W, { tag: 1, duration: 0.35, ease: "back.out(2)" }, tagAt);
MY.pose(g0 + 1.45, "type", 0.25).expr(g0 + 1.45, "neutral").look(g0 + 1.45, -0.3, 0.7);
F.sfx(tagAt + 0.05, "click").mood(tagAt, "determined");
// 3. Compare: the same weeks before vs after, solid "after" above dotted "before"
const cmpAt = g0 + 2.4;
wt.to(W, { cmp: 1, duration: 0.15 }, cmpAt).to(W, { cmpDraw: 1, duration: 0.6, ease: "power1.inOut" }, cmpAt + 0.05);
F.sfx(cmpAt, "tick");
MY.expr(cmpAt + 0.3, "surprised").look(cmpAt + 0.3, -0.2, -0.6);

// CHECK6: the chart goes, the check card pins over the top; both of them under it.
// Rows land on her words; she reads in the chin pose, bright and lifting to happy. The "+25%" pill pops.
const chk = b.check6.start - 0.35;
wt.to(W, { chart: 0, duration: 0.2, ease: "power2.in" }, chk - 0.1)
  .to(W, { chk: 1, duration: 0.4, ease: "power3.out" }, chk);
F.sfx(chk, "whoosh");
shot(chk, UNDER_L, 0.45);
MY.pose(chk, "chin", 0.35).expr(b.check6.start - 0.05, "surprised").look(chk, 0.1, -0.8).say(b.check6.start, M.check6 || [], "check6");
const row2 = b.check6.start + b.check6.len * 0.55;
wt.to(W, { rows: 0.5, duration: 0.25, ease: "power2.out" }, chk + 0.05)
  .to(W, { pill: 1, duration: 0.3, ease: "back.out(2)" }, b.check6.start + 0.7)
  .to(W, { rows: 1, duration: 0.3, ease: "power2.out" }, row2);
F.sfx(b.check6.start + 0.7, "ding").sfx(row2, "tick");
MY.expr(row2 + 0.15, "happy").look(row2 + 0.2, -0.8, 0);
F.mood(b.check6.start, "hello").tiltTo(b.check6.start + 0.8, 14, 0.3).look(b.check6.start + 0.8, 0, -0.4).tiltTo(b.check6.end, 0, 0.2);

// PAYOFF7: favouring Floey under the card: she chips, a ring grows round the page row on "beat the site",
// a satisfied preen on "That's the rewrite". The pill fades.
shot(b.payoff7.start - 0.15, PAYF, 0.6);
wt.to(W, { pill: 0, duration: 0.25 }, b.payoff7.start);
F.mood(b.payoff7.start - 0.1, "happy").look(b.payoff7.start - 0.1, 0, 0).say(b.payoff7.start, M.payoff7 || [], "payoff7").chips(b.payoff7.start + 0.1, 1);
const beat = b.payoff7.start + b.payoff7.len * 0.38;
wt.to(W, { hi: 1, duration: 0.3, ease: "back.out(1.6)" }, beat);
F.sfx(beat, "ding").preen(b.payoff7.start + b.payoff7.len * 0.6, 0.8);
MY.pose(b.payoff7.start, "rest", 0.4).expr(b.payoff7.start, "think").look(b.payoff7.start, 0.1, -0.9)
  .expr(beat + 0.2, "surprised").look(beat + 0.2, -0.9, 0);

// PAYOFF8: the card goes; tight on Maya: "Oh." surprised, then "It actually worked." happy, a small fist
wt.to(W, { chk: 0, duration: 0.25, ease: "power2.in" }, b.payoff8.start - 0.3);
F.sfx(b.payoff8.start - 0.3, "swish");
cut(b.payoff8.start - 0.05, MT);
shot(b.payoff8.start, { camX: 650, camY: 830, zoom: 2.05 }, 1.0, "power2.out");
MY.expr(b.payoff8.start - 0.05, "surprised").look(b.payoff8.start, -0.3, 0.2).say(b.payoff8.start, M.payoff8 || [], "payoff8");
const yes = b.payoff8.start + b.payoff8.len * 0.35;
MY.expr(yes, "happy").pose(yes, "fist", 0.25).look(yes, -0.8, 0).nod(yes + 0.2, 1);
F.sfx(yes + 0.15, "pop");

// the silent beat: a celebratory sip... it's cold. A flat look at the mug, set down.
const sip = b.payoff8.end + 0.05;
shot(sip, { camX: 700, camY: 820, zoom: 1.9 }, 0.4, "power2.out");
MY.expr(sip, "proud").pose(sip, "mug", 0.25).pose(sip + 0.28, SIPPING, 0.25).look(sip, 0.3, 0.3);
F.sfx(sip + 0.55, "sip");
const cold = sip + 0.8;
MY.expr(cold, "annoyed").pose(cold, "mug", 0.2).look(cold, 0.7, 0.6).slump(cold, 0.3);
F.sfx(cold + 0.05, "boing");
const down = cold + 0.45;   // set down before she raises her phone for the save card
MY.pose(down, "rest", 0.2).sit(down + 0.1, 0.3).look(down + 0.15, -0.6, 0.2);
F.sfx(down + 0.05, "tap");

// BUTTON9: the save card pins over the top; both under it. To herself, phone up, snapping the card;
// on "next rewrite" her eyes slide to the camera.
shot(b.button9.start - 0.3, SAVEW, 0.55);
wt.to(W, { save: 1, duration: 0.4, ease: "power3.out" }, b.button9.start - 0.05)
  .to(W, { saveRows: 1, duration: 0.6, ease: "power1.out" }, b.button9.start + 0.1);
F.sfx(b.button9.start - 0.05, "whoosh");
MY.expr(b.button9.start - 0.1, "proud").pose(b.button9.start - 0.1, SNAP, 0.35).look(b.button9.start, -0.4, -0.6).say(b.button9.start, M.button9 || [], "button9");
F.sfx(b.button9.start + 1.0, "click");
const eyes = b.button9.start + b.button9.len * 0.6;
MY.look(eyes, 0, 0, 0.3).expr(eyes, "smug");
F.mood(b.button9.start, "hello").look(b.button9.start + 0.3, 0, -0.3);

// BUTTON10: a ring on row one (Wed 14 Oct); Floey looks up at it, pivots front to the camera: "It was a Wednesday."
const ring = b.button10.start - 0.45;
wt.to(W, { saveHi: 1, duration: 0.3, ease: "back.out(1.6)" }, ring);
F.sfx(ring, "ding").tiltTo(ring, -22, 0.25).look(ring, 0.3, -1);
shot(ring, SAVEF, 0.6);
MY.pose(ring, "rest", 0.35).expr(ring + 0.1, "deadpan").look(ring + 0.1, -0.8, 0);
F.tiltTo(b.button10.start - 0.1, 0, 0.12).look(b.button10.start - 0.1, 0, 0).pivot(b.button10.start - 0.1, "front").mood(b.button10.start - 0.1, "hello")
  .say(b.button10.start, M.button10 || [], "button10").preen(b.button10.end + 0.1, 0.6);
MY.expr(b.button10.start + b.button10.len * 0.5, "annoyed");

// the stare: cut to Maya's face under the card: annoyed, arms crossed, a slow turn to the camera, a "?" pops
const stare = b.button10.end + 0.15;
cut(stare, STARE);
MY.expr(stare, "annoyed").pose(stare, "crossed", 0.25).look(stare, -0.8, 0).look(stare + 0.4, 0, 0, 0.7).tiltTo(stare + 0.4, 3, 0.7);
wt.to(W, { q2: 1, duration: 0.25, ease: "back.out(2)" }, stare + 1.25);
F.sfx(stare + 1.25, "boing");
shot(stare + 0.3, { camX: 700, camY: 712, zoom: 1.68 }, 1.6, "sine.out");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// ---------- what is on her screen ----------
const INK = HUM.colors.ink, GOOD = "#2f9e62";
const x0 = 150, x1 = 930, y0 = 760, y1 = 1180;
const px = (i, n) => x0 + (x1 - x0) * i / (n - 1), py = (v) => y1 - (y1 - y0) * v;
// her post's clicks, six weeks, the rewrite three weeks back (index 3): a flat squiggle
const PTS = [0.42, 0.5, 0.37, 0.47, 0.42, 0.52, 0.44];
// the comparison: the same three weeks before (dotted) and after (solid) the date
const BEFORE = [0.36, 0.43, 0.37, 0.44, 0.39, 0.46, 0.41], AFTER = [0.46, 0.55, 0.5, 0.58, 0.53, 0.62, 0.57];
const TAG = "Rewrote it, Wed 14 Oct";
// overlays drawn inside the chart card (same transform as the card)
function chartExtras() {
  let s = "";
  if (W.cmp < 0.5) {
    // the right-click menu
    if (W.menu > 0.01 && W.tag < 0.5) {
      const mx = px(3, 7) + 20, my = py(PTS[3]) + 18, mw = PROPS.measure("Add annotation", "700 34px 'Public Sans'") + 60;
      s += `<g opacity="${Math.min(1, W.menu * 2).toFixed(2)}" transform="translate(${mx} ${my}) scale(${(0.8 + 0.2 * W.menu).toFixed(3)})">`
        + `<rect x="4" y="6" width="${mw.toFixed(1)}" height="86" rx="14" fill="${INK}" opacity=".18"/>`
        + `<rect x="0" y="0" width="${mw.toFixed(1)}" height="86" rx="14" fill="#fff" stroke="${INK}" stroke-width="5"/>`
        + `<rect x="8" y="8" width="${(mw - 16).toFixed(1)}" height="70" rx="10" fill="${HUM.colors.magenta}" opacity="${(0.18 * W.menuHi).toFixed(2)}"/>`
        + `<rect x="8" y="8" width="${(mw - 16).toFixed(1)}" height="70" rx="10" fill="none" stroke="${HUM.colors.magenta}" stroke-width="5" opacity="${W.menuHi.toFixed(2)}"/>`
        + `<text x="30" y="55" font-family="Public Sans" font-weight="700" font-size="34" fill="${INK}">Add annotation</text></g>`
        + `<path d="M${mx - 14},${my - 30} l0,40 l10,-9 l8,17 l7,-3 l-8,-17 l13,-1Z" fill="#fff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    }
    // the annotation: a dashed line on that day, a dot, the tag with a green tick
    if (W.tag > 0.01) {
      const ax = px(3, 7), ay = py(PTS[3]), drop = (1 - Math.min(1, W.tag)) * -40;
      const tw = PROPS.measure(TAG, "700 34px 'Space Grotesk'") + 40, tagX = ax - (tw + 60) / 2;
      s += `<g opacity="${Math.min(1, W.tag * 1.6).toFixed(2)}"><path d="M${ax},${838} V${y1}" stroke="${HUM.colors.magenta}" stroke-width="5" stroke-dasharray="14 12"/>`
        + `<circle cx="${ax}" cy="${(ay + drop).toFixed(1)}" r="16" fill="${HUM.colors.magenta}" stroke="${INK}" stroke-width="5"/>`
        + `<g transform="translate(0 ${drop.toFixed(1)})"><rect x="${tagX.toFixed(1)}" y="770" width="${tw.toFixed(1)}" height="64" rx="18" fill="${HUM.colors.magenta}" stroke="${INK}" stroke-width="5"/>`
        + `<text x="${(tagX + tw / 2).toFixed(1)}" y="814" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="34" fill="#fff">${TAG}</text>`
        + `<circle cx="${(tagX + tw + 34).toFixed(1)}" cy="802" r="28" fill="${GOOD}" stroke="${INK}" stroke-width="5"/>`
        + `<path d="M${(tagX + tw + 21).toFixed(1)},803 l9,9 l17,-19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
    }
  } else {
    // the comparison: the dotted "before" line under the solid "after" line, and a legend
    const d = BEFORE.map((v, i) => `${i ? "L" : "M"}${px(i, 7).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    s += `<path d="${d}" fill="none" stroke="#8a8796" stroke-width="8" stroke-dasharray="4 16" stroke-linecap="round"/>`;
    s += `<path d="M${x0},1258 h56" stroke="${GOOD}" stroke-width="10" stroke-linecap="round"/><text x="${x0 + 74}" y="1270" font-family="Public Sans" font-weight="700" font-size="34" fill="${INK}">After</text>`
      + `<path d="M${x0 + 220},1258 h56" stroke="#8a8796" stroke-width="8" stroke-dasharray="4 16" stroke-linecap="round"/><text x="${x0 + 294}" y="1270" font-family="Public Sans" font-weight="700" font-size="34" fill="${INK}">Before</text>`;
  }
  return s;
}
function chartCard() {
  if (W.chart <= 0.01) return "";
  const cmp = W.cmp >= 0.5;
  const s = DUO.screenInsert(W.chart, cmp ? Math.max(0.01, W.cmpDraw) : 1, cmp
    ? { title: "Compare: 3 wks before vs after", points: AFTER, color: GOOD }
    : { title: "Performance: my post's clicks", points: PTS, color: "#e08a1e" });
  return s.slice(0, -4) + chartExtras() + "</g>";
}
const REVS = { title: "My post: revisions", sub: "From my blog's editor", cols: ["Change", "Date"],
  rows: [{ label: "Big rewrite", value: "Wed 14 Oct", tone: "brand", hi: true }, { label: "Typo fix", value: "Sat 3 Oct" }, { label: "First published", value: "Mon 1 Jun" }] };
const CHECK = { title: "Same dates, 3 wks", sub: "My example numbers. Tagged Wed 14 Oct", cols: ["Clicks, before to after", "Change"],
  rows: [{ label: "This page: 120 to 150", value: "+25%", tone: "good", hi: true }, { label: "Whole site: 2,000 to 2,100", value: "+5%", tone: "good" }] };
const SAVECARD = { title: "Did my rewrite work?", sub: "Search Console, Performance", cols: ["Step", "Mine"],
  rows: [{ label: "1  Tag the date", value: "Wed 14 Oct", tone: "brand", hi: true }, { label: "2  Wait a few weeks", value: "3 wks" },
    { label: "3  Compare page vs site", value: "Page won", tone: "good" }] };

// a card pinned at the top of the frame, smaller, without the dimmed room behind it, so faces stay in view under it
const DIM = '<rect width="1080" height="1920" fill="#2d2f45" opacity=".55"/>';
const pin = (s, k = 0.9, top = 215) => s ? `<g transform="translate(540 ${top}) scale(${k}) translate(-540 -560)">${s.replace(DIM, "")}</g>` : "";
// the camera, with a small panic shake on the opening that settles by 0.9 s
const camAt = () => ({ camX: W.camX + Math.sin(W._t * 47) * 7 * W.shake, camY: W.camY + Math.cos(W._t * 41) * 5 * W.shake, zoom: W.zoom });
// one mug: on the desk until it is in her hand
const mugHeld = (t) => t > sip + 0.125 && t < down + 0.1;
// her coffee went cold long ago: no steam on the mug in her hand
const coldMug = (s) => s.replace(/<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/, "");

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false); W._t = t;
  const world = DUO.room(t, { night: true }) + coldMug(MY.svg(t)) + DUO.deskFront() + DUO.laptop() + (mugHeld(t) ? "" : DUO.mug()) + F.svg(t)
    + DUO.mark("?", 905, 785, W.q, t) + DUO.mark("?", 850, 690, W.qT, t) +DUO.stat(430, 620, W.pill, "+25%", "good") + DUO.mark("?", 840, 700, W.q2, t);
  document.getElementById("stage").innerHTML = DUO.cam(world, camAt())
    + pin(chartCard())
    + pin(DUO.listInsert(W.rev, W.revRows, { ...REVS, hiK: W.revHi }))
    + pin(DUO.listInsert(W.chk, W.rows, { ...CHECK, hiK: W.hi }))
    + (W.end < 0.5 ? pin(DUO.listInsert(W.save, W.saveRows, { ...SAVECARD, hiK: W.saveHi })) : "")
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); W._t = t; return camAt(); };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
