<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r035 "A brief history of bread". Duo style, day (late afternoon). The shape of reel/duo/template.html.
// Frame one: Maya close, stabbing the keys, flat and fed up, sweat drops by her head. On "all afternoon"
// her hands stop, she slumps, we push in. Hard cut: Floey alone on the lid, a slow blink, a tilt towards
// the typing: "Fixing what?". Wide: hands up, "a brief history of bread!", Floey peeks over the lid at the
// screen, then chips back at her. Floey alone, smug: "It followed the outline it wrote." Wide: arms
// crossed, leaning back, one brow up: "I skimmed it." Floey preens, unbothered. Floey alone again: she
// lifts off and hovers over the lid for the tip, a chip on "first". Wide: Maya types. Cutaway: the
// outline, row by row as she reads it; the ring lands on the bread row; Keep becomes Cut; click; three
// rows left. Back on Maya, mug in hand: "Oh. One line. My whole afternoon." A slow sip, the mug at her
// lips. Cold. Floey, to Maya: "Want a brief history of cold coffee?" and a wink. Maya's flat look to camera.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.35, body1: 0.2, body2: 0.3, reframe3: 0.35, doubt4: 0.3, tip5: 0.4, check6: 2.0, payoff7: 1.6, button8: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
const at = (id, k) => b[id].start + k * b[id].len;     // k of the way through a line
// the button needs its silent beat after the line: Maya's flat look to camera
const END = Math.max(SPOKEN + 0.6, b.button8.end + 2.4), DUR = END + 1.6;

// ---------- shots for this reel (named shots, nudged so nobody is sliced) ----------
const HOOK = { camX: 680, camY: 900, zoom: 1.7 };      // Maya close, her arms at the keys (Floey off at the left)
const PUSH = { ...SH.mayaTight, camY: 770, zoom: 2.0 }; // "all afternoon": her face fills the frame
const TIGHT = { camX: 226, camY: 1005, zoom: 2.5 };    // floeyTight: Floey fills the frame, Maya out at the right
const TIGHT2 = { camX: 236, camY: 1000, zoom: 2.7 };   // the reframe push-in
const WIDE2 = { ...SH.wide, camX: 575, camY: 995, zoom: 1.16 }; // a touch inside the wide, nobody sliced
const DOUBT = { camX: 590, camY: 990, zoom: 1.2 };     // a little inside the wide, it drifts out to the wide
const TIP = { camX: 182, camY: 975, zoom: 2.0 };       // floeyTight, nudged up: Floey over the lid, Maya out
const TIP2 = { camX: 196, camY: 935, zoom: 2.3 };     // "Fix the outline first": in on Floey
const PAY = { ...SH.maya, camX: 712, camY: 812, zoom: 1.66 }; // Maya, mug in hand, Floey out
const COLD = { camX: 690, camY: 790, zoom: 1.85 };     // the snap in on the cold sip
const LAST = { camX: 650, camY: 790, zoom: 1.95 };     // the silent look to camera
const LAST2 = { camX: 650, camY: 785, zoom: 2.05 };

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "think", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "annoyed", pose: "type", floey: F });
const W = { ...HOOK, sweat: 1, list: 0, rows: 0, ring: 0, cut: 0, gone: 0, cold: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
// Every camera move and prop change is a fromTo that starts exactly where the last one on that value
// ended, and they never overlap, so any frame seeked in any order gives the same picture.
const last = {}, lastEnd = {};
function key(t, vals, d = 0.3, ease = "power2.out") {
  const from = {}, ks = Object.keys(vals);
  let t0 = t;
  for (const k of ks) { from[k] = k in last ? last[k] : W[k]; t0 = Math.max(t0, lastEnd[k] ?? 0); }
  wt.fromTo(W, from, { ...vals, duration: d, ease, immediateRender: false }, t0);
  for (const k of ks) { last[k] = vals[k]; lastEnd[k] = t0 + d; }
}
const cam = (s) => ({ camX: s.camX, camY: s.camY, zoom: s.zoom });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => key(t, cam(s), d, ease);
const cutTo = (t, s) => key(t, cam(s), 0.001, "none");
const setW = (t, vals) => key(t, vals, 0.001, "none");
// Floey's slow, deadpan blink
const slowBlink = (t, hold = 0.2) => { F.tl.to(F.S, { squint: 1, duration: 0.2, ease: "power2.in" }, t); F.tl.to(F.S, { squint: 0, duration: 0.28, ease: "power2.out" }, t + 0.2 + hold); };
const AT_LAPTOP = [-0.4, 0.9], AT_FLOEY = [-1, 0.4];
// the mug lifted to her lips (the elbow and the tilted mug are set in sipFix below)
const SIP = { L: [262, 640], R: [356, 364], hold: "mug" };
// still hands over the keys (the type pose without the typing)
const FROZEN = { L: [252, 676], R: [348, 676] };
const KEYS_X = 470, MUG_X = 900, HOVER = [262, 905];

// a sceptical face for the doubt: narrowed eyes, a flat mouth pulled to one side (one brow goes up in the draw)
MAYA.EXPR.sceptic = { brow: [-10, 8], eye: 0.52, smile: -0.1, w: 0.6, blush: 0, side: 1 };

// Acting on Maya's face the rig can't do from outside: held stares with no stray blink.
const STARE = [];
const mayaState = MY.state;
MY.state = (t) => { const s = mayaState(t); if (STARE.some(([a, z]) => t >= a && t <= z)) s.blink = 0; return s; };
// is the mug in her hand at t? (then the desk mug is not drawn: one mug only)
const mugInHand = (t) => { const p = MY.state(t).pose; return (typeof p === "string" ? MAYA.POSES[p].hold : p.hold) === "mug"; };
// a shiver: the head jitters for a moment (the coffee is cold)
const shiver = (t) => [3, -3, 2.5, -2, 1, 0].forEach((d, i) => MY.tiltTo(t + i * 0.055, d, 0.05));

// HOOK0: frame one is the problem already happening. Maya stabs the keys, fed up, the sweat drops
// already running. Her head jerks with the hard key hits, the bun leans each time.
MY.look(0, ...AT_LAPTOP, 0.01).say(b.hook0.start, M.hook0 || [], "hook0");
F.sfx(0, "typing", { d: 1.9, x: KEYS_X });
[3, -2, 3.5, -1.5, 2.5, -2, 3, 0].forEach((d, i) => MY.tiltTo(0.05 + i * 0.24, d, 0.08));
// "...I've been fixing it all afternoon": her hands stop over the keys, a slump, we push in on her face
const fixing = at("hook0", 0.5);
MY.pose(fixing, FROZEN, 0.15).look(fixing, -0.2, 0.6, 0.15);
const afternoon = at("hook0", 0.74);
MY.slump(afternoon - 0.1, 0.5).tiltTo(afternoon, -5, 0.45);
shot(fixing, PUSH, b.hook0.end - fixing + 0.1, "sine.inOut");
F.lookAround(1.2, 0.9);
// at the end of the line she goes back at it, harder
MY.pose(b.hook0.end + 0.05, "type", 0.15).look(b.hook0.end + 0.05, ...AT_LAPTOP, 0.12).sit(b.hook0.end + 0.05, 0.3).tiltTo(b.hook0.end + 0.05, 0, 0.2);
F.sfx(b.hook0.end + 0.1, "typing", { d: 1.0, x: KEYS_X });

// BODY1: hard cut, Floey alone on the lid, deadpan. A slow blink, then a tilt towards the typing.
cutTo(b.body1.start - 0.1, TIGHT);
setW(b.body1.start - 0.1, { sweat: 0 });
slowBlink(b.body1.start - 0.08, 0.15);
F.say(b.body1.start, M.body1 || [], "body1").tiltTo(at("body1", 0.55), 14, 0.25).look(at("body1", 0.55), 0.4, 0.7, 0.1);
F.sfx(at("body1", 0.55), "tk");

// BODY2: wide. Her hands go up by her head, worried, then full panic on "bread!". Floey peeks over the
// lid at the screen, then chips back at her.
cutTo(b.body2.start - 0.12, SH.wide);
MY.pose(b.body2.start - 0.1, "panic", 0.22).expr(b.body2.start - 0.1, "worried").look(b.body2.start - 0.1, ...AT_FLOEY, 0.12)
  .say(b.body2.start, M.body2 || [], "body2");
F.sfx(b.body2.start - 0.05, "pop");
F.tiltTo(b.body2.start - 0.1, 0, 0.15).tiltTo(at("body2", 0.3), 26, 0.3).look(at("body2", 0.3), 0, 1, 0.12);
const bread = at("body2", 0.78);
MY.expr(bread - 0.05, "panic").tiltTo(bread, 4, 0.2);
F.tiltTo(bread + 0.1, -8, 0.2).look(bread + 0.1, 0.6, -0.2, 0.1).chips(bread + 0.15, 2).mood(bread + 0.1, "happy");
shot(b.body2.start + 0.15, WIDE2, b.body2.len, "sine.inOut");

// REFRAME3: hard cut, Floey alone, calm and a little smug. Still on "It didn't wander." A tilt up
// towards Maya on "outline", a slow blink on "wrote". A gentle push-in.
cutTo(b.reframe3.start - 0.1, TIGHT);
F.tiltTo(b.reframe3.start - 0.1, 0, 0.1).look(b.reframe3.start - 0.1, 0, 0, 0.1).say(b.reframe3.start, M.reframe3 || [], "reframe3");
const outline = at("reframe3", 0.66);
F.tiltTo(outline, -12, 0.25).look(outline, 0.7, -0.4, 0.1).sfx(outline, "tk");
slowBlink(at("reframe3", 0.88), 0.25);
shot(b.reframe3.start + 0.3, TIGHT2, b.reframe3.len - 0.3, "sine.inOut");
MY.pose(b.reframe3.start, "rest", 0.35).expr(b.reframe3.start + 0.1, "think").tiltTo(b.reframe3.start, 0, 0.3);

// DOUBT4: wide. Arms crossed, a lean back, one brow up: sceptical. Floey preens, unbothered, then looks back.
cutTo(b.doubt4.start - 0.12, DOUBT);
shot(b.doubt4.start, SH.wide, b.doubt4.len, "sine.inOut");
MY.pose(b.doubt4.start - 0.12, "crossed", 0.3).leanTo(b.doubt4.start - 0.05, -6, 0.4).expr(b.doubt4.start - 0.12, "sceptic").look(b.doubt4.start - 0.1, ...AT_FLOEY, 0.12)
  .say(b.doubt4.start, M.doubt4 || [], "doubt4");
F.tiltTo(b.doubt4.start - 0.12, 0, 0.15);
const fast = at("doubt4", 0.42);
F.preen(fast - 0.1, 0.9);
MY.nod(at("doubt4", 0.72), 1);
F.look(b.doubt4.end - 0.05, 0.6, -0.2, 0.1).tiltTo(b.doubt4.end - 0.05, -6, 0.2);

// TIP5: Floey alone (Maya out of the shot). She lifts off the lid and hovers just over it, eye to eye
// with Maya off at the right: "Fast to write. Slow to check." In on her for "Fix the outline first";
// a chip and a tilt on "first".
cutTo(b.tip5.start - 0.12, TIP);
F.mood(b.tip5.start - 0.12, "determined").tiltTo(b.tip5.start - 0.12, 0, 0.1).look(b.tip5.start - 0.12, 0.5, -0.2, 0.1).takeoff(b.tip5.start - 0.1)
  .move(b.tip5.start + 0.2, HOVER[0], HOVER[1], 0.55, "power2.inOut")
  .say(b.tip5.start, M.tip5 || [], "tip5");
// off screen, Maya listens: arms come uncrossed on "Slow to check", she thinks, she nods after "first"
MY.leanTo(b.tip5.start, 0, 0.4).look(b.tip5.start + 0.3, -1, -0.3, 0.35);
const slow = at("tip5", 0.36);
MY.pose(slow, "rest", 0.4).expr(slow, "think");
const fixFirst = at("tip5", 0.6);
shot(fixFirst, TIP2, 0.9, "power2.inOut");
const first = at("tip5", 0.9);
F.chips(first, 2).tiltTo(first, 12, 0.12).tiltTo(first + 0.18, 0, 0.25);
MY.expr(first, "neutral").nod(first + 0.1, 1);
// she does it: cut to the two of them, Maya back to the laptop, typing
cutTo(b.tip5.end + 0.05, WIDE2);
MY.pose(b.tip5.end - 0.1, "type", 0.25).look(b.tip5.end - 0.1, ...AT_LAPTOP, 0.12).expr(b.tip5.end - 0.1, "think");
F.sfx(b.tip5.end + 0.1, "typing", { d: 0.35, x: KEYS_X });

// CHECK6: the cutaway. The chatbot's outline, one row per heading as she reads it out; the ring
// grows on the bread row on her trailing "bread...". Keep becomes Cut, a click, three rows left.
const listIn = b.check6.start - 0.12;
key(listIn, { list: 1 }, 0.35, "power3.out");
F.sfx(listIn, "whoosh");
[[0.05, 0.25], [0.8, 0.5], [1.7, 0.75], [2.2, 1]].forEach(([dt, k]) => key(b.check6.start + dt, { rows: k }, 0.18, "power2.out"));
const ringT = at("check6", 0.84);
key(ringT, { ring: 1 }, 0.35, "back.out(2)");
F.sfx(ringT, "pop");
const cutT = b.check6.end + 0.4, clickT = b.check6.end + 0.9, goneT = b.check6.end + 1.1;
setW(cutT, { cut: 1 });
F.sfx(cutT, "tick");
F.sfx(clickT, "click");
setW(goneT, { gone: 1 });
const listOut = goneT + 0.5;
key(listOut, { list: 0 }, 0.25, "power2.in");
// off screen, under the insert: Floey lands back on the lid, Maya picks up her mug, the camera is on her
F.mood(b.check6.start + 0.2, "happy").land(b.check6.start + 0.3, SP.floeyLaptop.x, SP.floeyLaptop.y, 0.5);
MY.say(b.check6.start, M.check6 || [], "check6");
MY.pose(b.check6.start + 0.5, "mug", 0.4).expr(b.check6.start, "think").look(b.check6.start + 0.5, ...AT_LAPTOP, 0.12);
cutTo(b.check6.start + 0.6, PAY);

// PAYOFF7: Maya, mug in hand, staring at the screen: "Oh. One line." Then it sinks in: "My whole afternoon."
MY.expr(b.payoff7.start - 0.15, "surprised").look(b.payoff7.start - 0.15, ...AT_LAPTOP, 0.12).say(b.payoff7.start, M.payoff7 || [], "payoff7");
STARE.push([b.payoff7.start - 0.15, b.payoff7.start + 1.0]);
shot(b.payoff7.start, { ...PAY, camX: 705, camY: 805, zoom: 1.74 }, b.payoff7.len, "sine.inOut");
const whole = at("payoff7", 0.5);
MY.expr(whole, "sad").slump(whole, 0.6).look(whole, -0.2, 0.7, 0.3);
// silent: a slow sip, dazed, the mug at her lips; then she freezes. Cold. A snap in, a shiver.
const sipT = b.payoff7.end + 0.03;
MY.pose(sipT, SIP, 0.38).look(sipT, 0, 0.4, 0.2).expr(sipT, "deadpan").sit(sipT, 0.4);
F.sfx(sipT + 0.42, "sip", { x: 640 });
STARE.push([sipT, sipT + 0.85]);
const freeze = sipT + 0.85;
cutTo(freeze, COLD);
MY.expr(freeze, "annoyed").look(freeze, 0, 0.1, 0.08);
shiver(freeze + 0.03);
key(freeze, { cold: 1 }, 0.25, "back.out(2)");
F.sfx(freeze + 0.02, "boing");

// BUTTON8: wide. Floey, pleased, tilts to Maya and teases her, a wink on "coffee". Maya lowers the
// mug, annoyed, then deadpan.
cutTo(b.button8.start - 0.14, WIDE2);
key(b.button8.start + 0.25, { cold: 0 }, 0.2);
F.mood(b.button8.start - 0.14, "happy").tiltTo(b.button8.start - 0.1, -10, 0.25).look(b.button8.start - 0.1, 0.7, -0.3, 0.1)
  .say(b.button8.start, M.button8 || [], "button8");
MY.pose(b.button8.start + 0.3, "mug", 0.4).look(b.button8.start + 0.2, ...AT_FLOEY, 0.15);
MY.expr(at("button8", 0.55), "deadpan");
F.wink(at("button8", 0.82));
shot(b.button8.start, { ...WIDE2, camX: 590, zoom: 1.2 }, b.button8.len + 0.15, "sine.inOut");
// silent button: in on Maya, her eyes slide to the lens, and she holds the flat look
const look = b.button8.end + 0.25;
cutTo(look, LAST);
shot(look + 0.05, LAST2, END - look - 0.05, "sine.inOut");
MY.look(look + 0.1, 0, 0, 0.45).tiltTo(look + 0.1, 0, 0.3);
STARE.push([look, END + 0.6]);
F.tiltTo(look, 0, 0.2);

// END: the logo card drops in
key(END, { end: 1 }, 0.5, "back.out(1.6)");
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// ---------- what is on her screen (the chatbot's outline, an example) ----------
function OUTLINE() {
  const rows = [
    { label: "Ingredients", value: "Keep", tone: "ink" },
    { label: "Mix and rest", value: "Keep", tone: "ink" },
    { label: "Bake", value: "Keep", tone: "ink" },
  ];
  if (W.gone < 0.5) rows.push(W.cut > 0.5 ? { label: "A brief history of bread", value: "Cut", tone: "bad", hi: true }
    : { label: "A brief history of bread", value: "Keep", tone: "brand", hi: true });
  return DUO.listInsert(1, W.gone > 0.5 ? 1 : W.rows, {
    title: "Outline: quick no-knead bread", sub: "written by the chatbot", cols: ["Section", "Tag"], hiK: W.ring, rows,
  });
}
const DIM_RE = '<rect width="1080" height="1920" fill="#2d2f45" opacity=".55"/>';
// an insert whooshes up from below: the room dims, the card itself is always fully opaque
function popIn(k, html) {
  if (k <= 0.01 || !html) return "";
  const dim = Math.min(1, k * 2.5), dy = (1 - k) * 1250;
  return `<rect width="1080" height="1920" fill="#2d2f45" opacity="${(0.86 * dim).toFixed(3)}"/>`
    + `<g transform="translate(0 ${dy.toFixed(1)})">${html.replace(DIM_RE, "")}</g>`;
}
// the rig draws every open mouth as a grin. On her upset faces, turn the open mouth over (arched top,
// flat bottom) so a worried line reads as worry, not delight. (Same fix as r027 to r034.)
const UPSET = new Set(["panic", "worried", "annoyed", "sad", "surprised", "deadpan", "sceptic"]);
const MOUTH_RE = /<path d="(M[^"]+Z)" fill="#5a1f22"[^>]*\/>\s*<clipPath id="mq\d+"><path d="[^"]+"\/><\/clipPath>\s*<g clip-path="url\(#mq\d+\)">(<ellipse[^>]*\/>)<rect[^>]*\/><\/g>/;
function frown(s, e) {
  if (!UPSET.has(e)) return s;
  const sy = e === "annoyed" ? 0.42 : e === "sceptic" ? 0.38 : 1;
  return s.replace(MOUTH_RE, (all, d, tongue) => {
    const ys = d.match(/-?\d+(\.\d+)?/g).map(Number).filter((_, i) => i % 2);
    const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
    return `<g transform="translate(0 ${mid.toFixed(1)}) scale(1 ${(-sy).toFixed(2)}) translate(0 ${(-mid).toFixed(1)})">${all.replace(tongue, "")}</g>`;
  });
}
// sceptical: her brow on screen right goes up and arches (the other stays low)
const BROW_RE = /<path d="[^"]+" fill="none" stroke="#3a2418" stroke-width="15" stroke-linecap="round"\/>/g;
function oneBrow(s, e) {
  if (e !== "sceptic") return s;
  let n = 0;
  return s.replace(BROW_RE, (p) => (++n === 2 ? `<g transform="translate(0 -10) rotate(-14 348 196)">${p}</g>` : p));
}
// the sip: the rig folds her elbow up past her ear when the hand reaches her face. Keep the elbow down
// by her side, and tip the mug so its rim sits on her lips (the hand stays on its handle side).
const MUG_R = MAYA.POSES.mug.R, ELB = [508, 566];
const lerp = (a, z, k) => a + (z - a) * k;
const SLEEVE_RE = /M410,470 L(-?[\d.]+),(-?[\d.]+) L(-?[\d.]+),(-?[\d.]+)/;
const PROP_RE = /<g transform="translate\((-?[\d.]+) (-?[\d.]+)\)"><path d="M28,18 q30,0 30,26/;
function sipFix(s) {
  const m = s.match(SLEEVE_RE); if (!m) return s;
  const hx = +m[3], hy = +m[4];
  const k = Math.max(0, Math.min(1, (MUG_R[1] - hy) / (MUG_R[1] - SIP.R[1])));
  if (k <= 0.001) return s;
  const w = Math.min(1, k * 3), ex = lerp(+m[1], ELB[0], w), ey = lerp(+m[2], ELB[1], w);
  s = s.split(`M410,470 L${m[1]},${m[2]} L`).join(`M410,470 L${ex.toFixed(1)},${ey.toFixed(1)} L`);
  const mx = hx + lerp(8, -44, k), my = hy + lerp(-52, -66, k), rot = -16 * k;
  return s.replace(PROP_RE, `<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)}) rotate(${rot.toFixed(1)})"><path d="M28,18 q30,0 30,26`);
}
// her coffee went cold hours ago: no steam over the mug in her hand
const STEAM_RE = /<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/;
const mayaSvg = (t) => { const e = MY.state(t).expr; return oneBrow(sipFix(frown(MY.svg(t), e)), e).replace(STEAM_RE, ""); };
// Floey is drawn only when some of her is in the frame (in Maya's close-ups a stray tail tip would poke in)
const floeyVisible = (t) => { const p = F.pose(t); return 540 + (p.x - W.camX) * W.zoom > -95; };
// late afternoon: a warm wash over the window
const LATE = `<linearGradient id="late" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#ffc27a" stop-opacity="0"/><stop offset="1" stop-color="#ffb062" stop-opacity=".5"/></linearGradient><rect x="644" y="334" width="352" height="422" rx="14" fill="url(#late)"/>`;
// the drifting cloud stays inside the window
const room = (t) => DUO.room(t).replace('<g opacity=".9">', '<clipPath id="win"><rect x="644" y="334" width="352" height="422" rx="14"/></clipPath><g opacity=".9" clip-path="url(#win)">');

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const world = room(t) + LATE + mayaSvg(t) + DUO.deskFront() + DUO.laptop() + (mugInHand(t) ? "" : DUO.mug(MUG_X))
    + (floeyVisible(t) ? F.svg(t) : "")
    + DUO.mark("sweat", 806, 712, W.sweat, t)
    + DUO.stat(850, 600, W.cold, "cold", "#4a9bd8");
  document.getElementById("stage").innerHTML = DUO.cam(world, W)
    + popIn(W.list, W.list > 0.01 ? OUTLINE() : "")
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
