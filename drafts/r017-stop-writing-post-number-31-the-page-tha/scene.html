<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#d9cfe6}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r017 "Post thirty-one" (duo style, night). Maya at the lamp, typing hard, a red "12 clicks" pill and a
// "Post 31" pill over her shoulder: "Thirty posts in thirty days, and Google sent me twelve people."
// Floey alone on the lid, a slow deadpan blink: "Stop typing. You already wrote the answer."
// "But new posts are how you get traffic!" a jolt and a finger at the lid. The tip: "Post 31" pops,
// she types along. "Fine. Sorting..." Her Queries slide in sorted by position; the ring grows on
// "cheap night trains italy" at 11.4. Back on her: "My old post's at eleven!" a "!" and Floey's smug preen.
// Floey's warm tip, Maya nods and types, calm; the red pill stays (no instant win). The button: "Save this
// for post sixty." to Maya, then to camera; Maya's sip, the coffee is cold, a flat look to camera, the end card.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.3, reframe1: 0.2, doubt2: 0.2, tip3: 0.35, check4: 0.5, payoff5: 0.3, payoff6: 0.4, button7: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
// the silent button (the cold sip and her flat look to camera) plays out before the end card
const END = Math.max(SPOKEN + 0.6, B.button7.end + 3.0), DUR = END + 1.6, b = B, SH = DUO.SHOT, SP = DUO.SPOT;
// when a word is said: its share of the line's characters (the captions use the same rule)
const word = (id, w) => { const s = LINES.find((l) => l[0] === id)[1]; return B[id].start + B[id].len * Math.max(0, s.indexOf(w)) / s.length; };

// ---------- the shots (DUO.SHOT, nudged for this layout) ----------
const WIDE = { ...SH.wide };
const WIDE_IN = { camX: 575, camY: 1000, zoom: 1.17 };   // the slow drift in under the tip (the red pill stays in frame)
const MS = { camX: 730, camY: 820, zoom: 1.55 };         // Maya alone, the pills and her keyboard hands in shot
const MS_IN = { camX: 728, camY: 812, zoom: 1.6 };       // the creep in through the hook
const FT = { camX: 180, camY: 1050, zoom: 2.0 };         // Floey alone on the lid
const TWO = { camX: 600, camY: 980, zoom: 1.22 };        // a closer two-shot for the realisation
const LOOK = { camX: 700, camY: 790, zoom: 1.9 };        // her flat look to camera, the cold mug at her chin
const LOOK2 = { camX: 690, camY: 772, zoom: 2.05 };      // the slow push on it

// ---------- Maya's hands: on the desk mug, the mug at her lips, under her chin ----------
const MUG_REACH = { L: [228, 705], R: [494, 668] };
const MUG_DESK = { L: [228, 705], R: [494, 668], hold: "mug" };
const MUG_LIPS = { L: [262, 640], R: [356, 352], hold: "mug" };
const MUG_CHIN = { L: [262, 640], R: [340, 505], hold: "mug" };

// ---------- the cast ----------
const PERCH = { ...SP.floeyLaptop, x: SP.floeyLaptop.x - 10 };
const F = FLOEY.create({ ...PERCH, facing: -1, mood: "hello", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: "type", floey: F });
// p12 the red "12 clicks" pill, p31 the "Post 31" pill, sh the camera shake, bang "!", ins the Queries list,
// rows, hi (the ring), desk: the mug is on the desk (0 once it is in her hand)
const W = { ...MS, p12: 1, p31: 1, sh: 0, bang: 0, ins: 0, rows: 0, hi: 0, push: 0, desk: 1, end: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);
const cut = (t, s) => wt.set(W, { ...s }, t);
const ftw = (t, vars) => F.tl.to(F.S, vars, t);
const lid = (t, k, d = 0.12) => ftw(t, { squint: k, duration: d, ease: "sine.inOut" });

// ---------- HOOK0: frame one, typing hard under the lamp, both pills already up ----------
// "Thirty posts in thirty days, and Google sent me twelve people."
const H = b.hook0.start;
MY.look(0, -0.5, 0.8, 0.01).leanTo(0, -3, 0.01).say(H, M.hook0 || [], "hook0");
shot(0.05, MS_IN, b.hook0.end - 0.1, "power1.inOut");
F.sfx(0.02, "typing", { d: b.reframe1.start + 0.35, x0: 600 });
// "Google": a glare up at the ceiling, at Google
MY.look(word("hook0", "Google") - 0.05, 0.3, -0.7, 0.15).tiltTo(word("hook0", "Google"), 5, 0.25);
// "twelve": her head snaps up off the keys (hands still typing), the red pill pulses, a small shake
const TW = word("hook0", "twelve");
MY.look(TW - 0.08, 0, 0.1, 0.08).tiltTo(TW - 0.08, -3, 0.12).leanTo(TW - 0.08, 0, 0.15);
wt.to(W, { p12: 1.3, duration: 0.1, ease: "power2.out" }, TW).to(W, { p12: 1, duration: 0.35, ease: "back.out(3)" }, TW + 0.1);
wt.to(W, { sh: 1, duration: 0.05 }, TW).to(W, { sh: 0, duration: 0.45, ease: "power2.out" }, TW + 0.05);
F.sfx(TW + 0.02, "pop", { x0: 880 });
MY.look(b.hook0.end - 0.2, -0.5, 0.8, 0.15);

// ---------- REFRAME1: Floey alone on the lid; the tilt to Maya, one slow deadpan blink ----------
// "Stop typing. You already wrote the answer."
const R1 = b.reframe1.start, C1 = b.hook0.end + 0.08;
cut(C1, FT);
F.mood(C1, "determined").look(C1, 0.6, 0.1, 0.05);
lid(C1, 0.3, 0.1);
F.say(R1, M.reframe1 || [], "reframe1");
ftw(R1 - 0.05, { tilt: -10, lookX: 0.8, lookY: -0.2, duration: 0.2 });
const AL = word("reframe1", "already");
lid(AL, 0.95, 0.28); lid(AL + 0.6, 0.35, 0.3);
F.sfx(AL + 0.1, "tick");
ftw(AL + 0.1, { tilt: 8, duration: 0.35, ease: "power2.inOut" });
// off shot, the typing stops on "Stop typing"
MY.pose(R1 + 0.35, "rest", 0.3).expr(R1 + 0.35, "surprised").look(R1 + 0.35, -1, 0.1, 0.1).tiltTo(R1 + 0.35, 0, 0.2);

// ---------- DOUBT2: the two-shot; a jolt and a finger at the lid ----------
// "But new posts are how you get traffic!"
const D2 = b.doubt2.start;
cut(b.reframe1.end + 0.08, WIDE);
MY.expr(D2 - 0.1, "worried").pose(D2 - 0.08, "pointL", 0.22).look(D2, -1, 0.1, 0.08).jolt(D2 + 0.02).say(D2, M.doubt2 || [], "doubt2");
const TR = word("doubt2", "traffic");
MY.expr(TR - 0.05, "panic").leanTo(TR - 0.05, -5, 0.15).leanTo(TR + 0.2, -2, 0.3);
// the listener: unbothered, lids half down; on "traffic" the slow tilt the other way
F.mood(D2, "hello").look(D2, 0.7, -0.1, 0.08);
ftw(D2 + 0.1, { tilt: -4, duration: 0.3 });
lid(D2 + 0.2, 0.5, 0.25);
ftw(TR, { tilt: 14, duration: 0.6, ease: "sine.inOut" });

// ---------- TIP3: the slow drift in on the two-shot; "Post 31" pops, she types along ----------
// "New ones can take weeks to get crawled. Search Console, Queries, turn on Average position."
const T3 = b.tip3.start;
shot(T3 - 0.05, WIDE_IN, b.tip3.len + 0.2, "sine.inOut");
F.mood(T3 - 0.1, "happy").look(T3 - 0.1, 0.7, -0.1, 0.1).say(T3, M.tip3 || [], "tip3");
ftw(T3 - 0.1, { tilt: 0, duration: 0.2 });
lid(T3, 0.35, 0.2);
// the listener: still pointing, then she gives up with a huff and types
MY.expr(T3 + 0.1, "annoyed").look(T3 + 0.1, -1, 0, 0.12);
MY.pose(T3 + 0.8, "type", 0.3).look(T3 + 0.8, -0.5, 0.8, 0.15).leanTo(T3 + 0.8, -3, 0.3);
F.sfx(T3 + 0.9, "typing", { d: 0.7, x0: 600 });
// "crawled": the "Post 31" pill pops out of existence
const CR = word("tip3", "crawled");
wt.to(W, { p31: 1.2, duration: 0.08, ease: "power2.out" }, CR).to(W, { p31: 0, duration: 0.16, ease: "power2.in" }, CR + 0.08);
F.sfx(CR + 0.1, "pop", { x0: 880 });
// "Search Console, Queries, turn on Average position": Floey leans to the screen, a small nod on each step; Maya follows on the keys
const SC = word("tip3", "Search");
ftw(SC - 0.05, { tilt: 26, lookX: 0.8, lookY: 1, duration: 0.22, ease: "back.out(2)" });
F.sfx(SC + 0.05, "typing", { d: 1.7, x0: 600 });
["Queries", "turn on"].forEach((w0) => { const s = word("tip3", w0); ftw(s, { tilt: 36, duration: 0.08 }); ftw(s + 0.08, { tilt: 24, duration: 0.14 }); });
MY.expr(word("tip3", "Queries"), "think").look(word("tip3", "Queries"), -0.4, 0.9, 0.12);
ftw(b.tip3.end - 0.1, { tilt: 0, lookX: 0.7, lookY: 0, duration: 0.2 });

// ---------- CHECK4: "Fine." flat, one hard keystroke; then the Queries list, one tick a row ----------
// "Fine. Sorting..."
const C4 = b.check4.start;
MY.expr(C4 - 0.1, "annoyed").pose(C4 - 0.15, "type", 0.1).look(C4 - 0.1, -0.5, 0.9, 0.1).say(C4, M.check4 || [], "check4");
F.sfx(C4 - 0.05, "click", { x0: 600 });
// the list swings in after "Fine." and every row is in, already sorted, before she has finished
// "Sorting...": the ring is full and the ding has landed before "Wait."
const SO = C4 + 0.3, R0 = SO + 0.15, P5 = b.payoff5.start;
wt.to(W, { ins: 1, duration: 0.3, ease: "power3.out" }, SO);
F.sfx(SO, "whoosh");
wt.to(W, { rows: 1, duration: 0.75, ease: "power1.out" }, R0);
F.sfx(R0 + 0.45, "tick", { x0: 540 });
const RING = Math.min(R0 + 0.7, P5 - 0.6);
wt.to(W, { hi: 1, duration: 0.4, ease: "power2.out" }, RING);
F.sfx(RING + 0.1, "ding", { x0: 540 });
// off shot, she leans in to read
MY.expr(b.check4.end, "think").leanTo(b.check4.end, -5, 0.4);

// ---------- PAYOFF5: the ringed row holds while she reads it out; back on her for "My old post's at eleven!" ----------
// "Wait. Cheap night trains Italy. My old post's at eleven!"
MY.expr(P5 - 0.05, "surprised").say(P5, M.payoff5 || [], "payoff5");
const CH = word("payoff5", "Cheap");
// a slow push in on the list while she reads the ringed row (it grows up from its bottom edge, clear of the captions)
wt.to(W, { push: 1, duration: 1.8, ease: "sine.inOut" }, P5);
MY.expr(CH, "happy");
// the cut back: the list goes, the closer two-shot, she leans in at the laptop
const MO = word("payoff5", "My old") - 0.05;
wt.set(W, { ins: 0 }, MO);
cut(MO, TWO);
MY.expr(MO, "surprised").pose(MO, "rest", 0.25).leanTo(MO, -7, 0.35).look(MO, -0.5, 0.7, 0.08);
// the "!" pops over her bun on the cut, so the reaction shot carries it; it holds past "eleven!"
wt.to(W, { bang: 1, duration: 0.22, ease: "back.out(2)" }, MO + 0.05);
F.sfx(MO + 0.07, "pop", { x0: 460 });
wt.to(W, { bang: 0, duration: 0.25 }, b.payoff5.end + 0.35);
// "eleven!": the face opens up, her eyes to Floey
const EL = word("payoff5", "eleven");
MY.expr(EL - 0.05, "happy").leanTo(EL, -2, 0.3).look(EL + 0.2, -1, 0, 0.12);
// the listener: one smug preen on the lid while she works it out
const PR = MO + 0.1;
F.mood(PR, "happy");
ftw(PR, { tilt: 34, lookY: 1, puff: 0.2, duration: 0.18 });
ftw(PR + 0.22, { tilt: 46, puff: 0.5, duration: 0.09, ease: "power1.in" }); ftw(PR + 0.31, { tilt: 34, puff: 0.2, duration: 0.14 });
ftw(PR + 0.48, { tilt: 46, puff: 0.5, duration: 0.09, ease: "power1.in" }); ftw(PR + 0.57, { tilt: 34, puff: 0.2, duration: 0.14 });
F.sfx(PR + 0.24, "rustle", { n: 1 });
ftw(PR + 0.75, { tilt: -6, lookX: 0.7, lookY: -0.1, puff: 0, duration: 0.2, ease: "back.out(2)" });
lid(PR + 0.8, 0.45, 0.2);

// ---------- PAYOFF6: Floey close, warm; then the two-shot, Maya nods and types, calm ----------
// "People already see it. Make that post answer it better. Give it a few weeks."
const P6 = b.payoff6.start;
cut(P6 - 0.1, FT);
F.mood(P6 - 0.1, "happy").say(P6, M.payoff6 || [], "payoff6");
ftw(P6 - 0.1, { tilt: -8, lookX: 0.8, lookY: -0.2, duration: 0.2 });
lid(P6 - 0.1, 0.15, 0.15);
const MK = word("payoff6", "Make");
cut(MK - 0.08, WIDE);
ftw(MK, { tilt: 6, duration: 0.25 });
MY.expr(P6, "think").look(P6, -1, 0, 0.12).leanTo(P6, 0, 0.3);
MY.nod(word("payoff6", "answer"), 2);
const GV = word("payoff6", "Give");
MY.expr(GV - 0.05, "neutral").pose(GV - 0.1, "type", 0.3).look(GV, -0.5, 0.8, 0.15).leanTo(GV, -3, 0.3);
F.sfx(GV + 0.1, "typing", { d: 1.4, x0: 600 });
ftw(GV + 0.2, { tilt: 20, lookX: 0.8, lookY: 0.8, duration: 0.25 });

// ---------- BUTTON7: the jab at Maya, then the turn to camera ----------
// "Save this for post sixty."
const B7 = b.button7.start;
F.mood(B7 - 0.1, "happy").look(B7 - 0.1, 0.8, -0.1, 0.08).say(B7, M.button7 || [], "button7");
ftw(B7 - 0.1, { tilt: -6, duration: 0.2 });
lid(B7, 0.4, 0.15);
const PO = word("button7", "post");
F.pivot(PO - 0.1, "front").look(PO - 0.05, 0, 0, 0.05);
// "sixty": the typing stops, her face drops, her eyes slide to Floey
const SX = word("button7", "sixty");
MY.pose(SX - 0.1, "rest", 0.3).expr(SX, "deadpan").look(SX, -1, 0.1, 0.18).leanTo(SX, 0, 0.3);
lid(b.button7.end, 0.5, 0.2);

// ---------- the silent button: the sip, the coffee is cold again, a flat look to camera ----------
const SP1 = b.button7.end + 0.3;
MY.look(SP1, 0.6, 0.6, 0.15).pose(SP1, MUG_REACH, 0.35);
MY.pose(SP1 + 0.36, MUG_DESK, 0.01);
wt.set(W, { desk: 0 }, SP1 + 0.36);
MY.pose(SP1 + 0.4, MUG_LIPS, 0.3).look(SP1 + 0.4, 0, -0.2, 0.15).expr(SP1 + 0.4, "neutral");
F.sfx(SP1 + 0.75, "sip", { x0: 760 });
// the freeze, then the face
const CO = SP1 + 1.15;
MY.expr(CO, "annoyed").tiltTo(CO, -5, 0.08).tiltTo(CO + 0.1, 3, 0.08).tiltTo(CO + 0.2, 0, 0.1);
F.sfx(CO, "boing", { x0: 760 });
// the red pill goes before the push, the mug down to her chin, the flat look
const LK = CO + 0.55;
wt.to(W, { p12: 0, duration: 0.2, ease: "power2.in" }, LK - 0.25);
shot(LK, LOOK, 0.45, "power3.out");
MY.pose(LK, MUG_CHIN, 0.3).expr(LK + 0.1, "deadpan").look(LK + 0.1, 0, 0, 0.2).tiltTo(LK, 0, 0.2);
shot(LK + 0.5, LOOK2, END - LK - 0.5, "power1.inOut");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// ---------- world parts ----------
const fx = (n) => Math.round(n * 10) / 10;
// Maya's open mouth on a tense line: the same mouth turned over, so it reads as a grimace, never a grin.
// The mug in her hand has no steam: the coffee is cold.
const TENSE = new Set(["worried", "panic", "annoyed", "sad", "deadpan"]);
function maya(t) {
  let s = MY.svg(t).replace(/<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/, "");
  if (!TENSE.has(MY.state(t).expr)) return s;
  return s.replace(/<path d="([^"]+)" fill="#5a1f22"[\s\S]*?<\/g>/, (m, d) => {
    const ys = [...d.matchAll(/,(-?[\d.]+)/g)].map((x) => +x[1]);
    return `<g transform="translate(0 ${fx(Math.min(...ys) + Math.max(...ys))}) scale(1 -1)">${m}</g>`;
  });
}
// a world pill drawn smaller, so it reads in her medium shot without filling the frame
const pill = (x, y, s, k, text, tone) => k > 0.01 ? `<g transform="translate(${x} ${y}) scale(${fx(s * 100) / 100})">${DUO.stat(0, 0, Math.min(1, k), text, tone)}</g>` : "";
// her Search Console Queries, Average position on, sorted by position (her own example numbers)
const ROWS = [
  { label: "best budget rail pass europe", value: "310 · 4.2" },
  { label: "interrail packing list", value: "180 · 7.9" },
  { label: "cheap night trains italy", value: "2,300 · 11.4", tone: "good", hi: true },
  { label: "lisbon on a budget", value: "90 · 18.6" },
  { label: "hostel or hotel paris", value: "60 · 23.1" },
  { label: "slow travel tips", value: "40 · 31.5" },
];
// the camera with the small shake on "twelve"
const camAt = (t) => ({ camX: W.camX + Math.sin(t * 47) * W.sh * 7, camY: W.camY + Math.cos(t * 39) * W.sh * 5, zoom: W.zoom });

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const world = DUO.room(t, { night: true }) + maya(t) + DUO.deskFront() + DUO.laptop() + (W.desk > 0.5 ? DUO.mug() : "") + F.svg(t)
    + pill(880, 560, 0.6 * Math.max(1, W.p12), W.p12, "12 clicks", "bad")
    + pill(880, 662, 0.6 * Math.max(1, W.p31), W.p31, "Post 31", "ink")
    + DUO.mark("!", 385, 625, W.bang, t);
  document.getElementById("stage").innerHTML = DUO.cam(world, camAt(t))
    + `<g transform="translate(540 1436) scale(${fx((1 + 0.04 * W.push) * 1000) / 1000}) translate(-540 -1436)">`
    + DUO.listInsert(W.ins, W.rows, { title: "Search Console · Queries", sub: "Average position on · sorted by position", cols: ["Query", "Impressions · Position"], rows: ROWS, hiK: W.hi }) + `</g>`
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return camAt(t); };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
