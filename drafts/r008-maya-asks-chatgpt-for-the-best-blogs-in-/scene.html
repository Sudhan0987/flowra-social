<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#efe6f3}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r008 "Ask It Again" (duo style, night set). Frame one is ChatGPT's list of the
// best budget travel blogs without her (NOT LISTED). Floey: ask again. Answer 2
// has her third, answer 3 drops her again: the list changes on every ask. Floey
// takes off on "same list twice" and hovers by Maya to the end (doubt, tip,
// button); the GA4 table shows chatgpt.com sent 23 visits. Button: Mum, Maya's
// look to camera, Floey's sum to the lens, then Maya asks ChatGPT once more (the loop).
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story; three are longer on purpose (editor notes):
// reframe1 and reframe2 hold the re-ask so the new list lands before Maya reacts,
// button8 holds Maya's silent look to camera
const GAP = { hook0: 0.3, reframe1: 1.3, reframe2: 1.3, reframe3: 0.35, reframe4: 0.3, doubt5: 0.25, tip6: 0.4, payoff7: 0.35, button8: 1.5, button9: 0.6 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
// the button has silent acting after the last line (the relapse), so the end card waits for it
const END = Math.max(SPOKEN + 0.6, b.button9.end + 2.3), DUR = END + 1.6;
const HC = HUM.colors, INK = HC.ink, GREEN = "#2f9e62", RED = "#d24b4b";
const r1 = (n) => Math.round(n * 10) / 10, clamp = (v, a, c) => Math.max(a, Math.min(c, v));
// her mouth, scaled down on the flat and worried lines so an open mouth never reads as a grin
const mo = (id, k = 1) => (M[id] || []).map((v) => v * k);
// From "same list twice" to the end Floey hovers by Maya's head (the story keeps her in the air),
// so the Floey shots are nudged to frame her there instead of the empty laptop lid:
// HOV a little left of DUO.SPOT.floeyHover so Maya's close shots clear her wing tips
const HOV = { x: 268, y: 740 };
// a nudged wide for the doubt: Floey in the air and Maya's pointing hand both well inside
const WD = { camX: 520, camY: 960, zoom: 1.25 };
// the two-shot favouring Floey in the air: both faces, Floey on the left third
const FS = { camX: 475, camY: 830, zoom: 1.5 };
// Floey's button to the lens: a little higher than FS, Maya's whole face still in at the right (her reaction)
const FB = { camX: 478, camY: 800, zoom: 1.52 };
// Floey alone on the lid, filling the frame (DUO.SHOT.floeyTight left the top half empty
// and a sliver of Maya at the right edge): close enough that Maya is fully out
const FT = { camX: 230, camY: 990, zoom: 2.6 };
// Maya alone, nudged right of DUO.SHOT.maya so Floey in the air is fully out of frame
const MS = { camX: 760, camY: 830, zoom: 1.55 };
// her tight close-up, framed a little lower than DUO.SHOT.mayaTight: more headroom for the bun,
// and Floey (on the lid or in the air) stays well off the left edge and out of the caption band
const MT = { camX: 665, camY: 840, zoom: 2.1 };
// her hand raised up and to screen left, at Floey hovering (pointL sits behind the laptop lid)
const POINT_UP = { L: [96, 330], R: [372, 705], kL: "point" };

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "hello", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: "cheeks", floey: F });
// ins: the ChatGPT answer cutaway (ver = which answer), rows: its rows sliding in, hi: her row's ring,
// stamp: the verdict under the card (red NOT LISTED / green YOU: #3); bad/good: the pill in the window;
// ga, gaRows, gaHi, draw, pop: the GA4 cutaway, its rows, the chatgpt.com ring, the line, the 23 pill
const W = { ...SH.maya, ins: 1, ver: 0, rows: 1, hi: 0, stamp: 1, bad: 0, good: 0, ex: 0, ga: 0, gaRows: 0, gaHi: 0, draw: 0, pop: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);
const cut = (t, s) => wt.set(W, { ...s }, t);
const ftw = (t, vars) => F.tl.to(F.S, vars, t);

// ---------- the cutaways (screen space, outside DUO.cam) ----------
// a dark backdrop so a cutaway reads as her screen, not a box over her body
const backdrop = (k) => `<rect width="1080" height="1920" fill="#23243a" opacity="${r1(0.8 * Math.min(1, k * 2))}"/>`;
const slide = (k) => r1(1920 * (1 - Math.min(1, k)) * 0.6);
function stamp(x, y, k, text, col, bg) {
  if (k <= 0.01) return "";
  const tw = mw(text, "700 50px 'Space Grotesk'") + 56, sc = 1 + 0.4 * (1 - Math.min(1, k));
  return `<g transform="translate(${x} ${y}) rotate(-5) scale(${r1(sc * 100) / 100})" opacity="${r1(Math.min(1, k * 1.5))}"><rect x="${r1(-tw / 2)}" y="-44" width="${r1(tw)}" height="88" rx="18" fill="${bg}" stroke="${col}" stroke-width="7"/><text x="0" y="18" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="50" fill="${col}">${text}</text></g>`;
}
// text width measured fresh every frame: PROPS.measure can keep a width taken before the web font loaded
let mctx;
const mw = (txt, font) => { mctx ??= document.createElement("canvas").getContext("2d"); mctx.font = font; return mctx.measureText(txt).width; };
// a chat bubble at the top: what she asked (or where she is in GA4), right-aligned like her own message
function bubble(k, text, size) {
  const fs = Math.min(size, size * 820 / mw(text, `700 ${size}px 'Public Sans'`)), w = mw(text, `700 ${r1(fs)}px 'Public Sans'`) + 64, x = 990 - w;
  return `<g transform="translate(0 ${slide(k)})" opacity="${r1(Math.min(1, k * 2))}"><path d="M940,450 l18,34 l12,-40Z" fill="${HC.violet}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="${r1(x)}" y="372" width="${r1(w)}" height="84" rx="34" fill="${HC.violet}" stroke="${INK}" stroke-width="6"/><path d="M944,452 h22" stroke="${HC.violet}" stroke-width="8"/><text x="${r1(x + 32)}" y="${r1(414 + fs * 0.36)}" font-family="Public Sans" font-weight="700" font-size="${r1(fs)}" fill="#fff">${text}</text></g>`;
}
// ChatGPT's answers: every ask gives a different list. The other blogs are placeholders
// (no real blog is ever named) and her own row is only ever "Your blog".
const ANSWERS = [
  ["Blog A", "Blog B", "Blog C", "Blog D"],
  ["Blog C", "Blog E", "Your blog", "Blog A"],
  ["Blog F", "Blog A", "Blog G", "Blog B"],
  ["Blog H", "Blog C", "Blog E", "Blog D"],
];
function chatInsert() {
  if (W.ins <= 0.01) return "";
  const v = Math.round(W.ver), rows = ANSWERS[v].map((label, i) => label === "Your blog"
    ? { label, value: `#${i + 1}`, tone: "good", hi: true } : { label, value: `#${i + 1}` });
  const listed = rows.some((r) => r.hi);
  return backdrop(W.ins)
    + DUO.listInsert(W.ins, W.rows, { title: `ChatGPT, answer ${v + 1}`, cols: ["Blog", "Rank"], rows, hiK: W.hi })
    + bubble(W.ins, "Best budget travel blogs?", 46)
    + `<g transform="translate(0 ${slide(W.ins)})">${listed ? stamp(540, 1326, W.stamp, "YOU: #3", GREEN, "#eaf7ef") : stamp(540, 1326, W.stamp, "NOT LISTED", RED, "#fff1f0")}</g>`;
}
// the GA4 check: Traffic acquisition switched to session source, her own example numbers
const SPARK = [0.1, 0.18, 0.12, 0.3, 0.26, 0.45, 0.4, 0.62, 0.78, 0.95];
function gaInsert() {
  if (W.ga <= 0.01) return "";
  const rows = [
    { label: "google", value: "1,182" }, { label: "(direct)", value: "296" },
    { label: "pinterest.com", value: "88" }, { label: "chatgpt.com", value: "23", tone: "good", hi: true },
  ];
  let s = backdrop(W.ga)
    + DUO.listInsert(W.ga, W.gaRows, { title: "Traffic acquisition", sub: "Last 28 days. Some AI visits show as Direct.", cols: ["Session source", "Sessions"], rows, hiK: W.gaHi })
    + bubble(W.ga, "Reports > Acquisition > Traffic acquisition", 34);
  // in the chatgpt.com row: its visits over the 28 days, drawing itself upward
  let g = "";
  if (W.draw > 0.01) {
    const x0 = 470, x1 = 800, yb = 1146, yt = 1086, n = SPARK.length, m = W.draw * (n - 1), pts = [];
    const P = SPARK.map((v, i) => [x0 + (x1 - x0) * i / (n - 1), yb - (yb - yt) * v]);
    for (let i = 0; i <= Math.floor(m); i++) pts.push(P[i]);
    if (m % 1 && P[Math.ceil(m)]) { const a = P[Math.floor(m)], c = P[Math.ceil(m)], u = m % 1; pts.push([a[0] + (c[0] - a[0]) * u, a[1] + (c[1] - a[1]) * u]); }
    const line = pts.map((p, i) => `${i ? "L" : "M"}${r1(p[0])},${r1(p[1])}`).join(" "), e = pts[pts.length - 1];
    g += `<path d="${line} L${r1(e[0])},${yb} L${x0},${yb}Z" fill="${GREEN}" opacity=".16"/><path d="${line}" fill="none" stroke="${GREEN}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${r1(e[0])}" cy="${r1(e[1])}" r="9" fill="${GREEN}" stroke="${INK}" stroke-width="4"/>`;
  }
  // the 23 the voice says, under the card, pointing up at its row
  if (W.pop > 0.01) {
    const pw = mw("23 visits from ChatGPT", "700 46px 'Space Grotesk'") + 60, sc = 0.6 + 0.4 * Math.min(1, W.pop);
    g += `<g transform="translate(540 1336) scale(${r1(sc * 100) / 100})" opacity="${r1(Math.min(1, W.pop * 1.5))}"><path d="M-18,-40 L0,-62 L18,-40Z" fill="${GREEN}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><rect x="${r1(-pw / 2)}" y="-42" width="${r1(pw)}" height="84" rx="24" fill="${GREEN}" stroke="${INK}" stroke-width="5"/><text x="0" y="16" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="46" fill="#fff">23 visits from ChatGPT</text></g>`;
  }
  return s + `<g transform="translate(0 ${slide(W.ga)})" opacity="${r1(Math.min(1, W.ga * 2))}">${g}</g>`;
}
// a new answer arriving: the old rows out, the answer number changes, the new rows slide in
function reask(t, v) {
  wt.to(W, { rows: 0, stamp: 0, hi: 0, duration: 0.12, ease: "power2.in" }, t - 0.12).set(W, { ver: v }, t)
    .to(W, { rows: 1, duration: 0.4, ease: "power2.out" }, t);
}

// ---------- HOOK0: frame one is ChatGPT's list without her, then Maya mid-panic ----------
// "ChatGPT named the best budget travel blogs." 0 to 2.8 s, "Not me." at 3.2 s, "I'm invisible." at 3.77 s
const NOTME = b.hook0.start + 3.2, INVIS = b.hook0.start + 3.77, SEE = b.hook0.start + 1.65;
wt.fromTo(W, { stamp: 0.75 }, { stamp: 1, duration: 0.25, ease: "back.out(3)", immediateRender: false }, 0.02);
F.sfx(0.05, "pop");
// her mouth stays small through the hook (the rig's open mouth reads as a grin on a worried face),
// and "I'm invisible." is mumbled through a closed frown as she sinks
MY.say(b.hook0.start, (M.hook0 || []).map((v, i) => v * (i / 30 < 3.72 ? 0.12 : 0.05)), "hook0").look(0, -0.5, 0.8);
// cut to her: hands on her cheeks, eyes on the laptop, the red pill in the window, a "!" pops
cut(SEE, { ...SH.maya, ins: 0, bad: 1 });
wt.fromTo(W, { ex: 0 }, { ex: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, SEE + 0.1);
F.sfx(SEE + 0.1, "boing");
MY.look(SEE + 0.6, -0.3, -0.6, 0.15).look(SEE + 1.1, -0.5, 0.8, 0.15);
// "Not me.": the wide, hands up by her head; Floey turns her head to her, unbothered
cut(NOTME - 0.08, { ...SH.wide, ex: 0 });
MY.expr(NOTME - 0.08, "panic").pose(NOTME - 0.06, "panic", 0.22).look(NOTME, -0.2, 0.1).jolt(NOTME);
F.tiltTo(NOTME + 0.25, -10, 0.5).look(NOTME + 0.25, 0.6, -0.2, 0.25);
// "I'm invisible.": a slow push in, she sinks, sad, eyes up and away
wt.to(W, { bad: 0, duration: 0.2 }, INVIS - 0.15);
shot(INVIS - 0.05, MT, 0.9, "power2.inOut");
MY.expr(INVIS, "sad").pose(INVIS, "rest", 0.45).slump(INVIS + 0.05, 0.6).look(INVIS + 0.1, 0.5, -0.6, 0.3);

// ---------- REFRAME1: hard cut to Floey alone on the lid, deadpan; then the re-ask ----------
cut(b.reframe1.start - 0.15, FT);
F.tiltTo(b.reframe1.start - 0.15, 0, 0.1).look(b.reframe1.start - 0.15, 0, 0);
ftw(b.reframe1.start - 0.1, { squint: 0.55, duration: 0.12 }); ftw(b.reframe1.end, { squint: 0, duration: 0.15 }); // a half-lidded look
F.say(b.reframe1.start, M.reframe1 || [], "reframe1");
F.look(b.reframe1.end + 0.05, 0.5, 0.9, 0.12).tiltTo(b.reframe1.end + 0.05, 16, 0.2); // a nod of the beak at the keyboard
// back on Maya: she sits up and types, hopeful
// answer 2 is complete (rows, ring, stamp) half a second before "Oh!": she reads it, then reacts
const ASK1 = b.reframe1.end + 0.05, V1 = b.reframe2.start - 1.0;
cut(ASK1, SH.maya);
MY.sit(ASK1 - 0.05, 0.25).pose(ASK1, "type", 0.18).look(ASK1, -0.5, 0.8).expr(ASK1, "think");
F.sfx(ASK1 + 0.05, "typing", { d: 0.3 });
// answer 2 swings in: her row slides in third, the ring, the green stamp
wt.set(W, { ver: 1, rows: 0, hi: 0, stamp: 0 }, V1 - 0.01).to(W, { ins: 1, duration: 0.3, ease: "power3.out" }, V1)
  .to(W, { rows: 1, duration: 0.28, ease: "power2.out" }, V1 + 0.07)
  .to(W, { hi: 1, stamp: 1, duration: 0.2, ease: "back.out(2.5)" }, V1 + 0.32);
F.sfx(V1, "whoosh");
F.sfx(V1 + 0.42, "ding");

// ---------- REFRAME2: "Oh!" on the list, "I'm third!" on her: a fist, beaming ----------
const OH = b.reframe2.start + 0.4;
MY.expr(b.reframe2.start - 0.3, "surprised").say(b.reframe2.start, M.reframe2 || [], "reframe2");
cut(OH, { ...SH.wide, ins: 0, bad: 0, good: 1 });
MY.expr(OH, "happy").pose(OH - 0.05, "fist", 0.18).look(OH, -0.3, -0.2).jolt(OH + 0.02);
F.tiltTo(OH, 0, 0.15).look(OH, 0, 0);
ftw(OH + 0.35, { squint: 0.9, duration: 0.25, ease: "sine.inOut" }); ftw(OH + 0.75, { squint: 0, duration: 0.25 }); // one slow blink

// one more ask she can't resist: answer 3, she's gone
const ASK2 = b.reframe2.end + 0.1, V2 = b.reframe3.start - 0.95;
cut(ASK2, SH.maya);
MY.pose(ASK2, "type", 0.15).look(ASK2, -0.5, 0.8).expr(ASK2, "smug");
F.sfx(ASK2 + 0.05, "typing", { d: 0.25 });
wt.set(W, { ver: 2, rows: 0, hi: 0, stamp: 0, good: 0 }, V2 - 0.01).to(W, { ins: 1, duration: 0.3, ease: "power3.out" }, V2)
  .to(W, { rows: 1, duration: 0.28, ease: "power2.out" }, V2 + 0.08)
  .to(W, { stamp: 1, duration: 0.2, ease: "back.out(2.5)" }, V2 + 0.42);
F.sfx(V2, "whoosh");
F.sfx(V2 + 0.42, "boing");
MY.expr(V2 + 0.3, "worried"); // off screen, her grin is already gone by the time we see her

// ---------- REFRAME3: "Wait." on the list, "Gone again." close on her face, worried then flat ----------
MY.say(b.reframe3.start, mo("reframe3", 0.1), "reframe3");
const GONE = b.reframe3.start + 0.45;
cut(GONE, { ...MT, ins: 0, good: 0 });
MY.expr(GONE - 0.05, "worried").pose(GONE - 0.05, "rest", 0.3).look(GONE, -0.4, 0.7);
MY.expr(b.reframe3.end + 0.05, "deadpan").look(b.reframe3.end + 0.05, 0, 0.3, 0.2);

// ---------- REFRAME4: Floey lifts off and hovers by Maya's head ----------
shot(b.reframe3.end + 0.12, SH.wide, 0.55);
F.tiltTo(b.reframe3.end, 0, 0.1).look(b.reframe3.end, 0, 0);
ftw(b.reframe3.end + 0.15, { y: SP.floeyLaptop.y + 12, sy: 0.92, duration: 0.12, ease: "power2.in" }); // a dip before take-off
F.takeoff(b.reframe3.end + 0.27).move(b.reframe4.start + 0.05, HOV.x, HOV.y, 0.6, "power2.inOut");
F.say(b.reframe4.start, M.reframe4 || [], "reframe4").tiltTo(b.reframe4.start + 1.2, -8, 0.2).tiltTo(b.reframe4.end - 0.1, 0, 0.2).tongue(b.reframe4.end + 0.05, 1);
MY.slump(b.reframe4.start, 0.5).look(b.reframe4.start + 0.1, -0.8, -0.3, 0.3);
// push to the two-shot on Floey for Maya's reaction on "same list twice": to the laptop, back to Floey
shot(b.reframe4.start + 1.0, FS, 0.7, "power2.inOut");
MY.expr(b.reframe4.start + 1.2, "annoyed").look(b.reframe4.start + 1.45, -0.5, 0.8, 0.15).look(b.reframe4.start + 1.95, -0.9, -0.3, 0.15).tiltTo(b.reframe4.start + 1.95, -4);

// ---------- DOUBT5: she sits up and points up at Floey in the air ----------
shot(b.doubt5.start - 0.2, WD, 0.5);
MY.sit(b.doubt5.start - 0.15, 0.3).tiltTo(b.doubt5.start, 0).pose(b.doubt5.start - 0.1, POINT_UP, 0.28).expr(b.doubt5.start - 0.05, "surprised").look(b.doubt5.start, -0.9, -0.5, 0.15);
MY.say(b.doubt5.start, mo("doubt5", 0.5), "doubt5").expr(b.doubt5.start + 0.7, "think");
F.look(b.doubt5.start + 0.2, 0.3, 0.2, 0.15).tiltTo(b.doubt5.end - 0.4, 18, 0.15).tiltTo(b.doubt5.end + 0.1, 0, 0.15);

// ---------- TIP6: Floey, still in the air by Maya, gives the path; Maya clicks along; the GA4 table ----------
// "Google Analytics." 0, "Traffic acquisition." 1.27, "Switch it to source." 2.55, "Find ChatGPT dot com." 3.8
const T6 = b.tip6.start;
F.chips(b.doubt5.end + 0.05, 1); // in the pause, before her line, so the tip stays clean
F.move(T6 - 0.15, HOV.x + 14, HOV.y + 30, 0.5, "sine.inOut"); // drifts a touch closer to the laptop
shot(T6 - 0.1, FS, 0.5);
F.say(T6, M.tip6 || [], "tip6");
MY.pose(T6, "rest", 0.3).look(T6 + 0.1, -0.85, -0.3, 0.3).expr(T6 + 0.2, "think");
// "Traffic acquisition.": she points her beak down at the laptop, Maya's eyes follow it and she nods along
F.look(T6 + 1.3, 0.4, 0.9, 0.12).tiltTo(T6 + 1.3, 14).tiltTo(T6 + 2.2, 0).look(T6 + 2.2, 0, 0);
MY.look(T6 + 1.45, -0.6, 0.8, 0.2).nod(T6 + 1.6, 2);
// "Switch it to source.": on Maya, typing, leaning in, three clicks
cut(T6 + 2.5, MS);
MY.pose(T6 + 2.45, "type", 0.2).look(T6 + 2.5, -0.5, 0.8).leanTo(T6 + 2.6, 3).expr(T6 + 2.6, "think");
[2.65, 3.1, 3.55].forEach((d) => F.sfx(T6 + d, "click"));
// "Find ChatGPT dot com.": the table swings in, rows slide in, her chatgpt.com row lights up
wt.to(W, { ga: 1, duration: 0.35, ease: "power3.out" }, T6 + 4.0)
  .to(W, { gaRows: 1, duration: 0.45, ease: "power1.out" }, T6 + 4.12)
  .to(W, { gaHi: 1, duration: 0.3, ease: "power2.out" }, T6 + 4.6);
F.sfx(T6 + 4.0, "whoosh");
F.sfx(T6 + 4.6, "tick");

// ---------- PAYOFF7: the line climbs in her row, the 23 pill, then her slow smile ----------
wt.to(W, { draw: 1, duration: 0.9, ease: "power1.inOut" }, b.tip6.end - 0.1)
  .to(W, { pop: 1, duration: 0.3, ease: "back.out(2)" }, b.payoff7.start + 0.55);
F.sfx(b.tip6.end, "rise");
F.sfx(b.payoff7.start + 0.55, "ding");
MY.say(b.payoff7.start, M.payoff7 || [], "payoff7").leanTo(b.payoff7.start, 0);
const REAL = b.payoff7.start + 1.1;
cut(REAL, { ...MT, ga: 0 });
MY.expr(REAL - 0.1, "surprised").look(REAL - 0.1, -0.4, 0.7).pose(REAL - 0.2, "rest", 0.3);
MY.expr(REAL + 0.3, "happy").look(REAL + 0.4, -0.1, 0.2, 0.4);
shot(REAL + 0.05, { camX: 665, camY: 845, zoom: 2.25 }, 1.1, "power1.out"); // a gentle push in

// ---------- BUTTON8: to Floey in the air beside her, a knowing little smile; then the silent look to camera ----------
F.move(b.button8.start - 0.3, HOV.x, HOV.y, 0.6, "sine.inOut");
shot(b.button8.start - 0.25, FS, 0.6);
MY.look(b.button8.start - 0.15, -0.9, -0.3, 0.2).tiltTo(b.button8.start, -4).expr(b.button8.start - 0.05, "smug");
MY.say(b.button8.start, mo("button8", 0.6), "button8");
F.look(b.button8.start + 0.3, 0, 0).tiltTo(b.button8.end - 0.4, 18, 0.15).tiltTo(b.button8.end + 0.2, 0, 0.2);
const LOOK = b.button8.end + 0.15;
cut(LOOK, MT);
MY.expr(LOOK, "deadpan").tiltTo(LOOK + 0.1, 0).look(LOOK + 0.2, 0, 0, 0.2);

// ---------- BUTTON9: Floey to the lens, smug chest puff, Maya still deadpan beside her; then she asks ChatGPT again ----------
cut(b.button9.start - 0.25, FB);
F.pivot(b.button9.start - 0.2, "front").mood(b.button9.start - 0.2, "hello");
ftw(b.button9.start + 0.05, { puff: 0.7, duration: 0.25, ease: "power2.out" });
F.say(b.button9.start, M.button9 || [], "button9");
// the listener: her eyes slide to Floey on "strangers", one corner of her mouth goes up
MY.look(b.button9.start + 0.9, -0.9, -0.3, 0.2).expr(b.button9.start + 1.1, "smug");
F.mood(b.button9.end + 0.08, "happy").chips(b.button9.end + 0.1, 2).wink(b.button9.end + 0.08);
ftw(b.button9.end + 0.45, { puff: 0, duration: 0.3 });
// the relapse: back on both, Maya grinning, typing one more ask; Floey's head snaps round to her
const RL = b.button9.end + 0.55;
cut(RL, { ...SH.wide, good: 0, bad: 0 });
F.mood(RL, "hello").pivot(RL + 0.25, "side").look(RL + 0.3, 0.5, 0.6).tiltTo(RL + 0.3, 14, 0.12);
MY.expr(RL, "happy").pose(RL - 0.05, "type", 0.2).look(RL, -0.5, 0.8).leanTo(RL + 0.05, 3);
F.sfx(RL + 0.05, "typing", { d: 0.4 });
// and the loop: answer 4, NOT LISTED, the way the reel began
const V4 = RL + 0.85;
wt.set(W, { ver: 3, rows: 0, hi: 0, stamp: 0 }, V4 - 0.01).to(W, { ins: 1, duration: 0.3, ease: "power3.out" }, V4)
  .to(W, { rows: 1, duration: 0.28, ease: "power2.out" }, V4 + 0.08)
  .to(W, { stamp: 1, duration: 0.22, ease: "back.out(2.5)" }, V4 + 0.5);
F.sfx(V4, "whoosh");
F.sfx(V4 + 0.5, "boing");
MY.expr(V4 + 0.4, "panic");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const world = DUO.room(t, { night: true }) + MY.svg(t) + DUO.deskFront() + DUO.laptop() + F.svg(t)
    + DUO.mark("!", 452, 690, W.ex, t)
    + DUO.stat(850, 470, W.bad, "not you", "bad") + DUO.stat(850, 470, W.good, "#3", "good");
  document.getElementById("stage").innerHTML = DUO.cam(world, W)
    + (W.end < 0.5 ? chatInsert() + gaInsert() : "")
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t, "Save this for your next audit");
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
