<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#efe6f3}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r027 "ChatGPT named my guide" (duo style, day set).
// Frame one: Maya alone, mid-panic, under her guide's visits chart (flat on the floor, "2 visits",
// a tag where ChatGPT named it). Floey is out of shot. "GA4 says": tight on her face.
// Mum texts: famous now? "GA4 is broken.": a jolt, a "?". Cut wide: Floey revealed on the lid.
// The tip: Floey hovers, one chip per step, Maya types. The check: the GA4 table, the ring on
// /packing-list-2023. Floey lands and winks on "2023". "Oh. So I update that one."
// The button: Floey tight, "Tell your Mum you're famous." Cut to Maya's face dropping on "In 2023".
// Silent beat: she sips, it's cold, a flat look to camera. Then the save card, its own shot. End card.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.3, hook1: 0.35, reframe2: 0.25, doubt3: 0.2, tip4: 0.45, check5: 0.5, payoff6: 0.3, payoff7: 0.35, button8: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
// after the last line: the sip, the cold wince, the look to camera, then the save card as its own shot
const TAIL = 4.5;
const END = Math.max(SPOKEN + 0.6, b.button8.end + TAIL), DUR = END + 1.6;
const at = (id, k) => b[id].start + b[id].len * k;   // a moment inside a line (k 0..1)

// one spelling on screen for Maya's mum: Floey says "mom" (she is American), the caption reads "Mum"
const CAPS = LINES.map((l) => l[0] === "button8" ? [l[0], l[1], l[2], l[3], (l[4] || l[1]).replace(/\bmom\b/, "Mum")] : l);

// ---------- shots for this reel (named shots nudged so nobody is sliced and cards never cover a face) ----------
const HOOK = { camX: 720, camY: 700, zoom: 1.55 };     // shot maya, lifted so she sits under the pinned chart; Floey off frame left
const MT = { camX: 640, camY: 840, zoom: 2.0 };        // mayaTight, her face centred; Floey (off frame left) stays clear of the caption band
const UNDER = { camX: 520, camY: 665, zoom: 1.12 };    // both under the pinned GA4 table

// ---------- the cast ----------
// Floey waits out of frame (left of the hook shot, above the caption band) and is on the lid,
// unseen, while the camera is tight on Maya, so the wide cut on her reframe is her reveal
const F = FLOEY.create({ ...SP.floeyLaptop, y: SP.floeyLaptop.y - 130, facing: -1, mood: "think", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: "cheeks", floey: F });
const SIPPING = { L: [262, 640], R: [336, 400], hold: "mug" };     // the mug up at her lips
const W = { ...HOOK, shake: 1, _t: 0, chart: 1, note: 0, huh: 0, bang: 0,
  ga: 0, gaRows: 0, gaHi: 0, pinK: 0, save: 0, saveRows: 0, saveHi: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);
const cut = (t, s) => wt.set(W, { ...s }, t);

// HOOK0: the problem is already on screen: her guide's visits, flat at 2, and Maya panicking under it.
MY.look(0, -0.1, -0.9).say(b.hook0.start, M.hook0 || [], "hook0");
F.sfx(0.05, "pop");
wt.to(W, { shake: 0, duration: 0.9, ease: "power2.out" }, 0);
shot(b.hook0.start + 0.3, { camX: 715, camY: 705, zoom: 1.6 }, 1.8, "sine.inOut");
// "GA4 says nobody came": the chart flies off, tight on her face, hands up by her head, frozen
const says = at("hook0", 0.55);
wt.to(W, { chart: 0, duration: 0.25, ease: "power2.in" }, says - 0.3);
F.sfx(says - 0.3, "swish");
cut(says - 0.05, MT);
F.move(says + 0.1, SP.floeyLaptop.x, SP.floeyLaptop.y, 0.3);
MY.pose(says - 0.05, "panic", 0.2).look(says, -0.1, 0.6).jolt(says + 0.05);
shot(says + 0.1, { camX: 640, camY: 838, zoom: 2.06 }, 1.6, "sine.out");

// HOOK1: "I've told Mum." Mum's text slides down; her eyes flick up to it, worried.
// "GA4 is broken.": upset. A jolt, a jab at the screen, and a "?" pops by her bun.
const mum = b.hook1.start + 0.15;
MY.expr(b.hook1.start - 0.1, "worried").pose(b.hook1.start - 0.1, "rest", 0.35).look(b.hook1.start, 0, 0.4)
  .say(b.hook1.start, M.hook1 || [], "hook1").look(mum + 0.15, 0.2, -1, 0.15);
wt.to(W, { note: 1, duration: 0.35, ease: "back.out(1.6)" }, mum);
F.sfx(mum, "ding");
const broken = at("hook1", 0.55);
MY.expr(broken - 0.1, "annoyed").jolt(broken - 0.05).pose(broken, "point", 0.25).look(broken + 0.1, 0.6, 0.4);
wt.to(W, { huh: 1, duration: 0.25, ease: "back.out(2)" }, broken + 0.4);
F.sfx(broken + 0.45, "boing");

// REFRAME2: cut wide. Floey revealed, unbothered on the lid; a wink and a tilt on "click".
// Maya swings to her, surprised, then deadpan with a tilt on "click", then thinking. Push in on "only sees clicks".
cut(b.reframe2.start - 0.12, SH.wide);
wt.to(W, { note: 0, huh: 0, duration: 0.2, ease: "power2.in" }, b.reframe2.start - 0.35);
F.mood(b.reframe2.start - 0.2, "hello").look(b.reframe2.start - 0.2, 0, 0).say(b.reframe2.start, M.reframe2 || [], "reframe2");
const click = at("reframe2", 0.4);
F.wink(click).tiltTo(click, 12, 0.3).tiltTo(at("reframe2", 0.75), 0, 0.25);
MY.pose(b.reframe2.start - 0.1, "rest", 0.4).expr(b.reframe2.start, "surprised").look(b.reframe2.start, -1, 0)
  .expr(click, "deadpan").tiltTo(click, 8, 0.3);
const sees = at("reframe2", 0.6);
shot(sees, SH.floey, 0.9, "power2.inOut");
F.preen(sees + 0.1, 0.7);
MY.expr(sees + 0.3, "think").tiltTo(sees + 0.4, 0, 0.4);

// DOUBT3: cut to Maya alone: worried, her shoulders drop.
cut(b.doubt3.start - 0.12, SH.maya);
MY.expr(b.doubt3.start - 0.12, "worried").look(b.doubt3.start - 0.1, -0.9, 0.1).slump(b.doubt3.start, 0.45)
  .say(b.doubt3.start, M.doubt3 || [], "doubt3").expr(at("doubt3", 0.7), "sad");

// TIP4: cut wide. "Some did." Floey lifts off the lid and hovers at Maya's eye height; Maya sits up, surprised.
cut(b.tip4.start - 0.1, SH.wide);
const lift = b.tip4.start - 0.05;
F.takeoff(lift).move(lift + 0.35, SP.floeyHover.x, SP.floeyHover.y, 0.5, "power2.inOut")
  .mood(b.tip4.start, "determined").look(b.tip4.start + 0.4, 0, 0.2).say(b.tip4.start, M.tip4 || [], "tip4");
MY.sit(b.tip4.start, 0.35).expr(b.tip4.start, "surprised").look(b.tip4.start + 0.2, -0.8, -0.3);
// one chip per step; Maya types each one in, a nod per step
const steps = [at("tip4", 0.33), at("tip4", 0.6), at("tip4", 0.84)];
shot(steps[0] - 0.3, SH.floey, 0.8, "power2.inOut");
MY.expr(steps[0] - 0.2, "think").pose(steps[0] - 0.2, "type", 0.3).leanTo(steps[0] - 0.2, 4, 0.3).look(steps[0] - 0.2, -0.5, 0.7);
F.sfx(steps[0] + 0.15, "typing", { d: b.tip4.end - steps[0] + 0.3 });
steps.forEach((s) => { F.chips(s, 1); MY.nod(s + 0.12, 1); });
F.tiltTo(steps[1], 10, 0.2).tiltTo(steps[2], -6, 0.2).tiltTo(b.tip4.end, 0, 0.2);

// CHECK5: "Wait." The GA4 table swings in full screen with its rows already arriving; the ring lands on
// /packing-list-2023. Her voice over it. Behind the card the camera is already on both of them.
const gaIn = b.check5.start - 0.3;
wt.to(W, { ga: 1, duration: 0.3, ease: "power3.out" }, gaIn)
  .to(W, { gaRows: 1, duration: 0.45, ease: "power1.out" }, gaIn + 0.05)
  .to(W, { gaHi: 1, duration: 0.3, ease: "back.out(1.6)" }, at("check5", 0.55));
F.sfx(gaIn, "whoosh").sfx(at("check5", 0.55), "ding");
cut(gaIn + 0.3, UNDER);
MY.leanTo(b.check5.start - 0.2, 0, 0.3).pose(b.check5.start - 0.1, "rest", 0.3).expr(b.check5.start - 0.1, "surprised").look(b.check5.start, -0.2, -0.8)
  .say(b.check5.start, M.check5 || [], "check5").expr(at("check5", 0.5), "think").pose(at("check5", 0.5), "chin", 0.35);

// PAYOFF6: the table pins up to the top; under it Floey drops back onto the lid and winks on "2023".
// Maya's eyes swing to her, surprised.
const pinAt = b.check5.end + 0.25;
wt.to(W, { pinK: 1, duration: 0.45, ease: "power3.inOut" }, pinAt);
F.land(pinAt, SP.floeyLaptop.x, SP.floeyLaptop.y, 0.5).mood(pinAt, "happy").look(pinAt + 0.5, 0, 0);
F.sfx(pinAt + 0.5, "tk");
F.say(b.payoff6.start, M.payoff6 || [], "payoff6");
const y2023 = at("payoff6", 0.62);
F.tiltTo(y2023 - 0.1, 14, 0.25).wink(y2023 + 0.1).tiltTo(b.payoff6.end + 0.05, 0, 0.2);
MY.look(b.payoff6.start, 0.1, -1).expr(b.payoff6.start, "think")
  .look(y2023, -0.9, 0).expr(y2023, "surprised").pose(y2023, "rest", 0.35);

// PAYOFF7: the card goes; on Maya. "Oh." surprised, a "!" pops, she lights up;
// "So I update that one.": proud, a small fist and a nod, then she types it hard.
wt.to(W, { ga: 0, duration: 0.25, ease: "power2.in" }, b.payoff7.start - 0.3);
F.sfx(b.payoff7.start - 0.3, "swish");
cut(b.payoff7.start - 0.05, SH.maya);
shot(b.payoff7.start, { camX: 715, camY: 815, zoom: 1.62 }, 1.4, "power2.out");
MY.expr(b.payoff7.start - 0.05, "surprised").look(b.payoff7.start, -0.2, 0.3).say(b.payoff7.start, M.payoff7 || [], "payoff7");
const bright = at("payoff7", 0.28);
wt.to(W, { bang: 1, duration: 0.25, ease: "back.out(2)" }, bright);
F.sfx(bright, "pop");
MY.expr(bright + 0.05, "happy").look(bright + 0.1, -0.8, 0);
const upd = at("payoff7", 0.55);
MY.expr(upd, "proud").pose(upd, "fist", 0.25).nod(upd + 0.15, 1)
  .pose(b.payoff7.end + 0.05, "type", 0.25).look(b.payoff7.end + 0.05, -0.4, 0.7);
F.sfx(b.payoff7.end + 0.1, "typing", { d: 0.5 });

// BUTTON8: Floey alone on the lid, dry, to Maya: "Tell your Mum you're famous." A smug tilt on "famous".
// Cut to Maya's face for the punchline: beaming, then flat on "In 2023". A dry chip after.
cut(b.button8.start - 0.1, SH.floeyTight);
wt.to(W, { bang: 0, duration: 0.2 }, b.button8.start - 0.3);
F.mood(b.button8.start - 0.1, "hello").look(b.button8.start, 0, 0).say(b.button8.start, M.button8 || [], "button8");
const famous = at("button8", 0.42), y23 = at("button8", 0.6);
F.mood(famous - 0.1, "happy").tiltTo(famous, 14, 0.3).tiltTo(y23, 0, 0.2);
MY.pose(b.button8.start + 0.2, "rest", 0.35).look(b.button8.start + 0.2, -0.9, 0).expr(famous, "happy");
cut(y23 - 0.15, MT);
MY.expr(y23 + 0.25, "deadpan").tiltTo(y23 + 0.3, -4, 0.3);
F.chips(b.button8.end + 0.1, 1);

// the silent beat, still tight on Maya. She reaches for her coffee and sips... it's cold.
// A wince, the mug comes down, and a flat look straight down the lens, held.
const sip = b.button8.end + 0.2;
MY.tiltTo(sip, 0, 0.2).expr(sip, "neutral").pose(sip, "mug", 0.3).pose(sip + 0.32, SIPPING, 0.25).look(sip, 0.4, 0.3);
F.sfx(sip + 0.55, "sip");
const cold = sip + 0.9;
MY.expr(cold, "annoyed").tiltTo(cold, -7, 0.12).tiltTo(cold + 0.2, 0, 0.3).look(cold, 0.6, 0.6);
F.sfx(cold + 0.02, "boing");
const stare = cold + 0.4;
MY.pose(stare, "mug", 0.3).expr(stare + 0.1, "deadpan").look(stare + 0.15, 0, 0, 0.3);
shot(stare + 0.1, { camX: 640, camY: 772, zoom: 2.2 }, 1.2, "sine.out");

// the save card: its own short shot after the look, the three steps Floey gave
const saveIn = stare + 1.25;
wt.to(W, { save: 1, duration: 0.35, ease: "power3.out" }, saveIn)
  .to(W, { saveRows: 1, duration: 0.4, ease: "power1.out" }, saveIn + 0.05)
  .to(W, { saveHi: 1, duration: 0.3, ease: "back.out(1.6)" }, saveIn + 0.55);
F.sfx(saveIn, "whoosh");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// ---------- what is on her screen ----------
const INK = HUM.colors.ink, MAG = HUM.colors.magenta, BAD = "#d24b4b";
const x0 = 150, x1 = 930, y0 = 760, y1 = 1180;
const px = (i, n) => x0 + (x1 - x0) * i / (n - 1), py = (v) => y1 - (y1 - y0) * v;
// her Portugal guide's visits, a week, scaled 0..50: on the floor all week (Maya's own example numbers)
const PTS = [0.06, 0.04, 0.05, 0.04, 0.06, 0.04, 0.04];
const NAMED = "ChatGPT named it", TWO = "2 visits";
function chartExtras() {
  let s = `<text x="${x0}" y="${y0 + 4}" font-family="Public Sans" font-weight="700" font-size="40" fill="${INK}" opacity=".55">50</text>`
    + `<text x="${x0}" y="${y1 + 56}" font-family="Public Sans" font-weight="700" font-size="40" fill="${INK}" opacity=".55">0 visits</text>`;
  // the day ChatGPT named her guide: a dashed line and a tag
  const ax = px(2, 7), tw = PROPS.measure(NAMED, "700 44px 'Space Grotesk'") + 44;
  s += `<path d="M${ax},${y0 + 110} V${py(PTS[2])}" stroke="${MAG}" stroke-width="6" stroke-dasharray="14 12"/>`
    + `<rect x="${(ax - 24).toFixed(1)}" y="${y0 + 26}" width="${tw.toFixed(1)}" height="76" rx="22" fill="${MAG}" stroke="${INK}" stroke-width="6"/>`
    + `<text x="${(ax - 24 + tw / 2).toFixed(1)}" y="${y0 + 79}" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="44" fill="#fff">${NAMED}</text>`;
  // the number she is panicking about, big
  const pw = PROPS.measure(TWO, "700 72px 'Space Grotesk'") + 60;
  s += `<rect x="${(x1 - pw).toFixed(1)}" y="${y1 + 10}" width="${pw.toFixed(1)}" height="104" rx="28" fill="${BAD}" stroke="${INK}" stroke-width="6"/>`
    + `<text x="${(x1 - pw / 2).toFixed(1)}" y="${y1 + 87}" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="72" fill="#fff">${TWO}</text>`;
  return s;
}
function chartCard() {
  if (W.chart <= 0.01) return "";
  const s = DUO.screenInsert(W.chart, 1, { title: "My Portugal guide: visits", points: PTS, color: BAD })
    .replace('font-size="46"', 'font-size="58"');
  return s.slice(0, -4) + chartExtras() + "</g>";
}
const GA = { title: "AI Assistant: landing pages", sub: "Traffic acquisition. My example sessions", cols: ["Landing page", "Sessions"],
  rows: [{ label: "/packing-list-2023", value: "38", tone: "brand", hi: true }, { label: "/lisbon-on-a-budget", value: "9" },
    { label: "/cheap-ferries-greece", value: "6" }, { label: "/ (home)", value: "4" }, { label: "/portugal-guide", value: "2", tone: "bad" }] };
// the save card: two title lines (the scripted title does not fit one), the three steps Floey said
const SAVECARD = { title: "Save this for next time", sub: "In GA4: Reports > Acquisition",
  rows: [{ label: "1  Open", value: "Traffic acquisition" }, { label: "2  Find row", value: "AI Assistant", tone: "brand", hi: true },
    { label: "3  Add", value: "+ Landing page" }] };
function saveCard() {
  const s = DUO.listInsert(W.save, W.saveRows, { ...SAVECARD, hiK: W.saveHi });
  if (!s) return "";
  const line2 = `<text x="150" y="770" font-family="Space Grotesk" font-weight="700" font-size="44" fill="${MAG}">ChatGPT mentions you</text>`;
  return s.slice(0, -4) + line2 + "</g>";
}

// a card pinned at the top of the frame, smaller, without the dimmed room behind it, so faces stay in view under it
const DIM = '<rect width="1080" height="1920" fill="#2d2f45" opacity=".55"/>';
const pin = (s, k = 0.9, top = 215) => s ? `<g transform="translate(540 ${top}) scale(${k}) translate(-540 -560)">${s.replace(DIM, "")}</g>` : "";
// the GA4 table: full screen (with the dim) while she reads it, then it shrinks up to the top as pinK goes 0 to 1
function gaCard() {
  const s = DUO.listInsert(W.ga, W.gaRows, { ...GA, hiK: W.gaHi });
  if (!s) return "";
  const p = W.pinK, k = 1 - 0.2 * p, top = 560 - (560 - 215) * p;
  return `<rect width="1080" height="1920" fill="#2d2f45" opacity="${(0.55 * (1 - p) * Math.min(1, W.ga * 2)).toFixed(3)}"/>`
    + `<g transform="translate(540 ${top.toFixed(1)}) scale(${k.toFixed(3)}) translate(-540 -560)">${s.replace(DIM, "")}</g>`;
}
// the camera, with a small panic shake on the opening that settles by 0.9 s
const camAt = () => ({ camX: W.camX + Math.sin(W._t * 47) * 7 * W.shake, camY: W.camY + Math.cos(W._t * 41) * 5 * W.shake, zoom: W.zoom });
// one mug: on the desk until it is in her hand (from the mug pose on, to the end)
const mugHeld = (t) => t > sip + 0.15;
// her coffee went cold long ago: no steam on the mug in her hand
const coldMug = (s) => s.replace(/<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/, "");
// the rig draws every open mouth as a grin (flat top, round bottom). On her upset faces, turn the open
// mouth over (arched top, flat bottom, lower teeth) so a panicked line reads as panic, not delight.
const UPSET = new Set(["panic", "worried", "annoyed", "sad"]);
const MOUTH_RE = /<path d="(M[^"]+Z)" fill="#5a1f22"[^>]*\/>\s*<clipPath id="mq\d+"><path d="[^"]+"\/><\/clipPath>\s*<g clip-path="url\(#mq\d+\)">(<ellipse[^>]*\/>)<rect[^>]*\/><\/g>/;
function frown(s, t) {
  if (!UPSET.has(MY.state(t).expr)) return s;
  return s.replace(MOUTH_RE, (all, d, tongue) => {
    const ys = d.match(/-?\d+(\.\d+)?/g).map(Number).filter((_, i) => i % 2);
    return `<g transform="translate(0 ${(Math.min(...ys) + Math.max(...ys)).toFixed(1)}) scale(1 -1)">${all.replace(tongue, "")}</g>`;
  });
}

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false); W._t = t;
  const world = DUO.room(t) + frown(coldMug(MY.svg(t)), t) + DUO.deskFront() + DUO.laptop() + (mugHeld(t) ? "" : DUO.mug()) + F.svg(t)
    + DUO.mark("?", 800, 690, W.huh, t) + DUO.mark("!", 830, 660, W.bang, t);
  document.getElementById("stage").innerHTML = DUO.cam(world, camAt())
    + pin(chartCard(), 0.62, 228)
    + DUO.notification(W.note, "Mum", "So are you famous now?", 210)
    + gaCard()
    + (W.end < 0.5 ? DUO.captions(CAPS, B, t) : "")
    + (W.end < 0.5 ? saveCard() : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); W._t = t; return camAt(); };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
