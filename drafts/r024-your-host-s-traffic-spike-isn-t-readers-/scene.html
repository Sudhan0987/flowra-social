<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}

</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r024 "It Went Viral (Three Hundred Times)". Night, lamp on.
// Frame one: Maya grinning, fist up, the green "+14,000 host visits" pill by her head.
// "I'm telling my sponsor": her draft "IT WENT VIRAL!!" types itself; on "viral" Floey turns her head.
// "Your host counts every request, Maya.": the two-shot favouring Floey; "Bots too.": cut to Maya's face.
// "But it says visits.": she jabs at the laptop. The tip: wide on Floey with an orange GA4 tag by her,
// Maya sighs and leans in, then a push to the two-shot favouring Floey, Maya nodding, a chip on "by itself". The check: Maya clicks through the menus, Floey flies to her
// shoulder, the GA4 Traffic acquisition list fills row by row. "Oh. Three hundred.": the big pill
// deflates into "300 GA4 sessions", a "?" over her head. "Real ones, though.": Floey leans in, fond.
// "From Reddit!": the ring lands on reddit.com, then her small fist. Floey to camera for the send-ask.
// Silent button: deadpan, she clicks once and her brag draft turns into "Draft deleted", then she stares
// straight into the camera while Floey preens. End card.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.3, reframe1: 0.25, doubt2: 0.2, tip3: 0.35, check4: 0.6, payoff5: 0.25, payoff6: 0.2, payoff7: 0.4, button8: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
// the silent button (delete the draft, look to camera) plays out after Floey's last line
const END = Math.max(SPOKEN + 0.6, b.button8.end + 2.8), DUR = END + 1.6;
const INK = HUM.colors.ink;
const r1 = (n) => Math.round(n * 10) / 10;

// Maya's faces: the rig's open mouth reads as a grin, so on her worried, sad, annoyed and deadpan beats
// the open mouth is drawn as a fret (corners down). The mug she holds has no steam: the coffee is cold.
const EX = MAYA.EXPR;
const FRET = { worried: 1, panic: 1, sad: 1, annoyed: 0.7, deadpan: 0.5 };
const OPEN = /<path d="[^"]*" fill="#5a1f22"[^>]*\/>\s*<clipPath id="(mq\d+)"><path d="[^"]*"\/><\/clipPath>\s*<g clip-path="url\(#\1\)">[\s\S]*?<\/g>/;
const STEAM = /<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/;
function fretMouth(open, u, id) {
  const cx = 300, cy = 336, w = (u > 0 ? 30 + 8 * u : 22) + open * 6, h = 14 + open * 38, cY = cy + h * 0.3 * u, lo = cy + h * 0.6;
  const d = `M${r1(cx - w)},${r1(cY)} Q${cx},${r1(cy - h * 0.85)} ${r1(cx + w)},${r1(cY)} Q${r1(cx + w * 0.9)},${r1(lo)} ${cx},${r1(lo)} Q${r1(cx - w * 0.9)},${r1(lo)} ${r1(cx - w)},${r1(cY)}Z`;
  return `<path d="${d}" fill="#5a1f22" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><clipPath id="${id}f"><path d="${d}"/></clipPath><g clip-path="url(#${id}f)"><ellipse cx="${cx}" cy="${r1(lo)}" rx="${r1(w * 0.6)}" ry="${r1(h * 0.32)}" fill="#e07a76"/></g>`;
}
function maya(t) {
  const st = MY.state(t), u = FRET[st.expr];
  let s = MAYA.svg(st).replace(STEAM, "");
  if (u !== undefined) {
    const open = EX[st.expr].round ? Math.max(st.mouth, 0.2) : st.mouth;
    s = s.replace(OPEN, (all, id) => fretMouth(open, u, id));
  }
  return `<g transform="translate(${MY.S.x} ${r1(MY.S.y + MY.S.bob)}) scale(${SP.maya.scale} ${SP.maya.scale}) translate(-300 -760)">${s}</g>`;
}
// her own poses for this scene (local units, see maya.js)
const YES = { L: [228, 705], R: [500, 176] };                // a fist punched up high
const PUMP = { L: [228, 705], R: [486, 250] };               // the fist, pumped down a little
const HOVER = { L: [252, 650], R: [348, 650] };              // hands frozen above the keys
const JAB = { L: [92, 566], R: [372, 705], kL: "point" };    // jabbing a finger at the laptop (screen left)
const PULL = { L: [128, 600], R: [372, 705], kL: "point" };  // the jab pulled back
const MOUSE = { L: [252, 690], R: [348, 690] };              // hands on the trackpad, clicking (no typing)
const TAP = { L: [252, 690], R: [348, 676] };                // the click itself
const FISTL = { L: [172, 236], R: [372, 705] };              // "yes!" with her other hand (Floey is on the right shoulder)
// Floey keeps her laptop size on the shoulder, so she sits a little higher than DUO.SPOT.floeyShoulder
const SHO = { x: 805, y: 1052 };

// framings
const HOOK = { camX: 770, camY: 820, zoom: 1.45 };     // frame one: her grin and the number, Floey out of frame
const HOOK2 = { camX: 762, camY: 812, zoom: 1.52 };    // the slow drift in on the brag
const WIDE = { ...SH.wide };
const FL = { ...SH.floey };                            // two-shot favouring Floey (the pill is out of this frame)
const FL2 = { ...FL, camX: 462, zoom: 1.36 };
// her face (the pill is out of this frame); a touch tighter than DUO.SHOT.mayaTight so Floey, off the left
// edge, is also well below the caption band
const TIGHT = { camX: 640, camY: 760, zoom: 2.35 };
const TWO = { camX: 600, camY: 985, zoom: 1.2 };       // two-shot favouring Maya, her pill and Floey in frame
const MAYA_M = { ...SH.maya };                         // Maya, with Floey on her shoulder
const SHOULDER = { camX: 720, camY: 905, zoom: 1.72 }; // Floey on her shoulder, Maya's head beside her
const BTN = { camX: 735, camY: 925, zoom: 1.66 };      // Floey to camera on the shoulder
const LOOKS = { camX: 728, camY: 850, zoom: 1.58 };    // the last look: Maya, mug, Floey preening

// her example numbers: GA4 Traffic acquisition, by session source / medium (they add up to 300)
const ROWS = [
  { label: "reddit.com / referral", value: "180", tone: "good", hi: true },
  { label: "google / organic", value: "60" },
  { label: "(direct) / (none)", value: "40" },
  { label: "pinterest.com / referral", value: "20" },
  { label: "Total", value: "300", tone: "brand" },
];
const GA = { title: "GA4: Traffic acquisition", sub: "Reports > Acquisition > Traffic acquisition", cols: ["Session source / medium", "Sessions"], rows: ROWS };

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "think", perched: true, view: "side" });
const LID = 0.42; // her flat, heavy-lidded look: she has seen this brag before
const MY = MAYA.create({ ...SP.maya, expr: "happy", pose: YES, floey: F });
const W = { ...HOOK, bigP: 1, realP: 0, wob: 0, d: 0, t1: 0, del: 0, delK: 0, ga: 0, q: 0, list: 0, rows: 0, hi: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
// camera: every move goes into CAMS and is added at the end, each clipped so it ends before the next starts
const CAMS = [];
const shot = (t, s, d = 0.6, ease = "power3.inOut") => CAMS.push({ t, s, d, ease });
const cut = (t, s) => CAMS.push({ t, s, d: 0 });
const drift = (t, from, to, until) => { cut(t, from); shot(t + 0.01, to, until - t - 0.01, "none"); };
const set = (t, v) => wt.set(W, v, t);
const slowBlink = (t, back = LID) => { F.tl.to(F.S, { squint: 1, duration: 0.16 }, t).to(F.S, { squint: back, duration: 0.22 }, t + 0.45); };

// HOOK0: frame one is the brag, mid-celebration. Two small fist pumps on "Fourteen thousand visits
// overnight!"; Floey on the lid is looking down at the keys, unbothered
const H = b.hook0.start, TELL = H + 2.1, VIRAL = H + 3.45;
drift(0, HOOK, HOOK2, TELL);
MY.look(0, -0.2, -0.2).say(H, M.hook0 || [], "hook0").pose(H + 0.35, PUMP, 0.12).pose(H + 0.5, YES, 0.14).pose(H + 0.95, PUMP, 0.12).pose(H + 1.1, YES, 0.14)
  .tiltTo(H + 0.3, -4, 0.3).nod(H + 1.3, 1);
F.sfx(H + 0.35, "pop");
F.look(0, -0.3, 0.7).tiltTo(0, -8, 0.01);
// "I'm telling my sponsor": she drops to the keys and the draft types itself
cut(TELL - 0.1, MAYA_M);
shot(TELL - 0.09, { ...MAYA_M, zoom: 1.6, camY: 830 }, VIRAL - TELL - 0.1, "none");
MY.expr(TELL - 0.1, "proud").pose(TELL - 0.15, "type", 0.25).look(TELL - 0.1, -0.5, 0.85, 0.15).tiltTo(TELL, 3, 0.3);
wt.to(W, { d: 1, duration: 0.3, ease: "back.out(1.6)" }, TELL)
  .to(W, { t1: 1, duration: 1.2, ease: "none" }, TELL + 0.3);
F.sfx(TELL, "whoosh").sfx(TELL + 0.4, "typing", { d: 1.2 });
// "...it went viral.": wide on both; Floey slowly turns her head up to Maya, lids heavy
cut(VIRAL - 0.2, WIDE);
shot(VIRAL - 0.19, { ...WIDE, zoom: 1.15, camX: 565 }, b.reframe1.start - VIRAL, "none");
F.look(VIRAL, 0.45, -0.1, 0.4).tiltTo(VIRAL, 4, 0.5);
F.tl.to(F.S, { squint: LID, duration: 0.3 }, VIRAL + 0.2);

// REFRAME1: the two-shot favouring Floey (the pill's corner is out of this frame). One dry chip, then the
// line. Behind her, Maya is still typing; on "Bots too." her hands stop dead above the keys and we cut to her face
const RE = b.reframe1.start, BOTS = RE + 2.1;
cut(RE - 0.2, FL); set(RE - 0.2, { bigP: 0 });
shot(RE - 0.19, FL2, BOTS - RE + 0.1, "none");
F.chips(RE - 0.15, 1).mood(RE - 0.1, "think").say(RE, M.reframe1 || [], "reframe1").tiltTo(RE + 0.6, 10, 0.3).look(RE + 0.6, 0.35, 0.6, 0.15)
  .look(BOTS - 0.1, 0.45, -0.05, 0.12).tiltTo(BOTS - 0.1, -4, 0.25);
F.sfx(RE + 0.5, "typing", { d: 1.3 });
MY.pose(BOTS - 0.05, HOVER, 0.12).expr(BOTS, "surprised").look(BOTS, -0.9, 0.1, 0.1);
F.sfx(BOTS, "tick");
cut(BOTS + 0.05, TIGHT);
shot(BOTS + 0.06, { ...TIGHT, zoom: 2.42, camY: 765 }, b.doubt2.start - BOTS - 0.2, "none");
MY.tiltTo(BOTS + 0.25, -6, 0.3).look(BOTS + 0.5, -0.5, 0.8, 0.2);

// DOUBT2: two-shot favouring Maya, the pill back by her head. Annoyed, she jabs at the laptop twice,
// defending her number; Floey, on the lid, tilts her head and gives one slow, unimpressed blink
const DO = b.doubt2.start;
drift(DO - 0.12, TWO, { ...TWO, zoom: 1.25, camY: 975 }, b.tip3.start - 0.05);
set(DO - 0.12, { bigP: 1 });
MY.expr(DO - 0.1, "annoyed").pose(DO - 0.1, JAB, 0.2).look(DO - 0.1, -0.85, 0.3).tiltTo(DO - 0.1, 0, 0.2).say(DO, M.doubt2 || [], "doubt2")
  .pose(DO + 0.5, PULL, 0.1).pose(DO + 0.62, JAB, 0.1).tiltTo(DO + 0.6, -6, 0.25);
F.sfx(DO + 0.65, "tick");
F.look(DO, 0.45, 0).tiltTo(DO + 0.2, -12, 0.3);
slowBlink(DO + 0.75);

// TIP3: Floey, the speaker, stays in shot for the whole tip. Wide first: she tilts her head the other way
// and starts the tip; on "Google Analytics" an orange "GA4 / Google Analytics" tag pops up by her, the
// other screen, opposite Maya's green host pill. Maya lowers her hand, sighs and leans in to the laptop.
// On "Traffic acquisition." push to the two-shot favouring Floey: Maya listens and nods slowly (she is
// giving in), then her hands go to the trackpad. A crisp chip on "by itself"
const TP = b.tip3.start, TA = TP + 2.0, TE = b.tip3.end;
cut(TP - 0.12, WIDE);
shot(TP - 0.11, { ...WIDE, zoom: 1.18, camX: 560 }, TA - TP - 0.1, "none");
F.mood(TP - 0.1, "happy").tiltTo(TP, 12, 0.3).look(TP, 0.45, -0.05).say(TP, M.tip3 || [], "tip3");
F.tl.to(F.S, { squint: 0.2, duration: 0.2 }, TP);
wt.to(W, { ga: 1, duration: 0.3, ease: "back.out(2)" }, TP + 0.45);
F.sfx(TP + 0.45, "pop");
MY.pose(TP + 0.1, "rest", 0.4).expr(TP + 0.15, "deadpan").look(TP + 0.1, -0.85, 0.1).slump(TP + 0.4, 0.5).leanTo(TP + 1.0, -5, 0.5);
cut(TA - 0.1, FL); set(TA - 0.1, { bigP: 0 });
shot(TA - 0.09, { ...FL, camX: 455, zoom: 1.4 }, TE - TA + 0.1, "none");
F.mood(TA - 0.1, "determined").tiltTo(TA + 0.1, -6, 0.25).look(TA + 0.1, 0.45, 0.05).tiltTo(TA + 1.3, 4, 0.3).chips(TE - 0.55, 1);
MY.expr(TA - 0.1, "think").look(TA - 0.1, -0.8, 0.05, 0.2).nod(TA + 0.35, 1).sit(TA + 0.6, 0.4).leanTo(TA + 0.6, 0, 0.4)
  .expr(TA + 1.5, "neutral").pose(TA + 1.6, MOUSE, 0.3).look(TA + 1.6, -0.45, 0.85, 0.15);

// CHECK4: wide as the line ends: Floey takes off from the lid and lands on Maya's shoulder to look; the GA4
// tag goes. She clicks "Reports." and the draft slides away; on "Acquisition." the GA4 report swings in and
// its rows fill in one by one while she is still reading the menus, a tick each, the total landing on
// "Traffic acquisition..."
const C4 = b.check4.start, OPENR = C4 + 0.5;
cut(TE, WIDE); set(TE, { bigP: 1 });
shot(TE + 0.01, { ...WIDE, zoom: 1.16, camX: 590 }, OPENR - TE, "none");
wt.to(W, { ga: 0, duration: 0.2, ease: "power2.in" }, TE);
F.takeoff(TE).mood(TE, "think").land(TE + 0.12, SHO.x, SHO.y, 0.45).face(TE + 0.7, 1).look(TE + 0.7, 0.3, 0.6);
MY.expr(C4 - 0.1, "think").look(C4 - 0.1, -0.45, 1.0, 0.15).say(C4, M.check4 || [], "check4")
  .pose(C4 + 0.05, TAP, 0.06).pose(C4 + 0.13, MOUSE, 0.08).pose(C4 + 0.42, TAP, 0.06).pose(C4 + 0.5, MOUSE, 0.08);
F.sfx(C4 + 0.05, "click");
wt.to(W, { d: 0, duration: 0.25, ease: "power2.in" }, C4 + 0.1);
const ROWT = 1.5, ROW0 = OPENR + 0.05;
wt.to(W, { list: 1, duration: 0.3, ease: "power3.out" }, OPENR)
  .to(W, { rows: 1, duration: ROWT, ease: "none" }, ROW0);
F.sfx(OPENR, "whoosh");
for (let i = 1; i < ROWS.length; i++) F.sfx(ROW0 + (i + 0.6) * ROWT / ROWS.length, "tick");

// PAYOFF5: "Oh." over the report, then out to her face for "Three hundred.": worried, shoulders drop, the
// big pill deflates into a small "300 GA4 sessions", a "?" over her head. Floey looks at her sideways
const P5 = b.payoff5.start, TH = P5 + 0.4;
MY.expr(P5 - 0.1, "worried").say(P5, M.payoff5 || [], "payoff5").look(P5, -0.45, 0.85);
cut(TH, MAYA_M); set(TH, { list: 0, bigP: 1 });
shot(TH + 0.01, { ...MAYA_M, zoom: 1.6, camY: 835 }, b.payoff6.start - TH - 0.2, "none");
MY.slump(TH + 0.05, 0.5).expr(TH + 0.35, "sad").look(TH + 0.4, -0.3, 0.9, 0.3);
wt.to(W, { wob: 1, duration: 0.25, ease: "none" }, TH)
  .to(W, { bigP: 0, duration: 0.18, ease: "back.in(2)" }, TH + 0.05)
  .to(W, { realP: 1, duration: 0.25, ease: "back.out(2)" }, TH + 0.15)
  .to(W, { q: 1, duration: 0.25, ease: "back.out(2)" }, TH + 0.7);
F.sfx(TH + 0.05, "boing").sfx(TH + 0.7, "pop");
F.look(TH + 0.2, 0.35, 0.15).tiltTo(TH + 0.2, 8, 0.3);

// PAYOFF6: closer on the shoulder. Floey leans toward Maya's ear with a small, fond nod; Maya's eyes slide
// back to the screen and her face softens
const P6 = b.payoff6.start;
cut(P6 - 0.12, SHOULDER);
shot(P6 - 0.11, { ...SHOULDER, zoom: 1.8, camX: 715 }, b.payoff7.start - P6, "none");
F.mood(P6 - 0.1, "happy").say(P6, M.payoff6 || [], "payoff6").tiltTo(P6, 16, 0.25).look(P6, 0.5, 0.2)
  .tiltTo(P6 + 0.45, 24, 0.12).tiltTo(P6 + 0.57, 14, 0.18);
F.tl.to(F.S, { squint: 0.1, duration: 0.2 }, P6);
MY.expr(P6 + 0.3, "think").look(P6 + 0.3, -0.5, 1.0, 0.25).sit(P6 + 0.3, 0.5);

// PAYOFF7: "From Reddit!": back on the report, the ring grows around reddit.com / referral; then out to
// her: happy, a small fist, the "?" gone
const P7 = b.payoff7.start, OUT7 = P7 + 0.75;
set(P7 - 0.15, { list: 1, rows: 1, hi: 0 });
wt.to(W, { hi: 1, duration: 0.3, ease: "power2.out" }, P7);
F.sfx(P7 + 0.05, "ding");
MY.expr(P7 - 0.05, "happy").say(P7, M.payoff7 || [], "payoff7");
cut(OUT7, MAYA_M); set(OUT7, { list: 0, q: 0 });
shot(OUT7 + 0.01, { ...MAYA_M, zoom: 1.6, camY: 835 }, b.button8.start - OUT7 - 0.2, "none");
MY.pose(OUT7 - 0.05, FISTL, 0.2).look(OUT7, 0.3, 0.2).nod(OUT7 + 0.1, 1);
F.look(OUT7, 0.4, 0.1).tiltTo(OUT7, 4, 0.2);

// BUTTON8: Floey pivots to camera on Maya's shoulder, chest puffed, for the send-ask. Maya, still happy,
// glances at her; on "screenshots" her smile drops (she is that friend). One chip at the end
const BT = b.button8.start, SS = BT + 1.9;
cut(BT - 0.15, BTN);
shot(BT - 0.14, { ...BTN, zoom: 1.74, camY: 935 }, b.button8.end - BT + 0.2, "none");
F.pivot(BT - 0.12, "front").mood(BT - 0.1, "happy").look(BT - 0.1, 0, 0).tiltTo(BT - 0.1, 0, 0.2).say(BT, M.button8 || [], "button8")
  .chips(b.button8.end + 0.05, 1);
F.tl.to(F.S, { puff: 0.5, squint: 0.15, duration: 0.3 }, BT - 0.1).to(F.S, { puff: 0, duration: 0.3 }, b.button8.end + 0.3);
MY.pose(BT - 0.1, "rest", 0.35).look(BT, 0.8, 0.1, 0.2).expr(SS, "deadpan").look(SS, 0.2, 0.5, 0.2);

// SILENT: wide. Her unsent "IT WENT VIRAL!!" draft is back up. Deadpan, she clicks once and it turns into
// "Draft deleted" with a tick. Then she turns and stares straight into the camera, no words (she is the
// friend who screenshots the host dashboard), arms crossed, while Floey, back in profile, preens
const E8 = b.button8.end, DEL = E8 + 0.45, LOOK = E8 + 1.2;
cut(E8 + 0.12, WIDE);
shot(E8 + 0.13, { ...WIDE, zoom: 1.16, camX: 585 }, LOOK - E8 - 0.15, "none");
F.view(E8 + 0.12, "side");
MY.expr(E8 + 0.12, "deadpan").pose(E8 + 0.12, MOUSE, 0.2).look(E8 + 0.12, -0.5, 0.85, 0.15).tiltTo(E8 + 0.12, 0, 0.2);
wt.to(W, { d: 1, duration: 0.25, ease: "back.out(1.6)" }, E8 + 0.14);
MY.pose(DEL - 0.06, TAP, 0.06).pose(DEL + 0.06, MOUSE, 0.1);
F.sfx(DEL, "click");
set(DEL + 0.02, { del: 1 });
wt.to(W, { delK: 1, duration: 0.3, ease: "back.out(2.4)" }, DEL + 0.05);
F.sfx(DEL + 0.4, "ding");
cut(LOOK, LOOKS);
shot(LOOK + 0.01, { ...LOOKS, zoom: 1.66, camY: 840 }, END - LOOK - 0.02, "none");
MY.look(LOOK, 0, 0, 0.12).tiltTo(LOOK, -3, 0.3).pose(LOOK + 0.15, "crossed", 0.35);
F.preen(LOOK + 0.2, 0.9);

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");

// the camera list, in time order, each move clipped to end before the next one starts
CAMS.sort((a, c) => a.t - c.t).forEach((c, i) => {
  const next = CAMS[i + 1] ? CAMS[i + 1].t : DUR;
  const s = { camX: c.s.camX, camY: c.s.camY, zoom: c.s.zoom };
  if (!c.d) wt.set(W, s, c.t);
  else wt.to(W, { ...s, duration: Math.max(0.01, Math.min(c.d, next - c.t - 0.005)), ease: c.ease }, c.t);
});
wt.set({}, {}, DUR);

// a number pill by her head: the number big, what it counts under it; spike draws a little bar chart
const PS = 0.7;
const GAX = 290, GAY = 805; // the GA4 tag, above Floey on the lid
function pill(k, num, label, col, spike, wob, PX = 862, PY = 585) {
  if (k <= 0.01) return "";
  const wn = PROPS.measure(num, "700 60px 'Space Grotesk'"), wl = PROPS.measure(label, "800 34px 'Public Sans'");
  const sw = spike ? 92 : 0, tw = Math.max(wn, wl), w = tw + sw + 56, h = 132, s = PS * (0.6 + 0.4 * Math.min(1, k));
  // the deflate wobble: a sideways shake with a little squash (no rotation, so the two texts never cross)

function draft(k, typed, del, delK, t, y = 232) {

    : `<rect x="${r1(bx)}" y="47" width="${r1(bw)}" height="56" rx="28" fill="${HUM.colors.coral}" stroke="${INK}" stroke-width="5"/><text x="${r1(bx + bw / 2)}" y="86" text-anchor="middle" font-family="Public Sans" font-weight="800" font-size="30" fill="#fff">Send</text>`;
  return `<g transform="translate(${r1(540 - w / 2)} ${r1(y + dy)})" opacity="${r1(Math.min(1, k * 2))}"><rect x="0" y="0" width="${r1(w)}" height="${h}" rx="34" fill="#fffaf2" stroke="${INK}" stroke-width="6"/>
<rect x="28" y="33" width="84" height="84" rx="22" fill="${HUM.colors.violet}" stroke="${INK}" stroke-width="5"/><text x="70" y="91" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="44" fill="#fff">S</text>
<text x="138" y="66" font-family="Space Grotesk" font-weight="700" font-size="34" fill="${INK}" opacity=".7">${to}</text>${shown ? `<text x="138" y="118" font-family="Public Sans" font-weight="600" font-size="${fs}" fill="${del ? "#2f9e62" : INK}">${PROPS.esc(shown)}</text>` : ""}${caret}
