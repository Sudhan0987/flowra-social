<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>

<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r046 "The page Google picked instead". Duo style, night. The shape of reel/duo/template.html.
// Frame one: night, lamp on, Maya's hands on her cheeks, a red "2 pages not indexed" pill by her head.
// A push into her panic on "except", then her screen: Search Console, Pages, two rows "Duplicate".
// Floey, deadpan on the lid: "It picked a favorite." Maya stabs Request Indexing twice ("!").
// The URL Inspection insert names the page Google chose. Maya points at Floey: "That's a different page!"
// Floey winks, "Side by side.": the two pages' first lines, word for word the same (ring). Maya's guilty
// look; then the wide: Floey flies up by her head for the tip, and Maya rewrites both copied pages,
// section by section, top to bottom. "So it's back tomorrow?" "Up to two weeks." Maya slumps. Floey to camera:
// "You're welcome." Maya's long flat look down the lens. End card.
// start loading the web fonts now, so PROPS.measure never caches a fallback width (the long pill overflowed)
["700 54px 'Space Grotesk'", "800 52px 'Public Sans'", "700 36px 'Public Sans'"].forEach((ft) => document.fonts.load(ft));
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.3, reframe1: 0.35, doubt2: 0.25, check3: 0.35, check4: 0.2, reframe5: 0.6, payoff6: 0.4, tip7: 0.4, doubt8: 0.25, payoff9: 0.5, button10: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
const at = (id, k) => b[id].start + k * b[id].len;      // a fraction k of the way through a line
// Maya's flat look to camera plays out before the end card
const END = Math.max(SPOKEN + 0.6, b.button10.end + 2.0), DUR = END + 1.6;

// ---------- shots (the named shots, nudged so nobody is sliced) ----------
const WIDE = { ...SH.wide };
const MAYA_S = { camX: 750, camY: 820, zoom: 1.55 };     // maya, a touch right so Floey's wing never pokes in at the left edge
const MAYA_IN = { camX: 740, camY: 810, zoom: 1.68 };
const TIGHT = { camX: 640, camY: 845, zoom: 2.1 };       // mayaTight, her whole face mid-frame
const TIGHT_IN = { camX: 640, camY: 850, zoom: 2.2 };
const FL = { ...SH.floey };
const FL_IN = { camX: 476, camY: 998, zoom: 1.36 };
// floeyTight: Floey centred, the laptop's spark whole and above the captions, Maya fully out of the frame
const FT = { camX: 285, camY: 1075, zoom: 2.25 };

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "hello", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "worried", pose: "cheeks", floey: F });
const W = { ...WIDE, pill: 1, bang: 0, what: 0, pages: 0, pRows: 0, pRing: 0, url: 0, uRows: 0, uRing: 0, same: 0, sRows: 0, sRing: 0,
  fix: 0, fRows: 0, fPage: 0, f1: 0, f2: 0, f3: 0, fRing: 0, done: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
// Every camera move and prop change is a fromTo that starts where the last one on that value ended,
// so any frame seeked in any order gives the same picture. (From r040.)
const last = {}, lastEnd = {};
function key(t, vals, d = 0.3, ease = "power2.out") {
  const from = {}, ks = Object.keys(vals);
  let t0 = t;
  for (const k of ks) { from[k] = k in last ? last[k] : W[k]; t0 = Math.max(t0, lastEnd[k] ?? 0); }
  wt.fromTo(W, from, { ...vals, duration: d, ease, immediateRender: false }, t0);
  for (const k of ks) { last[k] = vals[k]; lastEnd[k] = t0 + d; }
}
const cam = (s) => ({ camX: s.camX, camY: s.camY, zoom: s.zoom });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => key(t, cam(s), d, ease);
const cutTo = (t, s) => key(t, cam(s), 0.001, "none");
// Floey's eyes half shut (deadpan) and open again
const lids = (t, v, d = 0.2) => F.tl.to(F.S, { squint: v, duration: d, ease: "power2.out" }, t);
const slowBlink = (t) => { lids(t, 1, 0.16); lids(t + 0.32, 0.4, 0.2); };
// where the eyes go
const F_MAYA = [0.7, -0.3], F_SCREEN = [0.3, 0.9];
const M_LAPTOP = [-0.5, 0.9], M_FLOEY = [-1, 0.3], M_HOVER = [-1, -0.1];
const KEYS_X = 420, SCREEN_X = 540;
// Maya's face: held stares with no stray blink
const STARE = [];
const mayaState = MY.state;
MY.state = (t) => {
  const s = mayaState(t);
  if (STARE.some(([a, z]) => t >= a && t <= z)) s.blink = 0;
  if (s.expr === "panic") s.mouth = Math.min(s.mouth, 0.55);
  return s;
};

// HOOK0: frame one, the problem already up. Wide: hands on her cheeks, eyes on the laptop, the red pill
// by her head. Floey turns her head slowly to Maya and blinks once. On "except" a push into her face, her
// hands fly up (a jolt); on "the ones I actually need" the Pages report swings in.
const h = b.hook0.start;
MY.look(0, ...M_LAPTOP, 0.01).say(h, M.hook0 || [], "hook0");
F.look(0, 0.2, 0.6, 0.01).tiltTo(0, 10, 0.01);
F.sfx(0.1, "pop", { x: 760 });
F.tiltTo(0.35, 0, 0.6).look(0.4, ...F_MAYA, 0.5);
slowBlink(0.95);
MY.tiltTo(0.2, -3, 0.3).tiltTo(0.7, 2, 0.4);
const except = at("hook0", 0.4);
key(except - 0.45, { pill: 0 }, 0.25, "power2.in");
shot(except - 0.2, MAYA_S, 0.45, "power3.out");
MY.expr(except - 0.05, "panic").pose(except - 0.05, "panic", 0.22).jolt(except + 0.05);
shot(except + 0.3, MAYA_IN, 0.9, "sine.inOut");
const pg = at("hook0", 0.6);
key(pg, { pages: 1 }, 0.32, "power3.out");
F.sfx(pg, "whoosh");
key(pg + 0.3, { pRows: 1 }, 0.45, "power1.out");
key(at("hook0", 0.92), { pRing: 1 }, 0.3, "power2.out");
F.sfx(at("hook0", 0.92), "tick", { x: SCREEN_X });
STARE.push([0, b.hook0.end]);

// REFRAME1: the report swings away on a closer two-shot favouring Floey. Deadpan: lids half shut, a slow
// blink, a quick preen between the two sentences. Maya's hands come down, still worried; on "favorite"
// her face turns annoyed.
const r1 = b.reframe1.start;
cutTo(r1 - 0.3, FL);
key(r1 - 0.25, { pages: 0 }, 0.28, "power2.in");
shot(r1, FL_IN, b.reframe1.len + 0.3, "sine.inOut");
F.mood(r1 - 0.2, "think").look(r1 - 0.2, ...F_MAYA, 0.1).say(r1, M.reframe1 || [], "reframe1");
lids(r1 - 0.1, 0.4, 0.2);
slowBlink(r1 + 0.3);
F.preen(at("reframe1", 0.44), 0.6);
lids(at("reframe1", 0.44), 0, 0.1); lids(at("reframe1", 0.75), 0.4, 0.15);
MY.expr(r1 - 0.2, "worried").pose(r1 - 0.1, "rest", 0.45).sit(r1 - 0.1, 0.3).look(r1, ...M_FLOEY, 0.15);
MY.expr(at("reframe1", 0.82), "annoyed").tiltTo(at("reframe1", 0.82), -5, 0.3);

// DOUBT2: cut to Maya, a slow push. She types, stabbing Request Indexing twice (clicks on the laptop),
// a red "!" pops by her head on the second press.
const d2 = b.doubt2.start;
cutTo(d2 - 0.12, MAYA_S);
shot(d2, MAYA_IN, b.doubt2.len + 0.2, "sine.inOut");
lids(d2, 0, 0.1);
MY.expr(d2 - 0.1, "worried").pose(d2 - 0.12, "type", 0.25).look(d2 - 0.1, ...M_LAPTOP, 0.12).tiltTo(d2, 0, 0.2).say(d2, M.doubt2 || [], "doubt2");
const c1 = at("doubt2", 0.36), c2 = at("doubt2", 0.68);
F.sfx(c1, "click", { x: KEYS_X });
F.sfx(c2, "click", { x: KEYS_X });
MY.tiltTo(c1, 3, 0.08).tiltTo(c1 + 0.1, 0, 0.12).tiltTo(c2, 4, 0.08).tiltTo(c2 + 0.1, 0, 0.12);
MY.expr(c2 - 0.05, "panic");
key(c2, { bang: 1 }, 0.18, "back.out(2)");
key(b.doubt2.end + 0.05, { bang: 0 }, 0.15, "power2.in");

// CHECK3: the wide. Floey tilts towards the screen as if reading it ("Open URL Inspection."), then a tk as
// she turns back to Maya. Maya types the address. On "See who Google picked" the URL Inspection insert
// swings in and the ring lands on Google's choice.
const c3 = b.check3.start;
cutTo(c3 - 0.15, WIDE);
F.mood(c3 - 0.15, "happy").say(c3, M.check3 || [], "check3").tiltTo(c3, 16, 0.25).look(c3, ...F_SCREEN, 0.12);
lids(c3, 0.3, 0.15);
const back3 = at("check3", 0.4);
F.tiltTo(back3, 0, 0.12).look(back3, ...F_MAYA, 0.08).sfx(back3, "tk");
MY.expr(c3 + 0.05, "think").pose(c3 + 0.1, "rest", 0.3).look(c3 + 0.05, ...M_FLOEY, 0.12);
MY.pose(back3, "type", 0.25).look(back3, ...M_LAPTOP, 0.12);
F.sfx(back3 + 0.2, "typing", { d: 0.8, x: KEYS_X });
const ui = at("check3", 0.58);
key(ui, { url: 1 }, 0.32, "power3.out");
F.sfx(ui, "whoosh");
key(ui + 0.3, { uRows: 1 }, 0.4, "power1.out");
const picked = at("check3", 0.9);
key(picked, { uRing: 1 }, 0.3, "power2.out");
F.sfx(picked, "ding", { x: SCREEN_X });

// CHECK4: "My recipe development page?" read off the insert, then cut to her: the "?" boings up, she turns
// to Floey and points, leaning in, indignant, on "That's a different page!"
const c4 = b.check4.start;
MY.expr(c4 - 0.1, "surprised").say(c4, M.check4 || [], "check4");
const away4 = at("check4", 0.42);
cutTo(away4 - 0.2, MAYA_S);
key(away4, { url: 0 }, 0.25, "power2.in");
key(away4 + 0.05, { what: 1 }, 0.2, "back.out(2)");
F.sfx(away4 + 0.05, "boing", { x: 800 });
MY.pose(away4 - 0.1, "rest", 0.2).look(away4, ...M_FLOEY, 0.12);
const diff = at("check4", 0.55);
MY.expr(diff, "annoyed").pose(diff, "pointL", 0.25).leanTo(diff, -4, 0.3).tiltTo(diff, -4, 0.2);
key(diff + 0.35, { what: 0 }, 0.2, "power2.in");
shot(diff, MAYA_IN, b.check4.end - diff + 0.2, "sine.inOut");
MY.nod(at("check4", 0.8), 1);

// REFRAME5: the closer two-shot. Floey flicks her tongue and winks at Maya on "Is it?". Maya's arm comes down,
// she leans to the laptop, thinking. On "Side by side." the two first lines swing in, one after the other.
const r5 = b.reframe5.start;
cutTo(r5 - 0.12, FL);
F.mood(r5 - 0.1, "happy").look(r5 - 0.1, ...F_MAYA, 0.08).say(r5, M.reframe5 || [], "reframe5");
F.tongue(r5 + 0.05, 2);
F.wink(at("reframe5", 0.32));
MY.expr(r5 + 0.1, "think").pose(r5 + 0.05, "rest", 0.35).leanTo(r5 + 0.1, 3, 0.4).tiltTo(r5 + 0.1, 3, 0.3).look(r5 + 0.3, ...M_LAPTOP, 0.15);
shot(r5, FL_IN, b.reframe5.len, "sine.inOut");
// on "Side by side." the two opening lines swing in, one after the other; both are up well before "Word for word."
const si = at("reframe5", 0.45);
key(si, { same: 1 }, 0.26, "power3.out");
F.sfx(si, "swish");
key(si + 0.12, { sRows: 1 }, 0.28, "power2.out");   // the two rows land back to back, so the pair is complete almost at once
F.sfx(si + 0.42, "tk", { x: SCREEN_X });

// PAYOFF6: "Oh." over the two lines; the ring on "Word for word." (boing). Then the reaction cut to her
// face: surprised, sinking to worried, the eyes sliding to Floey, guilty, held over the start of the tip.
const p6 = b.payoff6.start;
MY.expr(p6 - 0.1, "surprised").leanTo(p6, 0, 0.3).tiltTo(p6, 0, 0.2).say(p6, M.payoff6 || [], "payoff6");
const wfw = at("payoff6", 0.42);
key(wfw, { sRing: 1 }, 0.35, "power2.out");
F.sfx(wfw, "boing", { x: SCREEN_X });
// the reaction cut, short: her face sinks, the eyes slide to Floey (guilty), held in the line's gap only
const face = b.payoff6.end + 0.05;
key(face, { same: 0 }, 0.001, "none");
cutTo(face, TIGHT);
shot(face + 0.001, TIGHT_IN, b.tip7.start - face, "sine.inOut");
MY.look(face, ...M_LAPTOP, 0.01).expr(face + 0.1, "worried").look(face + 0.2, -1, 0.1, 0.3);
STARE.push([face, b.tip7.start + 0.4]);

// TIP7: the wide, from the first word. Floey leaves the lid with a flutter and hovers by Maya's head for
// "Google thinks they're one page." Maya looks up at her, then turns to the laptop and types. Her screen:
// /recipe-testing, section by section top to bottom, "Same" flips to "Its own" (a tk each). Then the second
// duplicate, /food-photography: the same three sections, all rewritten (a ding). Back on the wide for
// "top to bottom": Floey still hovering by her head, Maya typing.
const t7 = b.tip7.start;
cutTo(t7 - 0.05, WIDE);
F.mood(t7 - 0.1, "happy").say(t7, M.tip7 || [], "tip7");
lids(t7, 0, 0.1);
F.takeoff(t7 + 0.02).move(t7 + 0.3, SP.floeyHover.x, SP.floeyHover.y, 0.55, "power2.inOut").look(t7 + 0.5, ...F_MAYA, 0.1);   // takeoff carries its flutter
MY.expr(t7 + 0.15, "think").look(t7 + 0.3, M_HOVER[0], 0.2, 0.25).tiltTo(t7 + 0.3, -4, 0.3);
MY.pose(t7 + 1.0, "type", 0.3).expr(t7 + 1.0, "neutral").look(t7 + 1.0, ...M_LAPTOP, 0.15).tiltTo(t7 + 1.0, 0, 0.25);
F.sfx(t7 + 1.1, "typing", { d: 0.5, x: KEYS_X });
F.chips(t7 + 0.95, 1);
const fx = t7 + 1.7;
key(fx, { fix: 1 }, 0.3, "power3.out");
F.sfx(fx, "whoosh");
key(fx + 0.25, { fRows: 1 }, 0.3, "power2.out");
[["f1", 2.2], ["f2", 2.6], ["f3", 3.0]].forEach(([k, s]) => { key(t7 + s, { [k]: 1 }, 0.2, "back.out(2)"); F.sfx(t7 + s, "tk", { x: SCREEN_X }); });
// the second page: the rows slide in again as "Same", then all three flip together
const pg2 = t7 + 3.35;
key(pg2, { fRows: 0, fPage: 1, f1: 0, f2: 0, f3: 0 }, 0.001, "none");
F.sfx(pg2, "swish");
key(pg2 + 0.02, { fRows: 1 }, 0.3, "power2.out");
key(pg2 + 0.6, { f1: 1, f2: 1, f3: 1, fRing: 1 }, 0.25, "back.out(2)");
F.sfx(pg2 + 0.6, "ding", { x: SCREEN_X });
const out7 = pg2 + 1.1;
key(out7, { fix: 0 }, 0.25, "power2.in");
key(out7 + 0.2, { done: 1 }, 0.3, "back.out(2)");
F.sfx(out7 + 0.25, "pop", { x: 700 });
MY.nod(out7 + 0.3, 1);
key(b.tip7.end + 0.05, { done: 0 }, 0.15, "power2.in");   // gone before the cut to Maya

// DOUBT8: cut to Maya, hopeful: the think face, a small tilt, eyes up and left to Floey hovering out of frame.
const d8 = b.doubt8.start;
cutTo(d8 - 0.12, MAYA_S);
MY.expr(d8 - 0.12, "think").pose(d8 - 0.15, "rest", 0.3).look(d8 - 0.1, -1, 0.35, 0.15).tiltTo(d8, -7, 0.3).say(d8, M.doubt8 || [], "doubt8");
// Floey drops back to the lid while Maya is in her close shot
F.land(b.doubt8.end - 0.35, SP.floeyLaptop.x, SP.floeyLaptop.y, 0.45);

// PAYOFF9: the wide. Floey just landed, deadpan, one slow blink. Maya slumps: deadpan, shoulders down.
const p9 = b.payoff9.start;
cutTo(p9 - 0.15, WIDE);
F.mood(p9 - 0.1, "think").look(p9 - 0.1, ...F_MAYA, 0.08).say(p9, M.payoff9 || [], "payoff9");
lids(p9, 0.4, 0.15);
slowBlink(at("payoff9", 0.7));
const slump = at("payoff9", 0.6);
MY.expr(slump, "deadpan").tiltTo(slump, 0, 0.3).slump(slump, 0.5).look(slump, ...M_FLOEY, 0.2);
F.sfx(slump + 0.05, "boing", { x: 640 });

// BUTTON10: Floey alone, she pivots to the camera, a little smug: "You're welcome." and a slow blink.
// Then cut to Maya, slumped, arms crossed, her long flat look down the lens.
const b10 = b.button10.start;
cutTo(b10 - 0.25, FT);
F.pivot(b10 - 0.15, "front").mood(b10 - 0.15, "happy").look(b10 - 0.1, 0, 0, 0.08).say(b10, M.button10 || [], "button10");
lids(b10, 0.45, 0.15);
slowBlink(b.button10.end + 0.05);
const stare = b.button10.end + 0.45;
cutTo(stare, MAYA_S);
shot(stare + 0.001, MAYA_IN, END - stare, "sine.inOut");
MY.pose(stare - 0.3, "crossed", 0.35).look(stare + 0.1, 0, 0, 0.45);
STARE.push([stare, END]);

// END: the logo card drops in
key(END, { end: 1 }, 0.5, "back.out(1.6)");
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// ---------- screen-space parts ----------
const PAGES = [
  { label: "/about", value: "Indexed", tone: "good" },
  { label: "/recipe-development", value: "Indexed", tone: "good" },
  { label: "/food-photography", value: "Duplicate", tone: "bad" },
  { label: "/recipe-testing", value: "Duplicate", tone: "bad", hi: true },
];
const pages = () => DUO.listInsert(W.pages, W.pRows, { title: "Search Console: Pages", cols: ["Page", "Status"], rows: PAGES, hiK: W.pRing, sub: "Reason: Duplicate without user-selected canonical" });
const url = () => DUO.listInsert(W.url, W.uRows, { title: "URL Inspection: /recipe-testing", cols: ["Canonical", "URL"], sub: "Google shows this page instead",
  rows: [{ label: "User-declared", value: "None" }, { label: "Google-selected", value: "/recipe-development", tone: "bad", hi: true }], hiK: W.uRing });
// the two pages' opening lines, word for word the same: both rows ringed on "Word for word."
const OLD = "“Recipes that work.”";
const same = () => DUO.listInsert(W.same, W.sRows, { title: "Opening lines, side by side", cols: ["Page", "Opening line"], sub: "Same words, two pages",
  rows: [{ label: "/recipe-testing", value: OLD, tone: "bad", hi: true }, { label: "/recipe-development", value: OLD, tone: "bad", hi: true }], hiK: W.sRing });
// the fix, top to bottom: each section of the page gets words only it says. Page one row by row, then page two.
function fix() {
  const row = (label, k) => k > 0.5 ? { label, value: "Its own", tone: "good", hi: true } : { label, value: "Same", tone: "bad" };
  const page = W.fPage > 0.5 ? "/food-photography" : "/recipe-testing";
  return DUO.listInsert(W.fix, W.fRows, { title: `Rewrite: ${page}`, cols: ["Section", "Words"], sub: `Page ${W.fPage > 0.5 ? 2 : 1} of 2, top to bottom`,
    rows: [row("Intro", W.f1), row("What I do", W.f2), row("How I work", W.f3)], hiK: W.fPage > 0.5 ? W.fRing : 1 });
}

// ---------- world parts ----------
// the rig draws every open mouth as a grin. On her upset faces, turn the open mouth over (arched top,
// flat bottom) so a worried line reads as worry, not delight. (Same fix as r027 to r045.)
const UPSET = new Set(["panic", "worried", "annoyed", "sad", "surprised", "deadpan", "think"]);
const MOUTH_RE = /<path d="(M[^"]+Z)" fill="#5a1f22"[^>]*\/>\s*<clipPath id="mq\d+"><path d="[^"]+"\/><\/clipPath>\s*<g clip-path="url\(#mq\d+\)">(<ellipse[^>]*\/>)<rect[^>]*\/><\/g>/;
function frown(s, e) {
  if (!UPSET.has(e)) return s;
  const sy = e === "deadpan" ? 0.5 : e === "annoyed" ? 0.42 : e === "think" ? 0.6 : 1;
  return s.replace(MOUTH_RE, (all, d, tongue) => {
    const ys = d.match(/-?\d+(\.\d+)?/g).map(Number).filter((_, i) => i % 2);
    const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
    return `<g transform="translate(0 ${mid.toFixed(1)}) scale(1 ${(-sy).toFixed(2)}) translate(0 ${(-mid).toFixed(1)})">${all.replace(tongue, "")}</g>`;
  });
}
const mayaSvg = (t) => `<g data-maya="1">${frown(MY.svg(t), MY.state(t).expr)}</g>`;
// Floey is drawn only when her body is in the frame: in Maya's close-ups a stray beak tip would poke in
const floeyVisible = (t) => { const p = F.pose(t), x = 540 + (p.x - W.camX) * W.zoom; return x > -60 && x < 1140; };
// and Maya only when more than a sliver of her is in the frame: in Floey's close shot she is fully out
const mayaVisible = () => W.camX + 540 / W.zoom > 540;
const PILL = { x: 700, y: 430 };    // above her bun, clear of the shelf

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const world = DUO.room(t, { night: true }) + (mayaVisible() ? mayaSvg(t) : "") + DUO.deskFront() + DUO.laptop()
    + (floeyVisible(t) ? F.svg(t) : "")
    + DUO.stat(PILL.x, PILL.y, W.pill, "2 pages not indexed", "bad")
    + DUO.stat(PILL.x, PILL.y, W.done, "2 of 2 rewritten", "good")
    // the marks sit on the pale wall by her ear, below the dark window, so they read
    + DUO.mark("!", 860, 860, W.bang, t) + DUO.mark("?", 850, 860, W.what, t);
  // captions wait while a screen cutaway is travelling, so a caption never sits on its title
  const moving = [W.pages, W.url, W.same, W.fix].some((k) => k > 0.01 && k < 0.99);
  document.getElementById("stage").innerHTML = DUO.cam(world, W)
    + pages() + url() + same() + fix()
    + (W.end < 0.5 && !moving ? DUO.captions(LINES, B, t) : "")
    // a quick opaque wash first, so the end card never sits over a faded room
    + (W.end > 0.01 ? `<rect width="1080" height="1920" fill="#fffaf2" opacity="${Math.min(1, W.end * 4).toFixed(2)}"/>` : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
