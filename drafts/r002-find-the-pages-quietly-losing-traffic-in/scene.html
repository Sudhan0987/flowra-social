<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Public+Sans:wght@800&display=swap" rel="stylesheet">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/world/garden.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="lines.js"></script>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f7f4ee}svg{display:block}</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r002: find the pages fading inside a flat clicks line (before, after, bridge).
// AFTER (hook): the report already open, compared, sorted; the worst page's row
// glows over its drooping flower. BEFORE: Floey dashes right to left and the
// answer clears in her wake: one flat line, six flowers that look fine. Up
// close, two pages fade on cue. BRIDGE: Date, Compare, Pages, Clicks Difference
// twice, Queries, drawn in Floey's own paper and ink. "Save this" lands back on
// the finished table; she catches the page's bug, and the camera pulls back to
// the opening frame exactly (the fix comes next, so the flower stays faded).
const C = HUM.colors, M = window.MOUTHS || {};
const LINES = window.LINES;
// ask for both fonts now (no caption shows at t 0), so document.fonts.ready waits for them
// and no box is ever measured with a fallback font
document.fonts.load("800 50px 'Public Sans'"); document.fonts.load("700 28px 'Space Grotesk'");
const GAP = { hook0: 0.45, body1: 0.35, body2: 0.5, body3: 0.4, body4: 0.6, body5: 0.6, payoff6: 0.55, loop7: 0.4, go8: 0.75, url9: 0.35 };
const { B, DUR } = PROPS.timing(LINES, M, GAP);
const b = B, INK = C.ink, FONT = "Space Grotesk";
// captions hold their last words through the pause after a line (no blank
// frames mid-reel), and the address stays up to the very end
const CAPB = Object.fromEntries(LINES.map(([id], i) => {
  const nx = LINES[i + 1];
  return [id, { ...B[id], end: nx ? Math.max(B[id].end, B[nx[0]].start - 0.35) : DUR }];
}));
const clamp = (v, a = 0, z = 1) => Math.max(a, Math.min(z, v));
const smooth = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };

// ---------- the garden: six pages; the third (F3) and fifth (F5) are quietly fading ----------
const FL = {
  F1: { x: 30, base: 1720, h: 480, pal: [C.amber, C.coral, C.magenta], dir: 1, seed: 5 },
  F2: { x: 190, base: 1720, h: 380, pal: [C.magenta, C.violet, C.amber], dir: -1, seed: 9 },
  F3: { x: 480, base: 1720, h: 450, pal: [C.violet, C.indigo, C.magenta], dir: -1, seed: 3 },
  F4: { x: 655, base: 1720, h: 370, pal: [C.indigo, C.violet, C.coral], dir: 1, seed: 13 },
  F5: { x: 820, base: 1720, h: 440, pal: [C.coral, C.amber, C.magenta], dir: 1, seed: 11 },
  F6: { x: 1065, base: 1720, h: 360, pal: [C.magenta, C.amber, C.violet], dir: 1, seed: 17 },
};
const head = PROPS.head;
const LOW3 = 0.2, LOW5 = 0.3, FINE = 0.9;     // faded health, and "looks fine from up here"
const H3 = head(FL.F3, LOW3);                 // the drooping worst page

// ---------- the Performance panel (Floey's drawing of the report) ----------
// the chart sits above the Date chip, so the Date menu drops below the chart
// and never hides the line the Compare step is about
const PX = 110, PY = 170, PW = 860, PH0 = 345, PH_TABS = 430, PH1 = 750;
const IX0 = PX + 34, IX1 = PX + PW - 34;           // inner left / right
const CH = { x0: 164, x1: 916, y0: 300, y1: 392 };  // the chart's plot area
const CHIP_Y = 452;                                 // the Date chip row, under the chart
const TOT = [0.5, 0.47, 0.53, 0.49, 0.52, 0.48, 0.51, 0.5, 0.54, 0.49, 0.5, 0.52];
const PREV = [0.72, 0.75, 0.7, 0.74, 0.71, 0.76, 0.72, 0.73, 0.69, 0.74, 0.72, 0.71];
const MX = IX0, MY = CHIP_Y + 44;                   // the Date menu
const TABS_Y = 520, HDR_Y = 618, ROW_Y = 630, RH = 64;
// example numbers: Clicks Difference is a plain count of clicks. o = row position [unsorted, wrong way, losses on top]
const PAGES = [
  { label: "/content-calendar", diff: 12, fl: "F1", o: [0, 1, 2] },
  { label: "/seo-checklist", diff: -120, fl: "F3", o: [1, 3, 0] },
  { label: "/link-building", diff: 35, fl: "F2", o: [2, 0, 3] },
  { label: "/keyword-guide", diff: -64, fl: "F5", o: [3, 2, 1] },
];
const QUERIES = [{ label: "seo checklist", diff: -70 }, { label: "seo audit template", diff: -32 }, { label: "site audit steps", diff: -18 }];

// where Floey's beak lands on each control (world). Measured text widths are
// not available yet (the web font loads after this runs, and an early measure
// is cached for good), so the tap points use the widths at Space Grotesk 700.
const measure = PROPS.measure, esc = PROPS.esc;
const chipW = (label) => measure(label, `700 28px '${FONT}'`) + 132;
const W_CHIP = 272, W_OPT = 490, W_HDR = 196;
const TAP = {
  chev: { x: IX0 + W_CHIP + 132 - 50, y: CHIP_Y },
  cmp: { x: MX + 24 + 225 + 52, y: MY + 36 },
  opt: { x: MX + 74 + W_OPT, y: MY + 164 },
  pages: { x: IX0 + 240 + 40, y: TABS_Y + 22 },
  hdr: { x: IX1 - W_HDR - 34, y: HDR_Y - 10 },
  row0: { x: IX0 + 280, y: ROW_Y + 28 },
  queries: { x: IX0 + 80 + 56, y: TABS_Y + 22 },
};

// the world. Opening values are the AFTER state (and the final frame).
const W = {
  camX: 540, camY: 960, zoom: 1, shx: 0, shy: 0,
  h1: 1, h2: 1, h3: LOW3, h4: 1, h5: LOW5, h6: 1, shiver: 0,
  p1: 0.999, ping: 0, tpulse: 0, cpulse: 0,
  menu: 0, cmpTab: 0, picked: 0, compare: 1, cmpLine: 1,
  ph: PH1, tabs: 1, tabActive: 1, rows: 1, s1: 1, s2: 1, glow: 1, narrow: 0, filter: 0, q: 0, example: 1,
  bug: 0,
};
const BEFORE = { h3: FINE, h5: FINE, compare: 0 };    // what the wipe in body1 reveals

const TAPS = []; // [t, x, y] tap rings
const tapAt = (t, p) => TAPS.push([t, p.x, p.y]);

// ---------- Floey's performance, cued to the voice ----------
const HOME = { x: 310, y: 1060 };             // just above the drooping third flower (opening = final frame)
const PARK = { x: 830, y: 1020 };             // below the report, out of the way of the chart and the table
// the camera on the report: the whole card and Floey stay inside the frame
const ON_CHART = { camX: 540, camY: 600, zoom: 1.12 }, ON_TABLE = { camX: 540, camY: 700, zoom: 1.08 };
const F = FLOEY.create({ x: HOME.x, y: HOME.y, facing: 1, scale: 1.15, mood: "hello", view: "front" });
const wt = gsap.timeline({ paused: true });
wt.set(W, { camX: 540, camY: 960, zoom: 1 }, 0);

// HOOK: the finished check. The worst page's row pings; Floey looks from the row
// down to its drooping flower, and the camera eases in so they read as a pair.
F.say(b.hook0.start, M.hook0 || [], "hook0")
 .look(0.45, 0.35, -1, 0.12).sfx(0.55, "tk", { x0: 700 })
 .look(1.4, -0.1, 1, 0.1).mood(1.4, "worried").sfx(1.6, "rustle", { n: 1, x0: 430 })
 .look(2.6, 0.4, -1, 0.1)
 .look(3.3, -0.1, 1, 0.08)
 .mood(3.7, "determined").look(3.7, 0, 0, 0.1)
 .tongue(4.4, 1);
// a gentle push: the whole report stays on screen, clear of Instagram's header
wt.to(W, { ping: 1, duration: 0.8, ease: "none" }, 0.45)
  .to(W, { camX: 520, camY: 925, zoom: 1.05, duration: 1.8, ease: "sine.inOut" }, 2.4);

// BODY1: the wipe. She zips right, then dashes left; the answer clears in her
// wake and the garden goes back to "fine from up here" under one flat line.
const T0 = b.body1.start + 0.05, DASH = 0.7, T1 = T0 + DASH + 0.05;
F.pivot(b.hook0.end - 0.2, "side").mood(b.hook0.end - 0.2, "hello")
 .dart(b.hook0.end - 0.05, 930, 990, 0.28)
 .say(b.body1.start, M.body1 || [], "body1")
 .dart(T0, 170, 990, DASH, 1)
 .sfx(T0 + 0.05, "swish", { x0: 540 })
 .mood(T1, "happy")
 .preen(b.body1.start + 1.05, 0.8);
wt.to(W, { camX: 540, camY: 960, zoom: 1, duration: 0.8, ease: "power2.inOut" }, b.hook0.end - 0.05);
// when she passes the third flower its fallen petal floats back up
let TPASS3 = T1; for (let t = T0; t < T1; t += 1 / 60) if (F.pose(t).x < 470) { TPASS3 = t; break; }
wt.to(W, { p1: 0, duration: 0.45, ease: "power2.inOut" }, TPASS3)
  .set(W, { h3: FINE, h5: FINE, compare: 0, cmpLine: 0, rows: 0, tabs: 0, glow: 0, example: 0, s1: 0, s2: 0, tabActive: 0 }, T1)
  .to(W, { ph: PH0, duration: 0.4, ease: "power2.inOut" }, T1);
F.sfx(TPASS3 + 0.1, "pluck", { x0: 430 }).sfx(T1 + 0.05, "tk", { x0: 900 });

// BODY2: up close, the third and fifth pages fade; her head flicks between them
F.dart(b.body2.start, 640, 1080, 0.32)
 .say(b.body2.start, M.body2 || [], "body2")
 .mood(b.body2.start + 0.5, "worried")
 .face(b.body2.start + 0.95, 1).look(b.body2.start + 0.95, 0.3, 0.8, 0.06)
 .face(b.body2.start + 1.6, -1)
 .face(b.body2.start + 2.25, 1)
 .sfx(b.body2.start + 1.0, "pluck", { x0: 400 }).sfx(b.body2.start + 1.15, "pluck", { x0: 900 })
 .sfx(b.body2.start + 1.4, "rustle", { n: 2, x0: 380 });
wt.to(W, { camX: 640, camY: 1060, zoom: 1.3, duration: 0.8, ease: "power2.inOut" }, b.body2.start)
  .to(W, { h3: LOW3, duration: 1.2, ease: "power1.inOut" }, b.body2.start + 1.0)
  .to(W, { h5: LOW5, duration: 1.2, ease: "power1.inOut" }, b.body2.start + 1.15)
  .to(W, { p1: 0.999, duration: 1.5, ease: "none" }, b.body2.start + 1.35);

// BODY3: she turns to you, then zips up beside the Date chip (never on it)
F.pivot(b.body3.start, "front").mood(b.body3.start, "hello").look(b.body3.start + 0.05, 0, 0, 0.1)
 .say(b.body3.start, M.body3 || [], "body3")
 .chips(b.body3.start + 1.05, 1)
 .pivot(b.body3.start + 1.4, "side")
 .dart(b.body3.start + 1.6, 720, 600, 0.34, 1)
 .mood(b.body3.start + 2.0, "happy").look(b.body3.start + 2.05, -0.8, -0.5, 0.1)
 .sfx(b.body3.start + 2.05, "ting", { x0: 400 });
wt.to(W, { ...ON_CHART, duration: 0.8, ease: "power2.inOut" }, b.body3.start + 1.25)
  .to(W, { cpulse: 2, duration: 1.4, ease: "none" }, b.body3.start + 1.95);

// BODY4: Performance, Date, Compare, last 3 months; the earlier period draws in behind
const tChev = b.body4.start + 1.15, tCmp = b.body4.start + 2.05, tOpt = b.body4.start + 3.25;
F.mood(b.body4.start, "determined")
 .say(b.body4.start, M.body4 || [], "body4")
 .sfx(b.body4.start + 0.1, "tk", { x0: 250 })
 .reach(tChev, TAP.chev.x, TAP.chev.y, 0.28).sfx(tChev + 0.3, "tap", { x0: TAP.chev.x }).sfx(tChev + 0.38, "pluck", { x0: 400 })
 .reach(tCmp, TAP.cmp.x, TAP.cmp.y, 0.28).sfx(tCmp + 0.3, "tk", { x0: TAP.cmp.x })
 // round below the menu first, so her head never covers the option's words
 .move(tCmp + 0.5, 790, 790, 0.35, "power2.inOut")
 .reach(tOpt, TAP.opt.x, TAP.opt.y, 0.28).sfx(tOpt + 0.3, "tap", { x0: TAP.opt.x })
 .reverse(tOpt + 0.4, 800, 0.25)
 .sfx(b.body4.start + 3.95, "swish", { x0: 450 })
 .move(b.body4.start + 3.95, 780, 640, 0.5, "power2.inOut")
 .pivot(b.body4.start + 4.5, "front").look(b.body4.start + 4.55, -0.6, -0.8, 0.1)
 .sfx(b.body4.start + 4.15, "rustle", { n: 4, x0: 540 })
 .mood(b.body4.start + 5.1, "happy");
tapAt(tChev + 0.3, TAP.chev); tapAt(tCmp + 0.3, TAP.cmp); tapAt(tOpt + 0.3, TAP.opt);
// the camera holds the ON_CHART framing: the card, the menu below it and Floey all fit
wt.to(W, { tpulse: 1, duration: 0.8, ease: "none" }, b.body4.start)
  .to(W, { menu: 1, duration: 0.3, ease: "back.out(1.6)" }, tChev + 0.32)
  .to(W, { cmpTab: 1, duration: 0.25, ease: "power2.out" }, tCmp + 0.32)
  .set(W, { picked: 1 }, tOpt + 0.3)
  .to(W, { menu: 0, duration: 0.25, ease: "power2.in" }, b.body4.start + 3.9)
  .set(W, { compare: 1 }, b.body4.start + 4.1)
  .to(W, { cmpLine: 1, duration: 1.0, ease: "power1.inOut" }, b.body4.start + 4.15);

// BODY5: the Pages table; tap Clicks Difference twice so the biggest losses sit on top
const tPg = b.body5.start + 0.2, tH1 = b.body5.start + 1.1, tH2 = b.body5.start + 2.3;
F.pivot(b.body5.start - 0.45, "side")
 .move(b.body5.start - 0.45, PARK.x, PARK.y, 0.4, "power2.inOut")
 .sfx(b.body5.start - 0.35, "pluck", { x0: 540 })
 .say(b.body5.start, M.body5 || [], "body5")
 .reach(tPg, TAP.pages.x, TAP.pages.y, 0.3).sfx(tPg + 0.32, "tap", { x0: TAP.pages.x })
 .move(b.body5.start + 0.75, 585, 560, 0.3, "power2.inOut")
 .reach(tH1, TAP.hdr.x, TAP.hdr.y, 0.25).sfx(tH1 + 0.27, "tk", { x0: 800 }).sfx(tH1 + 0.32, "swish", { x0: 540 })
 .mood(b.body5.start + 1.8, "think").tiltTo(b.body5.start + 1.85, -16, 0.15).look(b.body5.start + 1.85, 0.6, 0.8, 0.08)
 .tiltTo(b.body5.start + 2.2, 0, 0.1)
 .reach(tH2, TAP.hdr.x, TAP.hdr.y, 0.22).sfx(tH2 + 0.24, "tk", { x0: 800 }).sfx(tH2 + 0.3, "swish", { x0: 540 }).sfx(tH2 + 0.68, "ting", { x0: 400 })
 .mood(b.body5.start + 2.75, "determined")
 .move(b.body5.start + 3.2, PARK.x, PARK.y, 0.45, "power2.inOut")
 .pivot(b.body5.start + 3.7, "front").look(b.body5.start + 3.75, -0.7, -0.6, 0.1);
tapAt(tPg + 0.32, TAP.pages); tapAt(tH1 + 0.27, TAP.hdr); tapAt(tH2 + 0.24, TAP.hdr);
// the table opens on its tabs alone (none chosen yet); tapping Pages fills it, unsorted
wt.to(W, { ...ON_TABLE, duration: 0.6, ease: "power2.inOut" }, b.body5.start - 0.45)
  .set(W, { tabActive: -1 }, b.body5.start - 0.45)
  .to(W, { ph: PH_TABS, duration: 0.3, ease: "power2.out" }, b.body5.start - 0.2)
  .to(W, { tabs: 1, duration: 0.3 }, b.body5.start - 0.1)
  .to(W, { example: 1, duration: 0.3 }, b.body5.start - 0.05)
  .set(W, { tabActive: 1 }, tPg + 0.32)
  .to(W, { ph: PH1, duration: 0.35, ease: "power2.out" }, tPg + 0.32)
  .to(W, { rows: 1, duration: 0.45, ease: "power1.out" }, tPg + 0.38)
  .to(W, { s1: 1, duration: 0.36, ease: "power2.inOut" }, tH1 + 0.3)
  .to(W, { s2: 1, duration: 0.36, ease: "power2.inOut" }, tH2 + 0.27)
  .to(W, { glow: 1, duration: 0.3, ease: "power2.out" }, tH2 + 0.66);

// PAYOFF6: the worst page; click it, open Queries, the searches that lost clicks
const tRow = b.payoff6.start + 1.2, tQ = b.payoff6.start + 2.0;
F.mood(b.payoff6.start, "happy")
 .say(b.payoff6.start, M.payoff6 || [], "payoff6")
 .flash(b.payoff6.start + 0.45)
 .pivot(b.payoff6.start + 1.05, "side")
 .reach(tRow, TAP.row0.x, TAP.row0.y, 0.3).sfx(tRow + 0.32, "tap", { x0: TAP.row0.x }).sfx(tRow + 0.4, "pluck", { x0: 700 })
 .reach(tQ, TAP.queries.x, TAP.queries.y, 0.28).sfx(tQ + 0.3, "tk", { x0: TAP.queries.x })
 .sfx(tQ + 0.5, "pluck", { x0: 600 }).sfx(tQ + 0.7, "pluck", { x0: 600 }).sfx(tQ + 0.9, "pluck", { x0: 600 })
 .move(b.payoff6.start + 2.75, PARK.x, PARK.y, 0.45, "power2.inOut")
 .look(b.payoff6.start + 3.25, -0.8, -0.5, 0.1).mood(b.payoff6.start + 3.25, "think")
 // the camera drifts down to the worst page; a little bug peeks out of it
 .move(b.payoff6.end, 470, 1080, 0.7, "power2.inOut")
 .face(b.payoff6.end + 0.5, 1).look(b.payoff6.end + 0.5, -0.4, 1, 0.05).mood(b.payoff6.end + 0.5, "surprised")
 .sfx(b.payoff6.end + 0.35, "brrt", { x0: 320 });
tapAt(tRow + 0.32, TAP.row0); tapAt(tQ + 0.3, TAP.queries);
wt.to(W, { filter: 1, duration: 0.3, ease: "back.out(1.8)" }, tRow + 0.34)
  .to(W, { narrow: 1, duration: 0.3 }, tRow + 0.34)
  .set(W, { tabActive: 0 }, tQ + 0.3)
  .to(W, { rows: 0, glow: 0, duration: 0.15 }, tQ + 0.3)
  .to(W, { q: 1, duration: 0.6, ease: "none" }, tQ + 0.4)
  .to(W, { camX: 540, camY: 1060, zoom: 1.1, duration: 1.1, ease: "power2.inOut" }, b.payoff6.end - 0.15)
  .to(W, { bug: 0.55, duration: 0.35, ease: "back.out(2)" }, b.payoff6.end + 0.25);

// LOOP7: "Save this": the report lands back on the finished table. "From up
// here": back up to the wide shot, where the total line still looks flat.
F.pivot(b.loop7.start, "front").mood(b.loop7.start, "happy").look(b.loop7.start, 0, 0, 0.1)
 .say(b.loop7.start, M.loop7 || [], "loop7")
 .wink(b.loop7.start + 0.25)
 .sfx(b.loop7.start + 0.2, "swish", { x0: 540 })
 .move(b.loop7.start + 0.95, HOME.x + 20, HOME.y - 10, 0.5, "power2.inOut")
 .look(b.loop7.start + 1.5, 0.3, -1, 0.12).sfx(b.loop7.start + 1.55, "tk", { x0: 540 })
 .look(b.loop7.start + 2.2, -0.2, 1, 0.08)
 .sfx(b.loop7.start + 1.9, "brrt", { x0: 320 });
wt.to(W, { camX: 540, camY: 960, zoom: 1, duration: 0.9, ease: "power2.inOut" }, b.loop7.start + 0.15)
  .to(W, { q: 0, filter: 0, duration: 0.2 }, b.loop7.start + 0.2)
  .set(W, { tabActive: 1 }, b.loop7.start + 0.3)
  .to(W, { rows: 1, glow: 1, duration: 0.35 }, b.loop7.start + 0.4)
  .to(W, { narrow: 0, duration: 0.35 }, b.loop7.start + 0.4)
  .to(W, { ping: 2, duration: 0.8, ease: "none" }, b.loop7.start + 0.6);

// GO8: the bug zips out of the leaves; she catches it mid-air and eats it.
// The flower shivers but stays faded: the fix comes next.
const T_ZIP = b.go8.start + 0.4, T_PICK = b.go8.start + 0.95;
const BUGAIR = { x: H3.x + 170, y: H3.y - 175 };
F.mood(b.go8.start - 0.1, "party")
 .say(b.go8.start, M.go8 || [], "go8")
 .pivot(b.go8.start + 0.35, "side").mood(b.go8.start + 0.35, "determined")
 .reach(T_PICK - 0.45, BUGAIR.x, BUGAIR.y, 0.28)
 .pick(T_PICK, `<g transform="rotate(90)">${PROPS.bug(0, 0.55, "")}</g>`, "bug")
 .eat(T_PICK + 0.35)
 .tongue(T_PICK + 1.15, 1)
 .sfx(T_ZIP, "zipoff", { d: 0.3, x0: H3.x, x1: BUGAIR.x })
 .sfx(T_PICK + 0.75, "rustle", { n: 2, x0: H3.x });
// low and close, so the report leaves the frame and the chase owns it
wt.to(W, { camX: 400, camY: 1430, zoom: 1.45, duration: 0.5, ease: "power2.out" }, b.go8.start + 0.3)
  .to(W, { shx: 7, shy: -5, duration: 0.04, yoyo: true, repeat: 5, ease: "sine.inOut" }, T_PICK + 0.12)
  .set(W, { shx: 0, shy: 0 }, T_PICK + 0.36)
  .to(W, { shiver: 1, duration: 0.7, ease: "none" }, T_PICK + 0.7);

// URL9: in the beat before the address, the camera is already back on the
// opening wide shot and Floey on her opening spot, so the address plays over
// the first frame exactly
const T_BACK = b.go8.end + 0.1;
F.move(T_BACK + 0.05, HOME.x, HOME.y, 0.6, "power2.inOut")
 .sfx(T_BACK, "swish", { x0: 540 })
 .pivot(b.url9.start - 0.1, "front").mood(b.url9.start - 0.1, "hello").look(b.url9.start - 0.1, 0, 0, 0.1)
 .say(b.url9.start, M.url9 || [], "url9")
 .flash(b.url9.end - 0.3).chips(b.url9.end + 0.25, 1);
wt.to(W, { camX: 540, camY: 960, zoom: 1, duration: 0.85, ease: "power2.inOut" }, T_BACK);
wt.set({}, {}, DUR);

// ---------- drawing ----------
const fadeCol = (fl, h) => GARDEN.fade(FL[fl].pal[0], h);
const linePts = (vals, k) => {
  const n = vals.length - 1, u = clamp(k) * n, px = (i) => CH.x0 + (i / n) * (CH.x1 - CH.x0), py = (v) => CH.y1 - v * (CH.y1 - CH.y0);
  const out = [];
  for (let i = 0; i <= Math.floor(u); i++) out.push([px(i), py(vals[i])]);
  const f = u - Math.floor(u);
  if (f > 0 && Math.floor(u) < n) { const i = Math.floor(u); out.push([px(i + f), py(vals[i] + (vals[i + 1] - vals[i]) * f)]); }
  return out;
};
const poly = (pts) => pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
// the fallen petal: the garden's falling petal, landed on the meadow by the third flower
const P0 = { x: H3.x + 40, y: H3.y + 30 }, GROUND = 1748;
const petal = (k) => k <= 0 ? "" : `<g transform="translate(0 ${(-(560 - (GROUND - P0.y)) * k).toFixed(1)})">${GARDEN.fallingPetal(FL.F3, LOW3, P0.x, P0.y, Math.min(k, 0.999))}</g>`;
// the bug: on the worst page, then out into the air where Floey catches it
const bugPos = (t) => {
  const p = PROPS.bugOn(FL.F3, t, W.h3);
  if (t < T_ZIP) return p;
  const k = gsap.parseEase("power2.out")(clamp((t - T_ZIP) / 0.3));
  return { x: p.x + (BUGAIR.x - p.x) * k + Math.sin(t * 19) * 5 * k, y: p.y + (BUGAIR.y - p.y) * k + Math.cos(t * 23) * 5 * k, a: p.a * (1 - k) - 30 * k };
};

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  F.pose(t);
  const cam = { camX: W.camX + W.shx, camY: W.camY + W.shy, zoom: W.zoom };
  // fonts first: a measure taken before the web font loads is cached for good
  const fontsOK = document.fonts.check(`700 28px '${FONT}'`);
  // The report shows or hides as one piece, never text by text: it fades out
  // whole (paper, lines and words together) as its title nears Instagram's
  // header or a side of the frame, so no blank card or word-less chip is ever left.
  const sx = (x) => 540 + (x - cam.camX) * cam.zoom, sy = (y) => 960 + (y - cam.camY) * cam.zoom;
  const panelVis = fontsOK ? Math.min(clamp((sy(PY + 40) - 152) / 40), clamp((sx(PX) - 10) / 40), clamp((1070 - sx(PX + PW)) / 40)) : 0;
  // the body1 wipe: right of Floey shows the before state, left of her still the after
  const inWipe = t >= T0 - 0.2 && t < T1, wx = F.pose(t).x + 70;
  const passed = (x) => inWipe ? smooth((x - wx) / 140 + 0.5) : 0;
  const wv = (key, x) => W[key] + (BEFORE[key] - W[key]) * passed(x);

  let s = GARDEN.defs() + GARDEN.background(t, cam);
  s += `<g transform="translate(540 960) scale(${cam.zoom}) translate(${-cam.camX} ${-cam.camY})">`;
  s += GARDEN.ground();
  // flowers: the fading ones last, so their drooping heads lie over their neighbours
  const h3 = wv("h3", 380), h5 = wv("h5", 880);
  s += GARDEN.flower(FL.F2, W.h2, t) + GARDEN.flower(FL.F4, W.h4, t) + GARDEN.flower(FL.F1, W.h1, t) + GARDEN.flower(FL.F6, W.h6, t);
  s += GARDEN.flower(FL.F5, h5, t);
  const shv = W.shiver > 0 && W.shiver < 1 ? Math.sin(W.shiver * 40) * 2.2 * (1 - W.shiver) : 0;
  s += `<g transform="rotate(${shv.toFixed(2)} ${FL.F3.x} ${FL.F3.base})">${GARDEN.flower(FL.F3, h3, t, { dropPetal: W.p1 > 0 ? W.p1 : 0 })}</g>`;
  s += petal(W.p1);

  // ---- the Performance panel ----
  const s0 = s.length;
  const ph = W.ph, tpulse = Math.sin(clamp(W.tpulse) * Math.PI);
  s += PROPS.panel(1, PX, PY, PW, ph, { title: "Performance", accent: C.indigo });
  if (tpulse > 0) s += `<rect x="${PX - 8}" y="${PY - 8}" width="${PW + 16}" height="92" rx="34" fill="none" stroke="${C.amber}" stroke-width="${8 * tpulse}" opacity="${tpulse * 0.9}"/>`;
  // the Date chip (and the Page filter once a page is clicked)
  const compare = inWipe ? (passed(IX0 + 200) > 0.5 ? 0 : 1) : W.compare;
  const dLabel = compare ? "Date: Compare" : "Date: Last 3 months";
  const dw = fontsOK ? chipW(dLabel) : 300, dcx = IX0 + dw / 2;
  const cp = W.cpulse > 0 && W.cpulse < 2 ? Math.sin((W.cpulse % 1) * Math.PI) : 0;
  if (cp > 0) s += `<rect x="${IX0 - 10}" y="${CHIP_Y - 38}" width="${dw + 20}" height="76" rx="38" fill="${C.amber}" opacity="${(0.35 * cp).toFixed(2)}"/>`;
  s += PROPS.dropdown(1, dcx, CHIP_Y, dLabel);
  if (W.filter > 0.01) {
    const fLabel = "Page: /seo-checklist", fw = fontsOK ? chipW(fLabel) : 400, fcx = IX0 + dw + 14 + fw / 2;
    s += `<g transform="translate(${fcx} ${CHIP_Y}) scale(${0.6 + 0.4 * W.filter}) translate(${-fcx} ${-CHIP_Y})">${PROPS.dropdown(W.filter, fcx, CHIP_Y, fLabel)}</g>`;
  }
  // the chart: one flat total line; after Compare, the earlier period (paler) sits above it
  s += `<text x="${IX0 + 16}" y="${CH.y0 - 14}" font-family="${FONT}" font-weight="700" font-size="24" fill="${INK}" opacity=".55">Clicks</text>`;
  s += `<path d="M${CH.x0},${CH.y1 + 6} H${CH.x1}" stroke="${INK}" stroke-width="3" opacity=".15"/>`;
  const cmpK = W.cmpLine * (inWipe ? clamp((wx - CH.x0) / (CH.x1 - CH.x0)) : 1);
  if (cmpK > 0.01) s += `<polyline points="${poly(linePts(PREV, cmpK))}" fill="none" stroke="${C.violet}" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round" opacity=".5"/>`;
  s += `<polyline points="${poly(linePts(TOT, 1))}" fill="none" stroke="${C.indigo}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;

  // the Date menu: Filter / Compare, then the period to compare
  if (W.menu > 0.01) {
    const o1 = "Compare last 28 days to previous period", o2 = "Compare last 3 months to previous period";
    const ow = Math.max(measure(o1, `700 24px '${FONT}'`), measure(o2, `700 24px '${FONT}'`)), mw = ow + 112, mh = 96 + 130 * W.cmpTab;
    let m = `<rect x="${MX}" y="${MY}" width="${mw}" height="${mh}" rx="22" fill="#fffaf2" stroke="${INK}" stroke-width="5"/>`;
    m += PROPS.tabs(1, MX + 24, MY + 12, 300, ["Filter", "Compare"], W.cmpTab > 0.5 ? 1 : 0, C.indigo);
    if (W.cmpTab > 0.3) [o1, o2].forEach((o, i) => {
      const y = MY + 112 + i * 60, on = i === 1 && W.picked;
      m += `<circle cx="${MX + 42}" cy="${y - 8}" r="13" fill="#fffaf2" stroke="${INK}" stroke-width="4"/>${on ? `<circle cx="${MX + 42}" cy="${y - 8}" r="6.5" fill="${C.indigo}"/>` : ""}`;
      m += `<text x="${MX + 70}" y="${y}" font-family="${FONT}" font-weight="700" font-size="24" fill="${INK}" opacity="${on || !W.picked ? 1 : 0.5}">${esc(o)}</text>`;
    });
    s += `<g opacity="${clamp(W.menu * 3).toFixed(2)}" transform="translate(0 ${MY}) scale(1 ${(0.5 + 0.5 * W.menu).toFixed(3)}) translate(0 ${-MY})">${m}</g>`;
  }

  // tabs, the column header and the rows; during the wipe they clear from the right
  let tbl = "";
  if (W.example > 0.01) {
    tbl += `<text x="${IX1}" y="${PY + 47}" text-anchor="end" font-family="${FONT}" font-weight="700" font-size="22" fill="#fff" opacity="${(0.9 * W.example).toFixed(2)}">example numbers</text>`;
  }
  if (W.tabs > 0.01) {
    const qMode = W.q > 0.5;
    tbl += PROPS.tabs(W.tabs, IX0, TABS_Y, 480, ["Queries", "Pages", "Countries"], W.tabActive, C.indigo);
    const hdr = "Clicks Difference", hw = measure(hdr, `700 24px '${FONT}'`);
    const sorted = qMode ? null : W.s2 > 0.5 ? "up" : W.s1 > 0.5 ? "down" : null, ax = IX1 - hw - 34;
    let h = `<text x="${IX0 + 16}" y="${HDR_Y}" font-family="${FONT}" font-weight="700" font-size="24" fill="${INK}" opacity=".55">${qMode ? "Top queries" : "Top pages"}</text>`;
    h += `<text x="${IX1}" y="${HDR_Y}" text-anchor="end" font-family="${FONT}" font-weight="700" font-size="24" fill="${INK}">${hdr}</text>`;
    if (sorted) h += `<path d="${sorted === "down" ? `M${ax - 8},${HDR_Y - 14} l8,9 l8,-9` : `M${ax - 8},${HDR_Y - 5} l8,-9 l8,9`}" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    // the column header only once a tab is chosen and there are rows under it
    const hk = clamp(Math.max(W.rows, W.q) * 3);
    if (hk > 0.01) tbl += `<g opacity="${(hk * clamp(W.tabs * 3)).toFixed(2)}">${h}</g>`;
  }
  const rowSvg = (r, y, k, col) => `<circle cx="${IX0 + 24}" cy="${y + RH / 2}" r="12" fill="${col}" stroke="${INK}" stroke-width="3" opacity="${k}"/>` + PROPS.table(k / 3, IX0 + 50, y, IX1 - IX0 - 50, [r]);
  // The rows reorder twice (sort descending, then ascending), each a full reversal of
  // the previous order. A plain linear cross of each row's own slot can bring two (or
  // all four) rows arbitrarily close together mid-transition, in either stage, not just
  // at one hand-timeable instant. Measure the real minimum gap between rows every frame
  // and fade them through it when it gets tight, instead of hand-timing each danger window.
  const posOf = (r) => r.o[0] + (r.o[1] - r.o[0]) * W.s1 + (r.o[2] - r.o[1]) * W.s2;
  const positions = PAGES.map(posOf);
  let minGap = Infinity;
  for (let a = 0; a < positions.length; a++) for (let b = a + 1; b < positions.length; b++) minGap = Math.min(minGap, Math.abs(positions[a] - positions[b]));
  const crossFade = minGap <= 0.6 ? 0.05 : minGap >= 0.9 ? 1 : 0.05 + 0.95 * (minGap - 0.6) / 0.3;
  if (W.rows > 0.01) PAGES.forEach((r, i) => {
    const pos = positions[i];
    const moving = Math.sin(W.s1 * Math.PI) + Math.sin(W.s2 * Math.PI), dx = (r.diff < 0 ? 1 : -1) * 14 * moving;
    const y = ROW_Y + pos * RH, keep = r.fl === "F3" ? 1 : 1 - W.narrow;
    const k = clamp(W.rows * 4 - i * 0.6) * keep * crossFade, col = fadeCol(r.fl, W["h" + r.fl[1]]);
    if (k <= 0.01) return;
    let row = "";
    if (r.fl === "F3" && W.glow > 0.01) {
      const pg = W.ping > 0 && W.ping < 2 ? Math.sin((W.ping % 1) * Math.PI) : 0;
      row += `<rect x="${IX0 - 6}" y="${y + 4}" width="${IX1 - IX0 + 12}" height="${RH - 8}" rx="18" fill="${col}" opacity="${(W.glow * k * (0.45 + 0.12 * Math.sin(t * 4))).toFixed(2)}"/>`;
      if (pg > 0) row += `<rect x="${IX0 - 6 - 10 * pg}" y="${y + 4 - 8 * pg}" width="${IX1 - IX0 + 12 + 20 * pg}" height="${RH - 8 + 16 * pg}" rx="24" fill="none" stroke="${C.amber}" stroke-width="6" opacity="${(0.9 * pg).toFixed(2)}"/>`;
    }
    row += rowSvg(r, y, k, col);
    tbl += `<g transform="translate(${dx.toFixed(1)} 0)">${row}</g>`;
  });
  if (W.q > 0.01) QUERIES.forEach((r, i) => {
    const y = ROW_Y + i * RH, k = clamp(W.q * 3 - 0.3 - i * 0.8);
    if (k > 0) tbl += `<g transform="translate(${((1 - k) * 40).toFixed(1)} 0)">${rowSvg(r, y, k, fadeCol("F3", W.h3))}</g>`;
  });
  s += inWipe ? `<clipPath id="wipe"><rect x="-400" y="0" width="${(wx + 400).toFixed(1)}" height="1920"/></clipPath><g clip-path="url(#wipe)">${tbl}</g>` : tbl;
  // tap rings where her beak lands
  for (const [tt, x, y] of TAPS) { const k = (t - tt) / 0.45; if (k > 0 && k < 1) s += PROPS.cursor(k, x, y); }
  if (panelVis < 0.999) s = s.slice(0, s0) + (panelVis > 0.01 ? `<g opacity="${panelVis.toFixed(2)}">${s.slice(s0)}</g>` : "");

  // the bug on the worst page, until Floey catches it
  const pk = F.events.find((e) => e.type === "picked");
  if (W.bug > 0.01 && (!pk || t < pk.t)) { const q = bugPos(t); s += `<g transform="translate(${q.x} ${q.y}) rotate(${q.a})">${PROPS.bug(t, W.bug, "")}</g>`; }
  s += F.trail(t) + F.svg(t);
  s += `</g>`;
  s += GARDEN.pollen(t, cam) + GARDEN.vignette();
  if (document.fonts.check("800 50px 'Public Sans'")) s += PROPS.captions(LINES, CAPB, t);
  document.getElementById("stage").innerHTML = s;
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), music: Object.values(B).map((x) => x.start) });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX + W.shx, camY: W.camY + W.shy, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.render(0);
</script></body></html>
