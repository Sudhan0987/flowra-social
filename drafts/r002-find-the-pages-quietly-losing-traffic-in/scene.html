<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Public+Sans:wght@800&display=swap" rel="stylesheet">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/world/garden.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="lines.js"></script>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f7f4ee}svg{display:block}</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// Reel 002: find the pages fading inside your flat clicks line.
// Story: from far away all six pages look fine under one flat Performance line.
// Up close, pages 3 and 5 drain to beige. Floey walks the Search Console check
// (Date, Compare, Pages, Clicks Difference twice, Queries), the taps collect as a
// list worth saving, she catches the page's bug in clear sky and page 3 starts
// to recover. The camera returns to the exact opening wide shot: the only change
// is that page 3 is glowing brighter.
const LINES = window.LINES, M = window.MOUTHS || {};
const C = HUM.colors;
const GAP = { hook0: 0.45, body1: 0.3, body2: 0.45, body3: 0.35, body4: 0.5, body5: 0.5, payoff6: 0.55, loop7: 0.3, go8: 0.75, url9: 0.7 };
const { B, DUR } = PROPS.timing(LINES, M, GAP);

// ---------- helpers ----------
const PAPER = "#fffaf2", BEIGE = "#d8c7a3", RED = "#d24b4b", GREEN = "#3f9a6b", HL = "#ffe2b0";
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (k) => k * k * (3 - 2 * k);
const sub = (k, a, b) => clamp((k - a) / (b - a));
const f1 = (v) => (+v).toFixed(1);
const rgbOf = (c) => {
  c = String(c).trim();
  let m = /^#?([0-9a-f]{6})$/i.exec(c);
  if (m) { const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  m = /^#([0-9a-f]{3})$/i.exec(c);
  if (m) return m[1].split("").map((h) => parseInt(h + h, 16));
  m = /^rgba?\(([^)]+)\)/i.exec(c);
  if (m) return m[1].split(",").slice(0, 3).map((v) => +v);
  return null;
};
const mix = (a, b, k) => { const p = rgbOf(a), q = rgbOf(b); if (!p || !q) return k < 0.5 ? a : b; return "rgb(" + p.map((v, i) => Math.round(v + (q[i] - v) * clamp(k))).join(",") + ")"; };
// text width, measured; never below a generous estimate so a box is never too small
const tw = (str, px) => {
  let w = 0;
  try { w = +PROPS.measure(str, `700 ${px}px 'Space Grotesk'`); } catch (e) { w = 0; }
  const est = str.length * px * 0.6;
  return w > 0 ? Math.max(w, est * 0.9) : est;
};

// ---------- the garden: six pages, tall and short in turn; pages 3 and 5 are the tall ones ----------
const SLOT = { f1: 110, f2: 282, f3: 455, f4: 628, f5: 800, f6: 970 };
const FL = {
  f1: { x: SLOT.f1, base: 1720, h: 520, pal: [C.magenta, C.amber, C.coral], dir: 1, seed: 5 },
  f2: { x: SLOT.f2, base: 1720, h: 450, pal: [C.violet, C.indigo, C.magenta], dir: -1, seed: 3 },
  f3: { x: SLOT.f3, base: 1720, h: 680, pal: [C.coral, C.amber, C.magenta], dir: -1, seed: 7 },
  f4: { x: SLOT.f4, base: 1720, h: 460, pal: [C.amber, C.coral, C.violet], dir: 1, seed: 11 },
  f5: { x: SLOT.f5, base: 1720, h: 700, pal: [C.indigo, C.violet, C.amber], dir: 1, seed: 13 },
  f6: { x: SLOT.f6, base: 1720, h: 480, pal: [C.magenta, C.violet, C.amber], dir: -1, seed: 17 },
};
const H_NEAR = 0.1;
// a drooping page leans sideways; centre that lean on its own slot, so the third
// and fifth pages still read as the third and fifth when they wilt
for (const k of ["f3", "f5"]) {
  const f = FL[k], a = PROPS.head(f, 1).x, b = PROPS.head(f, H_NEAR).x;
  f.x = Math.round(f.x + clamp(SLOT[k] - (a + b) / 2, -50, 50));
}
const W = {
  camX: 540, camY: 960, zoom: 1, shake: 0, near: 0, back5: 0, fix: 0, glow: 0, drop: 0, fall: 0,
  scan: 0, title: 0, chipPulse: 0, chipOn: 0, menu: 0, tabCmp: 0, optOn: 0, cmp: 0, cmpA: 1, chartOut: 0,
  table: 0, tabPages: 0, tabQ: 0, rows: 0, head: 0, sortA: 0, sortB: 0, num: 0,
  narrow: 0, press: 0, sel: 0, qOpen: 0, q: 0, qShrink: 0, recap: 0, recapOut: 0,
};
// all six start bright; on "two pages" 3 and 5 drain; 3 recovers after the bug,
// and 5 looks fine again once the camera is back up high (the reel's whole point)
const h3v = () => clamp(lerp(lerp(1, H_NEAR, W.near), 1, W.fix));
const h5v = () => clamp(lerp(lerp(1, H_NEAR, W.near), 1, W.back5));
const healthOf = (f) => (f === "f3" ? h3v() : f === "f5" ? h5v() : 1);

// texts fade before they reach Instagram's header (top 150 px on screen)
const tf = (wy) => clamp((960 + W.zoom * (wy - W.camY) - 160) / 50);
// and fade out before they reach either side of the frame
const sxf = (left, w) => {
  const sl = 540 + W.zoom * (left - W.camX), sr = 540 + W.zoom * (left + w - W.camX);
  return clamp((sl - 20) / 40) * clamp((1060 - sr) / 40);
};
const T = (x, y, str, px, fill, o = {}) => {
  const a = o.anchor || "start", w = tw(str, px), left = a === "middle" ? x - w / 2 : a === "end" ? x - w : x;
  const op = (o.op == null ? 1 : o.op) * tf(y - px) * sxf(left, w);
  if (op <= 0.01) return "";
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="${px}" fill="${fill}" text-anchor="${a}" opacity="${op.toFixed(3)}">${str}</text>`;
};
// after drawing: every interface box grows to hold its text, as rendered (only inside #ui)
function fitBoxes(root) {
  for (const tx of root.querySelectorAll("text")) {
    let bb; try { bb = tx.getBBox(); } catch (e) { continue; }
    if (!bb || !(bb.width > 0)) continue;
    const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
    let box = null;
    for (let el = tx.previousElementSibling; el; el = el.previousElementSibling) {
      if (el.tagName.toLowerCase() !== "rect" || el.hasAttribute("transform")) continue;
      const x = +(el.getAttribute("x") || 0), y = +(el.getAttribute("y") || 0), w = +el.getAttribute("width"), h = +el.getAttribute("height");
      if (!(w > 0 && h > 0) || !isFinite(x) || !isFinite(y)) continue;
      if (!box) {
        if (cx < x || cx > x + w || cy < y || cy > y + h) continue;
        const pad = Math.min(18, h * 0.35), L = Math.min(x, bb.x - pad), R = Math.max(x + w, bb.x + bb.width + pad);
        if (L >= x && R <= x + w) break;
        el.setAttribute("x", L.toFixed(1)); el.setAttribute("width", (R - L).toFixed(1));
        box = { x, w, h, dl: x - L, dr: R - (x + w) };
        continue;
      }
      if (Math.abs(w - box.w) < 1 && Math.abs(h - box.h) < 1) { el.setAttribute("x", (x - box.dl).toFixed(1)); el.setAttribute("width", (w + box.dl + box.dr).toFixed(1)); }
      break;
    }
  }
}
// the burned-in captions: if a caption line is wider (or taller) than its box as
// rendered, the box grows to hold it (screen space, transform aware); if it would
// then leave the frame, the line shrinks to fit instead
function fitCaptions(root) {
  const rects = [...root.querySelectorAll("rect")];
  for (const tx of root.querySelectorAll("text")) {
    const tb = tx.getBoundingClientRect();
    if (!(tb.width > 0 && tb.height > 0)) continue;
    const cx = tb.left + tb.width / 2, cy = tb.top + tb.height / 2;
    for (const r of rects) {
      const rb = r.getBoundingClientRect();
      if (!(rb.width > 0 && rb.height > 0)) continue;
      if (cx < rb.left || cx > rb.right || cy < rb.top || cy > rb.bottom) continue;
      // only a box meant for this text (not a small word highlight inside a line)
      if (rb.width < tb.width * 0.6) continue;
      const pad = Math.min(22, rb.height * 0.25);
      const gl = Math.max(0, rb.left - (tb.left - pad)), gr = Math.max(0, (tb.right + pad) - rb.right);
      const gt = Math.max(0, rb.top - (tb.top - 4)), gb = Math.max(0, (tb.bottom + 4) - rb.bottom);
      if (gl + gr + gt + gb < 0.5) continue;
      const w = +r.getAttribute("width"), h = +r.getAttribute("height");
      const fits = rb.left - gl >= 16 && rb.right + gr <= 1064;
      if (!r.hasAttribute("transform") && w > 0 && h > 0 && fits) {
        const sx = rb.width / w || 1, sy = rb.height / h || 1;
        const x = +(r.getAttribute("x") || 0), y = +(r.getAttribute("y") || 0);
        // its twin (a shadow of the same size) grows with it
        for (const s of rects) {
          if (s !== r && s.parentNode === r.parentNode && !s.hasAttribute("transform") &&
              Math.abs(+s.getAttribute("width") - w) < 1 && Math.abs(+s.getAttribute("height") - h) < 1 &&
              Math.abs(+(s.getAttribute("x") || 0) - x) < 20 && Math.abs(+(s.getAttribute("y") || 0) - y) < 20) {
            s.setAttribute("x", (+(s.getAttribute("x") || 0) - gl / sx).toFixed(1)); s.setAttribute("width", (w + (gl + gr) / sx).toFixed(1));
            s.setAttribute("y", (+(s.getAttribute("y") || 0) - gt / sy).toFixed(1)); s.setAttribute("height", (h + (gt + gb) / sy).toFixed(1));
          }
        }
        r.setAttribute("x", (x - gl / sx).toFixed(1)); r.setAttribute("width", (w + (gl + gr) / sx).toFixed(1));
        r.setAttribute("y", (y - gt / sy).toFixed(1)); r.setAttribute("height", (h + (gt + gb) / sy).toFixed(1));
      } else {
        const k = Math.min(1, (rb.width - 2 * pad) / tb.width, (rb.height - 8) / tb.height);
        if (k > 0 && k < 1) {
          const bb = tx.getBBox(), lx = bb.x + bb.width / 2, ly = bb.y + bb.height / 2;
          const pre = tx.getAttribute("transform") || "";
          tx.setAttribute("transform", `${pre} translate(${f1(lx)} ${f1(ly)}) scale(${(k * 0.98).toFixed(3)}) translate(${f1(-lx)} ${f1(-ly)})`.trim());
        }
      }
      break;
    }
  }
}

// ---------- prop 1: the Performance chart (upper middle), its Date chip and menu ----------
const CH = { x: 250, y: 260, w: 560, h: 320 };
const PX0 = CH.x + 36, PX1 = CH.x + CH.w - 36, PY0 = CH.y + 104, PY1 = CH.y + CH.h - 36;
// both periods sit level: the total really is flat (an example shape, no real data)
const NOW = [0.56, 0.6, 0.53, 0.58, 0.55, 0.61, 0.54, 0.58, 0.53, 0.6, 0.55, 0.57];
const PREV = [0.58, 0.54, 0.59, 0.55, 0.6, 0.54, 0.57, 0.53, 0.58, 0.55, 0.59, 0.56];
const pathOf = (vals) => vals.map((v, i) => [PX0 + (PX1 - PX0) * i / (vals.length - 1), PY1 - v * (PY1 - PY0)]);
const NOW_P = pathOf(NOW), PREV_P = pathOf(PREV);
function along(P, k) {
  const f = clamp(k) * (P.length - 1), i = Math.min(P.length - 2, Math.floor(f)), u = f - i;
  return [lerp(P[i][0], P[i + 1][0], u), lerp(P[i][1], P[i + 1][1], u)];
}
function partial(P, k) {
  const f = clamp(k) * (P.length - 1), n = Math.floor(f);
  let d = "M" + f1(P[0][0]) + " " + f1(P[0][1]);
  for (let i = 1; i <= n; i++) d += " L" + f1(P[i][0]) + " " + f1(P[i][1]);
  if (f > n) { const q = along(P, k); d += " L" + f1(q[0]) + " " + f1(q[1]); }
  return d;
}
const CHIP = (() => { const w = Math.round(tw("Date", 28) + 110); return { x: CH.x + CH.w - 24 - w, y: CH.y + 22, w, h: 52 }; })();
// the menu is drawn big (36 px) because it is read in a close shot on a phone;
// Search Console's own option label, wrapped on three lines
const MF = 36, MT = 30, MLINES = ["Compare last", "3 months to", "previous period"];
const MENU = (() => {
  const fw = tw("Filter", MT), cw = tw("Compare", MT);
  const lw = Math.max(...MLINES.map((l) => tw(l, MF)));
  const w = Math.round(Math.max(lw + 36 + 104, 30 + fw + 50 + cw + 70));
  return { x: CHIP.x + CHIP.w - w, y: CHIP.y + CHIP.h + 12, w, h: 92 + 174 + 18, fw, cw };
})();

function chartPanel(t) {
  const vis = 1 - W.chartOut; if (vis < 0.01) return "";
  const { x, y, w, h } = CH;
  let o = `<g opacity="${vis.toFixed(3)}" transform="translate(0 ${f1(-50 * smooth(W.chartOut))})">`;
  o += `<rect x="${x + 6}" y="${y + 10}" width="${w}" height="${h}" rx="26" fill="${C.ink}" opacity="0.08"/>`;
  o += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="${PAPER}" stroke="${C.ink}" stroke-width="6"/>`;
  o += T(x + 28, y + 58, "Performance", 30, C.ink);
  if (W.title > 0.01) o += `<rect x="${x + 28}" y="${y + 70}" width="${f1(tw("Performance", 30) * W.title)}" height="6" rx="3" fill="${C.amber}" opacity="${tf(y + 70).toFixed(3)}"/>`;
  for (let i = 0; i < 3; i++) {
    const gy = f1(PY0 + (PY1 - PY0) * i / 2);
    o += `<line x1="${PX0}" y1="${gy}" x2="${PX1}" y2="${gy}" stroke="${C.ink}" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>`;
  }
  // the previous period draws in behind, pale and dashed
  if (W.cmp > 0.001 && W.cmpA > 0.01) o += `<path d="${partial(PREV_P, W.cmp)}" fill="none" stroke="${C.violet}" stroke-opacity="${(0.5 * W.cmpA).toFixed(3)}" stroke-width="7" stroke-dasharray="14 12" stroke-linecap="round" stroke-linejoin="round"/>`;
  o += `<path d="${partial(NOW_P, 1)}" fill="none" stroke="${C.indigo}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
  // a bright dot runs along the total line: it never dips
  if (W.scan > 0.001 && W.scan < 0.999) {
    const p = along(NOW_P, W.scan), pp = along(NOW_P, Math.max(0, W.scan - 0.06));
    o += `<line x1="${f1(pp[0])}" y1="${f1(pp[1])}" x2="${f1(p[0])}" y2="${f1(p[1])}" stroke="${C.amber}" stroke-width="12" stroke-linecap="round" opacity="0.45"/>`;
    o += `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="22" fill="${C.amber}" opacity="0.25"/><circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="11" fill="${C.amber}" stroke="${C.ink}" stroke-width="4"/>`;
  }
  // the Date chip: pill, label and pulse live and fade together, so it is never an empty pill
  const c = CHIP, on = W.chipOn > 0.5, gc = on ? PAPER : C.ink;
  const cop = tf(c.y) * sxf(c.x, c.w);
  if (cop > 0.01) {
    const pulse = on ? 0 : W.chipPulse * (0.5 + 0.5 * Math.sin(t * 6.5));
    const ccx = c.x + c.w / 2, ccy = c.y + c.h / 2, sc = 1 + 0.09 * pulse;
    o += `<g opacity="${cop.toFixed(3)}" transform="translate(${f1(ccx)} ${f1(ccy)}) scale(${sc.toFixed(3)}) translate(${f1(-ccx)} ${f1(-ccy)})">`;
    if (!on && W.chipPulse > 0.01) {
      const g = 10 + 14 * pulse;
      o += `<rect x="${f1(c.x - g)}" y="${f1(c.y - g)}" width="${f1(c.w + 2 * g)}" height="${f1(c.h + 2 * g)}" rx="${f1(c.h / 2 + g)}" fill="${C.amber}" opacity="${(0.18 * W.chipPulse).toFixed(3)}"/>`;
      o += `<rect x="${f1(c.x - g)}" y="${f1(c.y - g)}" width="${f1(c.w + 2 * g)}" height="${f1(c.h + 2 * g)}" rx="${f1(c.h / 2 + g)}" fill="none" stroke="${C.amber}" stroke-width="6" opacity="${(W.chipPulse * (1 - 0.6 * pulse)).toFixed(3)}"/>`;
    }
    o += `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="${c.h / 2}" fill="${on ? C.indigo : PAPER}" stroke="${on ? C.indigo : C.ink}" stroke-width="5"/>`;
    const gx = c.x + 20, gy = c.y + 16;
    o += `<g><rect x="${gx}" y="${gy}" width="22" height="20" rx="4" fill="none" stroke="${gc}" stroke-width="3.5"/><line x1="${gx}" y1="${gy + 7}" x2="${gx + 22}" y2="${gy + 7}" stroke="${gc}" stroke-width="3.5"/>`;
    o += `<path d="M -8 -3 L 0 5 L 8 -3" transform="translate(${c.x + c.w - 30} ${c.y + c.h / 2})" fill="none" stroke="${gc}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    o += T(c.x + 52, c.y + 36, "Date", 28, gc);
    o += `</g>`;
  }
  // the Date menu drops from the chip: Filter | Compare, then the comparison option
  if (W.menu > 0.01) {
    const m = MENU, k = W.menu, ax = m.x + m.w, act = W.tabCmp > 0.5;
    const fx = m.x + 30, ce = m.x + m.w - 70;
    o += `<g opacity="${clamp(k * 2).toFixed(3)}" transform="translate(${ax} ${m.y}) scale(${(0.85 + 0.15 * k).toFixed(3)} ${k.toFixed(3)}) translate(${-ax} ${-m.y})">`;
    o += `<rect x="${m.x + 5}" y="${m.y + 8}" width="${m.w}" height="${m.h}" rx="24" fill="${C.ink}" opacity="0.1"/>`;
    o += `<rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="24" fill="${PAPER}" stroke="${C.ink}" stroke-width="6"/>`;
    o += T(fx, m.y + 48, "Filter", MT, C.ink, { op: act ? 0.5 : 1 });
    o += T(ce, m.y + 48, "Compare", MT, C.ink, { op: act ? 1 : 0.5, anchor: "end" });
    o += `<rect x="${f1(act ? ce - m.cw : fx)}" y="${m.y + 58}" width="${f1(act ? m.cw : m.fw)}" height="6" rx="3" fill="${C.indigo}"/>`;
    o += `<line x1="${m.x + 14}" y1="${m.y + 76}" x2="${m.x + m.w - 14}" y2="${m.y + 76}" stroke="${C.ink}" stroke-opacity="0.15" stroke-width="3"/>`;
    if (W.tabCmp < 0.99) {
      const a = (1 - W.tabCmp).toFixed(3);
      o += `<g opacity="${a}"><rect x="${m.x + 30}" y="${m.y + 116}" width="${f1(m.w * 0.62)}" height="18" rx="9" fill="${C.ink}" opacity="0.18"/><rect x="${m.x + 30}" y="${m.y + 170}" width="${f1(m.w * 0.45)}" height="18" rx="9" fill="${C.ink}" opacity="0.18"/></g>`;
    }
    if (W.tabCmp > 0.01) {
      const a = W.tabCmp, by = m.y + 92, rx = m.x + m.w - 50, ry = by + 87;
      o += `<rect x="${m.x + 16}" y="${by}" width="${m.w - 32}" height="174" rx="20" fill="${mix(PAPER, HL, W.optOn)}" stroke="${C.ink}" stroke-width="4" opacity="${a.toFixed(3)}"/>`;
      MLINES.forEach((l, i) => { o += T(m.x + 36, by + 54 + i * 46, l, MF, C.ink, { op: a * (i ? 0.85 : 1) }); });
      o += `<circle cx="${rx}" cy="${ry}" r="15" fill="${PAPER}" stroke="${C.ink}" stroke-width="4" opacity="${a.toFixed(3)}"/>`;
      if (W.optOn > 0.01) o += `<circle cx="${rx}" cy="${ry}" r="${f1(8 * W.optOn)}" fill="${C.indigo}"/>`;
    }
    o += `</g>`;
  }
  return o + `</g>`;
}

// ---------- prop 2: the Pages table (rows are the flowers, by colour) ----------
// it pops up where the chart was; the box is measured to its contents and
// shrinks to the one chosen row, then grows again for that page's searches
const TF = 26;
const TB = (() => {
  const x = 180, y = 290;
  const content = 256 + tw("-120", 38) + 14 + tw("example", 26);   // from a row's left edge
  const rw = Math.max(content + 64, 480);
  const qw = tw("Queries", TF) + 76, pw = tw("Pages", TF) + 76;
  const w = Math.round(Math.max(rw + 32, 18 + qw + 60 + pw + 18, tw("Clicks Difference", TF) + 64 + 120));
  return { x, y, w, rw: w - 32 };
})();
// Queries left, Pages right (as in Search Console); each tab has room past its
// label, so Floey's beak taps the pill and never sits on the word
const TABS = {
  q: { x: TB.x + 18, y: TB.y + 16, w: tw("Queries", TF) + 76, h: 52 },
  p: { x: TB.x + TB.w - 18 - (tw("Pages", TF) + 76), y: TB.y + 16, w: tw("Pages", TF) + 76, h: 52 },
};
const HDR = { y: TB.y + 94, h: 52 };
const rowY = (p) => TB.y + 162 - 70 * W.narrow + p * 70;
const tableH = () => 162 - 70 * W.narrow + 70 * (lerp(4, 1, W.narrow) + 3 * W.qOpen) + 8;
// example values only; the one number shown is labelled as an example
const ROWS = [{ f: "f2", v: 18, u: 130 }, { f: "f3", v: -120, u: 110 }, { f: "f4", v: 25, u: 150 }, { f: "f5", v: -64, u: 100 }];
const O0 = { f2: 0, f3: 1, f4: 2, f5: 3 };   // as the Pages tab opens
const O1 = { f4: 0, f2: 1, f5: 2, f3: 3 };   // first tap: gains on top (the wrong way)
const O2 = { f3: 0, f5: 1, f2: 2, f4: 3 };   // second tap: biggest losses on top

function tabPill(r, lab, on) {
  let g = on
    ? `<rect x="${f1(r.x)}" y="${r.y}" width="${f1(r.w)}" height="${r.h}" rx="${r.h / 2}" fill="${C.indigo}"/>`

  .to(W, { table: 1, duration: 0.4, ease: "back.out(1.7)" }, s5 - 0.25)
  .to(W, { tabPages: 1, duration: 0.1 }, s5 + 0.43)
  .to(W, { rows: 1, duration: 0.6, ease: "power2.out" }, s5 + 0.48)
  .to(W, { head: 1, duration: 0.15 }, s5 + 1.21)
  .to(W, { sortA: 1, duration: 0.45, ease: "power2.inOut" }, s5 + 1.25)
  .to(W, { sortB: 1, duration: 0.5, ease: "power2.inOut" }, s5 + 2.5)
  .to(W, { num: 1, duration: 0.35, ease: "back.out(2)" }, s5 + 3.05);

// PAYOFF6: a proud flash at the worst row; tap it and the box shrinks to that one row;
// tap Queries and it grows for three searches losing clicks; the camera eases to page 3
// and the bug peeks out, her head snaps to it
F.pivot(s6 - 0.15, "front").mood(s6 - 0.15, "happy")
 .say(s6, M.payoff6 || [], "payoff6")
 .look(s6 + 0.2, -0.85, 0.35)
 .sfx(s6 + 0.3, "shimmer")
 .flash(s6 + 0.5)
 .pivot(s6 + 0.95, "side").face(s6 + 0.95, 1).mood(s6 + 0.95, "determined")
 .reach(s6 + 1.05, row0Tap.x, row0Tap.y, 0.28)
 .sfx(s6 + 1.33, "tap")
 .sfx(s6 + 1.42, "swish")
 .move(s6 + 1.45, P5.x, P5.y - 20, 0.28)
 .reach(s6 + 1.85, qTap.x, qTap.y, 0.3)
 .sfx(s6 + 2.15, "tk")
 .move(s6 + 2.3, P6.x, P6.y, 0.5, "power2.inOut")
 .sfx(s6 + 2.32, "swish")
 .sfx(s6 + 2.6, "pluck").sfx(s6 + 2.85, "pluck").sfx(s6 + 3.1, "pluck")
 .sfx(s6 + 3.55, "brrt")
 .pivot(s6 + 3.65, "front").mood(s6 + 3.65, "surprised").look(s6 + 3.65, -0.9, 0.9)
 .sfx(s6 + 3.67, "tk");
wt.to(W, { press: 1, sel: 1, duration: 0.08 }, s6 + 1.33)
  .to(W, { press: 0, duration: 0.3 }, s6 + 1.41)
  .to(W, { narrow: 1, duration: 0.45, ease: "power2.inOut" }, s6 + 1.42)
  .to(W, { tabQ: 1, duration: 0.1 }, s6 + 2.15)
  .to(W, { qOpen: 1, duration: 0.35, ease: "power2.out" }, s6 + 2.18)
  .to(W, { q: 1, duration: 0.55, ease: "none" }, s6 + 2.25)
  .to(W, { qShrink: 1, duration: 0.8, ease: "none" }, s6 + 2.6)
  .to(W, { ...CAM6b, duration: 1.0, ease: "sine.inOut" }, s6 + 2.9);

// LOOP7: the table folds into a numbered list of every tap, the chart comes back;
// Floey above the beige page 3 winks on "Save this", then tips her beak up at the flat line
F.pivot(s7 - 0.5, "side").face(s7 - 0.5, 1)
 .sfx(s7 - 0.5, "swish")
 .move(s7 - 0.48, P7.x, P7.y, 0.5, "power2.inOut");
for (let i = 0; i < RECAP.length; i++) F.sfx(s7 - 0.3 + i * 0.05, "tk");
F.say(s7, M.loop7 || [], "loop7")
 .pivot(s7 + 0.04, "front").mood(s7 + 0.04, "happy").look(s7 + 0.04, 0, 0)
 .wink(s7 + 0.14)
 .sfx(s7 + 0.16, "ting")
 .look(s7 + 0.55, 0.05, -1)
 .sfx(s7 + 0.6, "shimmer")
 .sfx(s7 + 1.6, "brrt")
 .look(s7 + L7 - 0.2, 0, 0.5);
wt.to(W, { table: 0, duration: 0.25, ease: "power2.in" }, s7 - 0.55)
  .to(W, { ...CAM7, duration: 0.6, ease: "power2.inOut" }, s7 - 0.55)
  .to(W, { chartOut: 0, duration: 0.35, ease: "power2.out" }, s7 - 0.3)
  .to(W, { recap: 1, duration: 0.5, ease: "none" }, s7 - 0.3)
  .set(W, { scan: 0 }, s7 + 0.6)
  .to(W, { scan: 1, duration: 1.1, ease: "none" }, s7 + 0.62);

// GO8: the bug zips up out of page 3 into clear sky; she snaps it, gulps, tongue flick;
// page 3 starts to recover (the chart is fully out of this low shot)
F.mood(s8 - 0.1, "party")
 .say(s8, M.go8 || [], "go8")
 .pivot(s8 + 0.15, "side").mood(s8 + 0.15, "determined")
 .sfx(s8 + 0.15, "brrt")
 .reach(s8 + 0.4, CATCH.x, CATCH.y, 0.3)
 .pick(PICK_T, BUG_ITEM, "bug")
 .eat(s8 + 0.95)
 .tongue(s8 + 1.15, 2)
 .sfx(FIX_T, "bloom")
 .mood(FIX_T, "party")
 .sfx(FIX_T + 0.1, "shimmer")
 .pivot(s8 + 1.35, "front")
 .chips(s8 + 1.55, 2);
wt.to(W, { recapOut: 1, duration: 0.3 }, s8 - 0.05)
  .to(W, { ...CAM8, duration: 0.5, ease: "power2.inOut" }, s8)
  .to(W, { shake: 1, duration: 0.05 }, s8 + 0.95)
  .to(W, { shake: 0, duration: 0.35 }, s8 + 1.0)
  .to(W, { fix: 1, duration: Math.max(1.2, DUR - 0.3 - FIX_T), ease: "power2.out" }, FIX_T)
  .to(W, { drop: 0, duration: 0.4 }, FIX_T);

// URL9: after a beat, back to the exact opening camera; Floey home above page 3 at
// her opening size and pose. The one change: page 3 glows, brightening
const BACK = s9 - 0.55;
F.pivot(BACK, "side").face(BACK, HOME.x > CATCH.x ? -1 : 1)
 .sfx(BACK, "swish")
 .move(BACK + 0.02, HOME.x, HOME.y, 0.7, "power2.inOut")
 .say(s9, M.url9 || [], "url9")
 .pivot(s9 + 0.15, "front").mood(s9 + 0.15, "happy").look(s9 + 0.15, 0, 0)
 .flash(s9 + 0.4)
 .chips(s9 + L9 + 0.1, 1)
 .mood(s9 + L9 + 0.4, "determined");
wt.to(W, { ...CAM0, duration: 1.2, ease: "power3.inOut" }, BACK)
  .to(W, { back5: 1, duration: 0.9, ease: "sine.inOut" }, BACK + 0.1)
  .to(W, { cmpA: 0, chipOn: 0, duration: 0.6 }, BACK + 0.2)
  .to(W, { glow: 1, duration: 0.6, ease: "sine.out" }, s9);
wt.set({}, {}, DUR);

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  F.pose(t);
  const cam = { camX: W.camX, camY: W.camY, zoom: W.zoom };
  const h5 = h5v(), h3 = h3v();
  const ox = W.shake * 7 * Math.sin(t * 71), oy = W.shake * 5 * Math.cos(t * 57);
  let s = GARDEN.defs() + GARDEN.background(t, cam);
  s += `<defs><radialGradient id="r2glow"><stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/><stop offset="0.55" stop-color="#ffd98a" stop-opacity="0.35"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient></defs>`;
  s += `<g transform="translate(${f1(540 + ox)} ${f1(960 + oy)}) scale(${W.zoom}) translate(${-W.camX} ${-W.camY})">`;
  s += GARDEN.ground();
  s += GARDEN.flower(FL.f1, 1, t) + GARDEN.flower(FL.f2, 1, t) + GARDEN.flower(FL.f4, 1, t) + GARDEN.flower(FL.f6, 1, t);
  s += GARDEN.flower(FL.f5, h5, t, W.near > 0.5 && W.back5 < 0.5 ? { arrow: "down" } : {});
  // page 3's recovery glow (the ending's one difference from the opening)
  if (W.glow > 0.01) { const hg = PROPS.head(FL.f3, h3); s += `<circle cx="${f1(hg.x)}" cy="${f1(hg.y)}" r="${f1(190 + 10 * Math.sin(t * 3))}" fill="url(#r2glow)" opacity="${(0.6 * W.glow).toFixed(3)}"/>`; }
  const o3 = { dropPetal: W.drop };
  if (W.fix > 0.25) o3.arrow = "up"; else if (W.near > 0.5) o3.arrow = "down";
  s += GARDEN.flower(FL.f3, h3, t, o3);
  // the dropped petal settles into the grass and is gone
  if (W.fall > 0.001 && W.fall < 0.999) s += `<g opacity="${(1 - sub(W.fall, 0.8, 1)).toFixed(3)}">${GARDEN.fallingPetal(FL.f3, h3, PET0.x, PET0.y, W.fall)}</g>`;
  s += `<g id="ui">` + chartPanel(t) + tablePanel(t) + recapPanel() + `</g>`;
  s += bugSvg(t);
  { const hb = PROPS.head(FL.f3, 1); s += PROPS.sparks(t, hb.x, hb.y, FIX_T + 0.05, 12, 30); }
  // Floey is always the top layer of the world: nothing is ever drawn across her
  s += F.trail(t) + F.svg(t);
  s += `</g>`;
  s += GARDEN.pollen(t, cam) + GARDEN.vignette();
  s += `<g id="caps">` + PROPS.captions(LINES, B, t) + `</g>`;
  const stage = document.getElementById("stage");
  stage.innerHTML = s;
  const ui = stage.querySelector("#ui");
  if (ui) fitBoxes(ui);
  const caps = stage.querySelector("#caps");
  if (caps) fitCaptions(caps);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), music: Object.values(B).map((x) => x.start) });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.render(0);
</script></body></html>
