<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#efe6f3}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r025 "Did my rewrite work?" (duo style, night set).
// Maya panics that her rewritten post is down 5% and wants to undo it. Floey: "compared to what?"
// The check: the whole site over the same dates is down 20%, so her page beat the site by 15 points.
// Button: Floey turns to the viewer over the save card; then, silent, Maya's celebratory sip of
// cold coffee, a wince, and a deadpan look to camera. End card.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story
const GAP = { hook0: 0.3, reframe1: 0.25, doubt2: 0.35, tip3: 0.35, check4: 0.3, check5: 0.2, payoff6: 0.3, payoff7: 0.4, button8: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
// the silent button after the last line (sip, wince, look to camera) needs about 3 s before the end card
const END = Math.max(SPOKEN + 0.6, b.button8.end + 3.0), DUR = END + 1.6;

// where Floey hovers once she leaves the laptop: by Maya's head, on her left
const HOV = { x: 360, y: 770 };
// shots nudged for this reel
const TIGHT = { camX: 640, camY: 830, zoom: 2.1 };   // mayaTight, a touch lower: Floey on the laptop stays clear of the captions
const FLO = { camX: 500, camY: 1000, zoom: 1.3 };    // floey two-shot: Floey on the lid and Maya, the mug in frame
const FLOH = { camX: 480, camY: 860, zoom: 1.5 };    // floey two-shot with Floey hovering by Maya's head
const TWO = { camX: 520, camY: 830, zoom: 1.7 };     // close two-shot favouring Maya, Floey hovering at her left
const SAVE = { camX: 470, camY: 1150, zoom: 1.1 };   // Floey sits above the save card, talking to the viewer
const SIPC = { camX: 545, camY: 860, zoom: 1.7 };    // the silent button: Maya and her mug, Floey front-on beside her
const LOOK = { camX: 565, camY: 845, zoom: 1.8 };    // the push on her look to camera

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "worried", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: "type", floey: F });
const FREEZE = { L: [252, 684], R: [348, 684] };                 // hands on the keys, stopped dead
const SIPPING = { L: [262, 640], R: [336, 400], hold: "mug" };    // the mug up at her lips
const YES = { L: [168, 430], R: [372, 705] };                     // a small "yes!" fist at shoulder height, on Floey's side
const W = { ...TIGHT, shake: 1, down: 1, ins: 0, n: 1, rows: 0, hi: 0, save: 0, saveRows: 0, saveHi: 0, fTop: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);

// HOOK0: frame one is the panic, tight on Maya, the red -5% already up, hammering refresh
MY.look(0, -0.5, 0.6);
F.sfx(0.05, "typing", { d: 1.7 });
wt.to(W, { shake: 0, duration: 0.6, ease: "power2.out" }, 0);
MY.say(b.hook0.start, M.hook0 || [], "hook0");
// "I'm putting the old one back": worried and decided, one nod and a hard final keystroke
const back = b.hook0.start + 1.95;
MY.expr(back, "worried").look(back, -0.2, 0.3).nod(back + 0.25, 1).pose(back + 0.55, FREEZE, 0.15);
F.sfx(back + 0.55, "click");
shot(0.6, { camX: 650, camY: 840, zoom: 2.2 }, b.hook0.len - 0.4, "sine.inOut"); // slow push-in
wt.to(W, { down: 0, duration: 0.3 }, b.hook0.end - 0.5); // the pill goes before the cut

// REFRAME1: cut to the floey two-shot; Floey tilts, unbothered; Maya frozen mid-type, panic held
shot(b.reframe1.start - 0.35, FLO, 0.55);
F.mood(b.reframe1.start - 0.3, "think").tiltTo(b.reframe1.start - 0.2, 14, 0.25).chips(b.reframe1.start - 0.15, 1)
  .say(b.reframe1.start, M.reframe1 || [], "reframe1").tiltTo(b.reframe1.end, 0, 0.2);
MY.expr(b.reframe1.start - 0.1, "panic").look(b.reframe1.start + 0.25, -0.9, 0.4);

// DOUBT2: wide; "To before!" annoyed shrug, "three weeks" points at Floey, "coffee's gone cold" a pout at the mug
shot(b.doubt2.start - 0.25, SH.wide, 0.6);
MY.expr(b.doubt2.start - 0.05, "annoyed").pose(b.doubt2.start - 0.05, "shrug", 0.25).look(b.doubt2.start, -0.8, 0.1)
  .leanTo(b.doubt2.start, 2, 0.3).say(b.doubt2.start, M.doubt2 || [], "doubt2");
F.sfx(b.doubt2.start, "swish");
MY.pose(b.doubt2.start + 0.95, "pointL", 0.3);
F.sfx(b.doubt2.start + 0.95, "tick");
const cold = b.doubt2.start + 1.8;
MY.expr(cold, "sad").pose(cold, "rest", 0.35).look(cold, 1, 0.9).leanTo(cold, 0, 0.3);
shot(cold, { camX: 600, camY: 1000, zoom: 1.25 }, 1.2, "sine.inOut"); // a slow push towards Maya and the mug
// Floey, not impressed: a slow head tilt away and back
F.mood(b.doubt2.start + 0.2, "hello").tiltTo(b.doubt2.start + 1.0, -12, 0.5).tiltTo(b.doubt2.end - 0.2, 0, 0.3);

// TIP3: back to the two-shot; Floey lifts off the lid and hovers by Maya's head; Maya leans in and types
shot(b.tip3.start - 0.3, FLO, 0.6);
F.takeoff(b.tip3.start - 0.25).move(b.tip3.start + 0.05, HOV.x, HOV.y, 0.6).mood(b.tip3.start, "happy").say(b.tip3.start, M.tip3 || [], "tip3");
MY.expr(b.tip3.start, "annoyed").look(b.tip3.start + 0.1, -0.9, -0.1);
const lean = b.tip3.start + b.tip3.len * 0.45;
MY.expr(lean, "deadpan").leanTo(lean, -4, 0.4).pose(lean + 0.1, "type", 0.3).look(lean + 0.1, -0.5, 0.7);
F.sfx(lean + 0.2, "typing", { d: 0.7 });
shot(lean, FLOH, 0.9, "sine.inOut");
F.chips(b.tip3.end + 0.08, 1); // her chirp lands in the pause, never over her own words

// CHECK4: close two-shot; "Fine." deadpan, typing; the insert swings in; "twenty" brings in the site row
shot(b.check4.start - 0.2, TWO, 0.5);
MY.expr(b.check4.start - 0.05, "deadpan").say(b.check4.start, M.check4 || [], "check4");
F.look(b.check4.start, 0.4, 0.5);
MY.expr(b.check4.start + 0.5, "worried");
wt.to(W, { ins: 1, duration: 0.35, ease: "power3.out" }, b.check4.start + 0.95)
  .to(W, { rows: 1, duration: 0.3, ease: "power2.out" }, b.check4.start + 1.55);
F.sfx(b.check4.start + 0.95, "whoosh").sfx(b.check4.start + 1.55, "tick");
// "...percent?": out of the insert onto her surprised face
wt.to(W, { ins: 0, duration: 0.25, ease: "power2.in" }, b.check4.end - 0.3);
MY.expr(b.check4.end - 0.25, "surprised").pose(b.check4.end - 0.25, FREEZE, 0.15).look(b.check4.end - 0.25, 0, 0.3).jolt(b.check4.end - 0.2);
F.look(b.check4.end - 0.25, 0, 0);

// CHECK5: favour Floey; she tilts and winks; Maya stays frozen, surprised, eyes on Floey
shot(b.check5.start - 0.25, FLOH, 0.4, "power3.out");
F.mood(b.check5.start - 0.1, "happy").tiltTo(b.check5.start - 0.1, 16, 0.2).say(b.check5.start, M.check5 || [], "check5")
  .wink(b.check5.start + 0.35).tiltTo(b.check5.end + 0.05, 0, 0.2);
MY.look(b.check5.start + 0.1, -0.9, 0);

// PAYOFF6: back on the screen; "Five" brings in the page row, "Wait" rings it with a ding, then her face
wt.set(W, { n: 2, rows: 0.5 }, b.check5.start); // the card grows a row while it is off screen
wt.to(W, { ins: 1, duration: 0.3, ease: "power3.out" }, b.payoff6.start - 0.2)
  .to(W, { rows: 1, duration: 0.3, ease: "power2.out" }, b.payoff6.start + 0.02)
  .to(W, { hi: 1, duration: 0.25, ease: "back.out(1.6)" }, b.payoff6.start + 0.4);
F.sfx(b.payoff6.start - 0.2, "whoosh").sfx(b.payoff6.start + 0.42, "ding");
wt.set(W, { ...TWO }, b.payoff6.start);
MY.expr(b.payoff6.start, "surprised").look(b.payoff6.start, -0.4, 0.6).say(b.payoff6.start, M.payoff6 || [], "payoff6");
const beat = b.payoff6.start + 1.0;
wt.to(W, { ins: 0, duration: 0.25, ease: "power2.in" }, beat);
F.sfx(beat, "swish");
MY.expr(beat, "happy").sit(beat).look(beat, -0.9, 0).pose(beat + 0.35, YES, 0.25);
F.sfx(beat + 0.45, "tick");
F.mood(beat, "happy");
shot(beat, { camX: 540, camY: 820, zoom: 1.75 }, 0.8, "power2.out");

// PAYOFF7: the card again with the +15 pts row on "fifteen", the ring still on the page row
wt.set(W, { n: 3, rows: 2 / 3 }, beat + 0.3);
wt.to(W, { ins: 1, duration: 0.3, ease: "power3.out" }, b.payoff7.start - 0.2)
  .to(W, { rows: 1, duration: 0.3, ease: "back.out(1.6)" }, b.payoff7.start + 0.25);
F.sfx(b.payoff7.start - 0.2, "whoosh").sfx(b.payoff7.start + 0.25, "pop");
F.say(b.payoff7.start, M.payoff7 || [], "payoff7");
MY.pose(b.payoff7.start, "rest", 0.4).expr(b.payoff7.start, "proud");
wt.set(W, { ...FLOH }, b.payoff7.start);
wt.to(W, { ins: 0, duration: 0.25, ease: "power2.in" }, b.payoff7.end + 0.05);

// BUTTON8: Floey turns to the viewer and sits over the save card; Maya, pleased, watches her
F.pivot(b.button8.start - 0.15, "front").mood(b.button8.start - 0.15, "happy").say(b.button8.start, M.button8 || [], "button8");
MY.expr(b.button8.start - 0.1, "happy").look(b.button8.start - 0.1, -0.9, -0.1);
shot(b.button8.start - 0.05, SAVE, 0.55);
wt.to(W, { save: 1, fTop: 1, duration: 0.35, ease: "power3.out" }, b.button8.start + 0.25)
  .to(W, { saveRows: 1, duration: 0.5, ease: "power1.out" }, b.button8.start + 0.3)
  .to(W, { saveHi: 1, duration: 0.3, ease: "back.out(1.6)" }, b.button8.start + 1.05);
F.sfx(b.button8.start + 0.25, "whoosh").sfx(b.button8.start + 1.05, "ding");
const out = b.button8.end + 0.3;
wt.to(W, { save: 0, duration: 0.25, ease: "power2.in" }, out).set(W, { fTop: 0 }, out + 0.25);
F.sfx(out, "swish");

// the silent button: a celebratory sip... cold. A wince, then the deadpan look to camera
shot(out + 0.05, SIPC, 0.45, "power3.out");
const sip = out + 0.15;
MY.expr(sip, "proud").pose(sip, "mug", 0.25).pose(sip + 0.3, SIPPING, 0.3).look(sip, 0.2, 0.3);
F.sfx(sip + 0.65, "sip");
const wince = sip + 1.0;
MY.expr(wince, "annoyed").pose(wince + 0.05, "mug", 0.3).slump(wince + 0.05, 0.4);
F.sfx(wince + 0.05, "boing");
const look = wince + 0.6;
MY.expr(look, "deadpan").look(look, 0, 0, 0.35);
shot(look, LOOK, 0.8, "power2.out");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// the camera, with a small panic shake on the opening that settles by 0.6 s
const camAt = () => ({ camX: W.camX + Math.sin(W._t * 47) * 7 * W.shake, camY: W.camY + Math.cos(W._t * 41) * 5 * W.shake, zoom: W.zoom });
// one mug: on the desk until it is in her hand (the "mug" pose switches the hold halfway through its blend)
const mugHeld = (t) => t > sip + 0.125;
// her coffee went cold long ago: no steam on the mug in her hand
const coldMug = (s) => s.replace(/<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/, "");
const CHECK = { title: "Same dates, compared", sub: "Clicks in Search Console", cols: ["Clicks", "Change"],
  rows: [{ label: "Whole site", value: "-20%", tone: "bad" }, { label: "This page", value: "-5%", tone: "warn", hi: true },
    { label: "Your page vs the site", value: "+15 pts", tone: "good" }] };
const SAVECARD = { title: "Did your rewrite work?", sub: "Search Console, same dates", cols: ["Check", "Result"],
  rows: [{ label: "Your page since the change", value: "-5%", tone: "warn" }, { label: "Whole site, same dates", value: "-20%", tone: "bad" },
    { label: "Page beat the site?", value: "Keep it", tone: "good", hi: true }] };

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false); W._t = t;
  const cam = camAt();
  const world = DUO.room(t, { night: true }) + coldMug(MY.svg(t)) + DUO.deskFront() + DUO.laptop() + (mugHeld(t) ? "" : DUO.mug(780)) + F.svg(t)
    + DUO.stat(775, 565, W.down, "-5%", "bad");
  document.getElementById("stage").innerHTML = DUO.cam(world, cam)
    + DUO.listInsert(W.ins, W.rows, { ...CHECK, rows: CHECK.rows.slice(0, W.n), hiK: W.hi })
    + DUO.listInsert(W.save, W.saveRows, { ...SAVECARD, hiK: W.saveHi })
    + (W.fTop > 0 ? DUO.cam(F.svg(t), cam) : "") // Floey in front of the save card, talking to the viewer
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); W._t = t; return camAt(); };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
