<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Public+Sans:wght@800&display=swap" rel="stylesheet">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/world/garden.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="lines.js"></script>
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f7f4ee}svg{display:block}</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r003: "Day 3 is too soon". Format: ticking clock.
// Your fixed page waits on a day counter: 3, then the ~30 day recrawl, then 1 to 2
// days for the new title. A core-update page, far off at the other end of the
// garden, waits months. Back at your page Floey taps the change's tag and the
// before/after measurement opens. Then she finds your next fix on day 3: the
// last frame is the first frame, one flower along.
const C = HUM.colors, M = window.MOUTHS || {};
const LINES = window.LINES;
const GAP = { hook0: 0.5, body1: 0.45, body2: 0.75, body3: 0.5, body4: 0.55, payoff5: 0.6, loop6: 0.35, go7: 0.75, url8: 0.7 };
const { B, DUR } = PROPS.timing(LINES, M, GAP);
const b = B;

// ---------- the garden ----------
// U: the page you fixed. N: your next fix, its twin one stretch (DX) along the
// row, with twin neighbours, so the last frame (at N) is the first (at U).
// K: a core-update page at the far left end of the garden.
const PAL = [C.coral, C.amber, C.magenta], NPAL = [C.amber, C.violet, C.indigo], DX = 900;
const FLOWERS = {
  U: { x: 520, base: 1720, h: 700, pal: PAL, dir: 1, seed: 5 },
  N: { x: 520 + DX, base: 1720, h: 700, pal: PAL, dir: 1, seed: 5 },
  a: { x: 60, base: 1720, h: 400, pal: NPAL, dir: 1, seed: 19 },
  c: { x: 60 + DX, base: 1720, h: 400, pal: NPAL, dir: 1, seed: 19 },
  c2: { x: 60 + 2 * DX, base: 1720, h: 400, pal: NPAL, dir: 1, seed: 19 },
  h: { x: -380, base: 1720, h: 470, pal: [C.indigo, C.violet, C.amber], dir: -1, seed: 17 },
  g: { x: -900, base: 1720, h: 420, pal: [C.coral, C.violet, C.amber], dir: -1, seed: 31 },
  K: { x: -1500, base: 1720, h: 560, pal: [C.violet, C.indigo, C.magenta], dir: 1, seed: 13 },
  e: { x: -2000, base: 1720, h: 440, pal: [C.amber, C.magenta, C.violet], dir: -1, seed: 29 },
};
const FILL = [["e", 0.8], ["K", 0.15], ["g", 0.78], ["h", 0.8], ["a", 0.78], ["c", 0.78], ["c2", 0.78]];
const head = PROPS.head;
// the same lean and sway the garden draws, so tags ride the stem
const lean = (f, h, t) => (1 - h) * 26 * (f.dir || 1) + Math.sin(t * 1.25 + f.seed) * 1.6 * h + Math.sin(t * 2.9 + f.seed * 2) * 0.5 * h;
const rot = (f, h, t, x, y) => { const a = lean(f, h, t) * Math.PI / 180, dx = x - f.x, dy = y - f.base; return { x: f.x + dx * Math.cos(a) - dy * Math.sin(a), y: f.base + dx * Math.sin(a) + dy * Math.cos(a) }; };
const stemAt = (f, h, t, frac) => rot(f, h, t, f.x, f.base - f.h * frac);

const H0 = 0.5, HK = 0.15;            // your fixed page holds at half health; the core-update page is fading
const hU = head(FLOWERS.U, H0), hN = head(FLOWERS.N, H0), hK = head(FLOWERS.K, HK);
// day counters, beside each head (world centre)
const CNT = { U: { x: hU.x + 185, y: hU.y - 205 }, N: { x: hN.x + 185, y: hN.y - 205 }, K: { x: hK.x + 205, y: hK.y - 230 } };
const TAGAT = 0.62;                   // the 'updated' tag sits on the stem, under the head

// ---------- shots ----------
// shot(): the camera that puts world point (wx, wy) at screen (sx, sy)
const shot = (wx, wy, sx, sy, zoom) => ({ camX: wx - (sx - 540) / zoom, camY: wy - (sy - 960) / zoom, zoom });
const toWorld = (cam, sx, sy) => ({ x: cam.camX + (sx - 540) / cam.zoom, y: cam.camY + (sy - 960) / cam.zoom });
const CLOSE = shot(hU.x, hU.y, 600, 660, 1.5);
const NOSE = toWorld(CLOSE, 285, 630);                 // Floey, nose to nose with the page
const WIDE = shot(hU.x, hU.y, 560, 700, 0.9);
const MED = shot(hU.x, hU.y, 380, 900, 1.0);           // the counter sits clear in the middle
const MED2 = shot(hU.x, hU.y, 430, 820, 0.95);         // room for the low leaf
const B3 = shot(hU.x, hU.y, 640, 760, 1.3);
const KSHOT = shot(hK.x, hK.y, 650, 840, 1.15);
const PAY = shot(hU.x, hU.y, 720, 820, 1.0);
const LOOPCAM = { ...CLOSE, camX: CLOSE.camX + DX };
const NOSE_N = { x: NOSE.x + DX, y: NOSE.y };
// her beak tip sits about this far from her centre in side view (floey.js beakOffset, K 1.35)
const BEAK = { x: 155, y: -17 };
// a peck at time tc: glide in just short of (px, py), head back, then a quick dip
// so the beak tip taps the point, and ease off. f is her facing (-1 = beak right).
// (reach() ends in a nose-up brake, which lifts the beak off a small target)
const peck = (tc, px, py, f = -1) => {
  const cx = px + f * BEAK.x, cy = py - BEAK.y;
  return F.move(tc - 0.57, cx + f * 34, cy - 12, 0.35, "power2.inOut")
    .tiltTo(tc - 0.14, -6, 0.08)
    .move(tc - 0.1, cx, cy, 0.1, "power2.in").tiltTo(tc - 0.05, 8, 0.05)
    .move(tc + 0.04, cx + f * 26, cy - 6, 0.28, "power2.out").tiltTo(tc + 0.08, 0, 0.2);
};

// world state
const W = { ...CLOSE, bg: 0, hU: H0, newTitle: 0, wobU: 0, wobN: 0, popN: 0, tagK: 0, cntK: 0, chart: 0, line: 0, bracket: 0, after: 0, site: 0, source: 0, logo: 0 };

// the days tick: [time, day]
const TICK_U = [[0, 3]], TICK_K = [[0, 30]], TICK_N = [[0, 3]];
const sfxQ = [];                      // prop sounds, panned to the prop once the camera is known
const prop = (t, kind, wx, extra) => sfxQ.push([t, kind, wx, extra]);
const tickU = (t, d, snd = "pluck") => { TICK_U.push([t, d]); if (snd) prop(t, snd, CNT.U.x); };
const dayOf = (ticks, t) => { let d = ticks[0][1], at = -9; for (const [s, v] of ticks) if (s <= t) { d = v; at = s; } return { d, at }; };

// ---------- Floey's performance, cued to the voice ----------
const F = FLOEY.create({ x: NOSE.x, y: NOSE.y, facing: -1, scale: 1.35, mood: "think" });
const wt = gsap.timeline({ paused: true });

// HOOK: nose to nose with the page you fixed, DAY 3. Then she whips round to you.
wt.set(W, { ...CLOSE }, 0)
  .to(W, { zoom: 1.6, camY: CLOSE.camY - 12, duration: 2.4, ease: "sine.inOut" }, 0);
TICK_U.push([0.5, 3]);                // a little bump on the counter
prop(0.5, "pluck", CNT.U.x);
F.look(0, 0.7, 0.1, 0.01)
 .say(b.hook0.start, M.hook0 || [], "hook0")
 .tiltTo(1.3, -8, 0.25).tiltTo(1.9, 0, 0.2)
 .move(b.hook0.start + 2.0, NOSE.x - 22, NOSE.y + 6, 0.2, "power1.in")      // leans back: anticipation
 .sfx(b.hook0.start + 2.18, "swish")
 .pivot(b.hook0.start + 2.2, "front").mood(b.hook0.start + 2.2, "worried")
 .move(b.hook0.start + 2.22, NOSE.x + 10, NOSE.y, 0.35, "back.out(2)")
 .look(b.hook0.start + 2.3, 0, 0, 0.1);

// BODY1: dart back, pull out wide; the counter starts counting the days
const wideF = toWorld(WIDE, 300, 640);
F.pivot(b.body1.start - 0.15, "side")
 .dart(b.body1.start, wideF.x, wideF.y, 0.3, -1)
 .mood(b.body1.start + 0.1, "think")
 .say(b.body1.start, M.body1 || [], "body1")
 .look(b.body1.start + 0.6, 0.8, -0.5, 0.12);
wt.to(W, { ...WIDE, duration: 1.0, ease: "power3.inOut" }, b.body1.start - 0.05)
  .to(W, { source: 1, duration: 0.3 }, b.body1.start + 0.5)
  .to(W, { source: 0, duration: 0.3 }, b.body1.end + 0.1);
tickU(b.body1.start + 0.8, 4); tickU(b.body1.start + 1.3, 5); tickU(b.body1.start + 1.8, 6);
// then she zips over to the counter, turns to face it and points her beak at it,
// nodding at every tick as it speeds up
const ptTip = toWorld(MED, 668, 690), ptF = { x: ptTip.x + BEAK.x, y: ptTip.y - BEAK.y };
const PT = b.body1.start + 2.3;
wt.to(W, { ...MED, duration: 0.9, ease: "power2.inOut" }, PT - 0.1);
F.dart(PT, ptF.x + 40, ptF.y, 0.32, -1)
 .face(PT + 0.55, 1).mood(PT + 0.55, "think")
 .tiltTo(PT + 0.6, -6, 0.15)
 .look(PT + 0.6, -1, 0, 0.08);
[[8, 0.8], [11, 1.3], [14, 1.8]].forEach(([d, at]) => { tickU(PT + at, d); F.tiltTo(PT + at - 0.04, 8, 0.05).tiltTo(PT + at + 0.06, -6, 0.12); });
F.move(PT + 2.3, ptF.x, ptF.y + 4, 0.22, "back.out(2)")   // the point: a small lean in at the counter
 .sfx(PT + 2.32, "tap", { x0: 640 })
 .tiltTo(PT + 2.6, 0, 0.2);

// BODY2: "So we wait." The counter runs; she looks around, sags, and lands on top
// of the counter to wait it out (clear of the page and its tag)
for (let d = 15; d <= 29; d++) TICK_U.push([b.body2.start - 0.15 + (d - 15) * 0.1, d]);
prop(b.body2.start - 0.15, "brrt", CNT.U.x);
const perch = { x: CNT.U.x + 6, y: CNT.U.y - 73 - 128 };   // feet on the counter's top edge
F.mood(b.body2.start - 0.1, "worried")
 .say(b.body2.start, M.body2 || [], "body2")
 .lookAround(b.body2.start - 0.05, 0.55)
 .mood(b.body2.start + 0.55, "sad")
 .land(b.body2.start + 0.65, perch.x, perch.y, 0.5)
 .look(b.body2.start + 1.3, -0.4, 1, 0.3);
wt.to(W, { ...MED2, duration: 1.0, ease: "sine.inOut" }, b.body2.start + 0.2);

// BODY3: DAY 30 lands hard under her feet; the recrawl bursts on the page; then 31, 32 and the new title shows
const RECRAWL = b.body3.start + 0.35;
tickU(b.body3.start - 0.05, 30, "tap");
prop(RECRAWL, "ting", hU.x); prop(RECRAWL + 0.02, "bloom", hU.x);
F.mood(b.body3.start - 0.02, "surprised").look(RECRAWL + 0.05, -0.7, 1, 0.06)
 .say(b.body3.start, M.body3 || [], "body3")
 .move(b.body3.start - 0.05, perch.x, perch.y - 16, 0.08, "power2.out").move(b.body3.start + 0.03, perch.x, perch.y, 0.22, "bounce.out");
F.pose(RECRAWL + 0.69);              // takeoff lifts from where she is then
F.takeoff(RECRAWL + 0.7);
const b3F = toWorld(B3, 280, 790);
F.move(RECRAWL + 1.05, b3F.x, b3F.y, 0.55, "power2.inOut")
 .face(RECRAWL + 1.05, -1).mood(RECRAWL + 1.1, "happy")
 .look(RECRAWL + 1.7, 0.6, -0.2, 0.1);
wt.to(W, { ...B3, duration: 1.3, ease: "power2.inOut" }, RECRAWL + 0.6);
tickU(b.body3.start + 2.0, 31); tickU(b.body3.start + 2.5, 32);
wt.to(W, { newTitle: 1, duration: 0.3, ease: "back.out(2.5)" }, b.body3.start + 3.0)
  .to(W, { hU: 0.62, duration: 0.8, ease: "power1.inOut" }, b.body3.start + 3.0);
prop(b.body3.start + 3.0, "pluck", hU.x);
F.flash(b.body3.start + 3.6).chips(b.body3.start + 3.65, 2);

// BODY4: a separate case. Whip to the far end of the garden: a core-update page, months on its counter.
const kTip = toWorld(KSHOT, 455, 800), kF = { x: kTip.x - BEAK.x, y: kTip.y - BEAK.y };
wt.to(W, { ...KSHOT, duration: 0.6, ease: "power3.inOut" }, b.body4.start - 0.45);
F.sfx(b.body4.start - 0.45, "swish", { x0: 540 });
F.pivot(b.body4.start - 0.6, "side").mood(b.body4.start - 0.6, "think")
 .dart(b.body4.start - 0.4, kF.x, kF.y, 0.55, -1)
 .say(b.body4.start, M.body4 || [], "body4");
wt.to(W, { tagK: 1, duration: 0.3, ease: "back.out(2.5)" }, b.body4.start + 0.05)
  .to(W, { cntK: 1, duration: 0.25 }, b.body4.start + 0.2)
  .to(W, { source: 1, duration: 0.3 }, b.body4.start + 0.3)
  .to(W, { source: 0, duration: 0.3 }, b.body4.end + 0.1);
prop(b.body4.start + 0.05, "pluck", hK.x);
// the counter races ahead: 30 ... 90 ... 180
for (let i = 1, d = 40; d <= 180; d += 10, i++) TICK_K.push([b.body4.start + 0.45 + i * 0.07, d]);
prop(b.body4.start + 0.5, "brrt", CNT.K.x); prop(b.body4.start + 0.45 + 15 * 0.07, "tap", CNT.K.x);
F.look(b.body4.start + 0.5, 1, -0.9, 0.1)
 .mood(b.body4.start + 1.55, "surprised")
 .reverse(b.body4.start + 1.7, kF.x - 60, 0.5)
 .shake(b.body4.start + 2.35)
 .mood(b.body4.start + 2.9, "worried");

// PAYOFF: back to your page (new title still on, DAY 32). Don't judge on day 3:
// she taps the change's tag and the measurement opens: before, the change,
// a settling bracket, then an empty 'after' still to come.
const P1 = toWorld(PAY, 475, 1000);
wt.to(W, { ...PAY, duration: 0.6, ease: "power3.inOut" }, b.payoff5.start - 0.4);
F.sfx(b.payoff5.start - 0.4, "swish", { x0: 540 })
 .dart(b.payoff5.start - 0.35, P1.x, P1.y, 0.5, -1)
 .mood(b.payoff5.start + 0.15, "determined")
 .pivot(b.payoff5.start + 0.3, "front")
 .say(b.payoff5.start, M.payoff5 || [], "payoff5");
// "don't": a quick no-no wag
F.move(b.payoff5.start + 0.6, P1.x - 12, P1.y, 0.1, "sine.inOut").move(b.payoff5.start + 0.72, P1.x + 12, P1.y, 0.12, "sine.inOut")
 .move(b.payoff5.start + 0.86, P1.x, P1.y, 0.12, "sine.inOut")
 .look(b.payoff5.start + 0.6, -0.8, 0, 0.05).look(b.payoff5.start + 0.72, 0.8, 0, 0.05).look(b.payoff5.start + 0.9, 0, 0, 0.08)
 .sfx(b.payoff5.start + 0.6, "tk");
const TAP = b.payoff5.start + 1.6;   // the beak touches the tag
const tU = stemAt(FLOWERS.U, 0.62, TAP, TAGAT);
F.pivot(TAP - 0.75, "side").face(TAP - 0.75, -1);
peck(TAP, tU.x - 62, tU.y, -1)
 .sfx(TAP, "tap", { x0: 540 + (tU.x - PAY.camX) });
wt.to(W, { wobU: 1, duration: 0.6, ease: "none" }, TAP);
prop(TAP + 0.06, "ting", tU.x);
// the measurement pops up in the sky to the left
const CH = { ...toWorld(PAY, 70, 300), w: 470, h: 330 };
F.move(TAP + 0.45, P1.x, P1.y, 0.45, "power2.inOut")
 .mood(TAP + 0.5, "happy").look(TAP + 0.6, -0.4, -1, 0.15);
wt.to(W, { chart: 1, duration: 0.35, ease: "back.out(1.8)" }, TAP + 0.3)
  .to(W, { bracket: 1, duration: 0.4, ease: "back.out(2)" }, TAP + 0.8)
  .to(W, { line: 1, duration: 0.7, ease: "power1.inOut" }, TAP + 1.45)
  .to(W, { after: 1, duration: 0.5, ease: "power2.out" }, TAP + 2.55);
const chX = CH.x + CH.w / 2;
prop(TAP + 0.3, "pluck", chX); prop(TAP + 0.8, "swish", chX); prop(TAP + 1.0, "ting", chX); prop(TAP + 1.45, "rustle", chX, { n: 2 }); prop(TAP + 2.55, "pluck", chX);
// "adjusted for your whole site": the pages around it glow once
wt.to(W, { site: 1, duration: 0.5, ease: "power2.out" }, b.payoff5.start + 4.75)
  .to(W, { site: 0, duration: 0.6 }, b.payoff5.start + 5.8);
prop(b.payoff5.start + 4.75, "shimmer", 540);
F.pivot(b.payoff5.start + 4.5, "front").look(b.payoff5.start + 4.6, 0, 0, 0.1)
 .stretch(b.payoff5.end - 0.55, 0.6)
 .tongue(b.payoff5.end + 0.15, 2);

// LOOP: her head turns; the camera glides along the row to your next fix, DAY 3.
// The sky holds still on the glide (bg), so the last frame matches the first.
const L0 = b.loop6.start;
wt.to(W, { chart: 0, line: 0, bracket: 0, after: 0, duration: 0.3, ease: "power2.in" }, L0 - 0.45)
  .to(W, { ...LOOPCAM, bg: 1, duration: 1.3, ease: "power2.inOut" }, L0 - 0.1)
  .to(W, { popN: 1, duration: 0.5, ease: "none" }, L0 + 0.85);
prop(L0 - 0.45, "swish", chX);
prop(L0 - 0.1, "swish", 540);
prop(L0 + 0.85, "pluck", NOSE_N.x);   // its tag and counter come into view
F.pivot(L0 - 0.25, "side").face(L0 - 0.25, -1).mood(L0 - 0.2, "think")
 .look(L0 - 0.2, 1, 0, 0.08)
 .say(L0, M.loop6 || [], "loop6")
 .move(L0, NOSE_N.x - 70, NOSE_N.y - 10, 1.1, "power2.inOut")
 .dart(L0 + 1.2, NOSE_N.x, NOSE_N.y, 0.22, -1)
 .mood(L0 + 1.45, "worried");

// GO: she spins to you and flashes, then taps this page's tag: measure this one too
// (the camera eases back a touch so she has room beside the tag)
const TAPN = b.go7.start + 1.3, tN = stemAt(FLOWERS.N, H0, TAPN, TAGAT), GOCAM = shot(hN.x, hN.y, 650, 640, 1.25);
F.pivot(b.go7.start - 0.1, "front").mood(b.go7.start - 0.1, "determined")
 .say(b.go7.start, M.go7 || [], "go7")
 .flash(b.go7.start + 0.15)
 .pivot(TAPN - 0.65, "side").face(TAPN - 0.65, -1);
peck(TAPN, tN.x - 62, tN.y, -1)
 .sfx(TAPN, "tap", { x0: 540 + (tN.x - GOCAM.camX) * GOCAM.zoom })
 .mood(TAPN + 0.1, "party").chips(TAPN + 0.2, 2);
wt.to(W, { ...GOCAM, duration: 0.5, ease: "power2.inOut" }, b.go7.start + 0.4)
  .to(W, { wobN: 1, duration: 0.6, ease: "none" }, TAPN)
  .to(W, { ...LOOPCAM, duration: 0.9, ease: "power2.inOut" }, b.go7.end + 0.15);
prop(TAPN + 0.06, "ting", tN.x);

// URL: after a beat, the spark logo, small in the lower corner; then she settles
// nose to nose again: frame one
F.move(b.go7.end + 0.3, NOSE_N.x, NOSE_N.y, 0.6, "power2.inOut").mood(b.go7.end + 0.3, "hello")
 .face(b.go7.end + 0.35, -1)
 .say(b.url8.start, M.url8 || [], "url8")
 .chips(b.url8.end + 0.1, 1)
 .look(b.url8.end + 0.3, 0.7, 0.1, 0.1)
 .mood(b.url8.end + 0.3, "think");
const LOGO = { x: 170, y: 1250 };
wt.to(W, { logo: 1, duration: 0.35, ease: "back.out(1.6)" }, b.url8.start - 0.05)
  .to(W, { logo: 0, duration: 0.35, ease: "power2.in" }, b.url8.end + 0.25);
F.sfx(b.url8.start - 0.05, "ting", { x0: LOGO.x });
wt.set({}, {}, DUR);

// prop sounds, panned to where the prop is on screen at that moment
for (const [t, kind, wx, extra] of sfxQ) {
  wt.seek(Math.min(DUR, t), false);
  F.sfx(t, kind, { ...extra, x0: Math.round(Math.max(0, Math.min(1080, 540 + (wx - W.camX) * W.zoom))) });
}
wt.seek(0, false);

// ---------- drawing ----------
const INK = C.ink, FONT = "Space Grotesk";
// a labelled prop fades out as it reaches the frame edge, so no word is ever cut in half
const edge = (wx, half) => {
  const l = 540 + (wx - half - W.camX) * W.zoom, r = 540 + (wx + half - W.camX) * W.zoom;
  return Math.max(0, 1 - Math.max(0, -l, r - 1080) / 8);
};
// the day counter: PROPS.calendar showing `day`, scaled down, with a bump on each tick.
// bar: a thin track under it that fills toward day 30 (the typical recrawl)
function counter(cx, cy, day, since, k = 1, bar = true) {
  const o = Math.min(1, k) * edge(cx, 80);
  if (o <= 0.01) return "";
  const s = 0.44 * (1 + 0.1 * Math.exp(-Math.max(0, since) * 9) * (since >= 0 ? 1 : 0));
  let g = PROPS.calendar(1, 0, 0, day).replace('opacity="1"', "");
  if (bar) { const fw = 330 * Math.min(1, day / 30); g += `<rect x="0" y="352" width="330" height="26" rx="13" fill="#fffaf2" stroke="${INK}" stroke-width="5"/>${fw > 0 ? `<rect x="0" y="352" width="${Math.max(26, fw).toFixed(1)}" height="26" rx="13" fill="${day >= 30 ? "#2f9e62" : C.coral}" stroke="${INK}" stroke-width="5"/>` : ""}`; }
  return `<g opacity="${o.toFixed(3)}" transform="translate(${cx} ${cy}) scale(${s * (0.85 + 0.15 * Math.min(1, k))}) translate(-165 -165)">${g}</g>`;
}
// a pill label on a flower, cut nowhere by the frame
function pill(x, y, k, text) {
  const o = edge(x, Math.max(148, PROPS.measure(text, "700 32px 'Space Grotesk'") + 56) / 2 * k);
  return k > 0 && o > 0.01 ? `<g opacity="${o.toFixed(3)}">${PROPS.tag(x, y, k, text, C.coral)}</g>` : "";
}
// a spark with an ink outline, so it reads against the pale sky
const inkSpark = (x, y, r, col) => HUM.spark(x, y, r, col).replace("/>", ` stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`);
// a tag that wobbles and shimmers when tapped (w 0..1); pop bumps it once
function tagOn(p, k, text, w, pop = 0) {
  const a = w > 0 && w < 1 ? Math.sin(w * Math.PI * 5) * 9 * (1 - w) : 0, bump = pop > 0 && pop < 1 ? Math.sin(pop * Math.PI) * 0.18 : 0;
  let s = `<g transform="rotate(${a.toFixed(2)} ${p.x} ${p.y})">${pill(p.x, p.y, k * 0.8 * (1 + bump), text)}</g>`;
  if (w > 0 && w < 1) s += `<g opacity="${Math.sin(w * Math.PI).toFixed(3)}">${inkSpark(p.x + 92, p.y - 34, 18 + 10 * w, C.amber)}${inkSpark(p.x - 90, p.y + 30, 14 + 8 * w, C.amber)}</g>`;
  return s;
}
// the recrawl: a warm flash behind the page, then a ring and big sparks in front
const RK = (t) => (t - RECRAWL) / 0.95;
function burstBack(t, x, y) {
  const k = RK(t); if (k < 0 || k > 1) return "";
  const e = 1 - Math.pow(1 - k, 3);
  return `<circle cx="${x}" cy="${y}" r="${(160 + 200 * e).toFixed(1)}" fill="#fff1c2" opacity="${(0.95 * (1 - k)).toFixed(3)}"/>`;
}
function burstFront(t, x, y) {
  const k = RK(t); if (k < 0 || k > 1) return "";
  const e = 1 - Math.pow(1 - k, 3);
  let s = `<circle cx="${x}" cy="${y}" r="${(150 + 250 * e).toFixed(1)}" fill="none" stroke="${C.amber}" stroke-width="${(14 * (1 - k) + 3).toFixed(1)}" opacity="${(1 - k).toFixed(3)}"/>`;
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.3, d = 140 + e * (170 + (i % 3) * 60);
    s += `<g opacity="${Math.min(1, (1 - k) * 1.8).toFixed(3)}">${inkSpark(x + Math.cos(a) * d, y + Math.sin(a) * d, 46 * (1 - k * 0.4), [C.amber, C.coral, C.magenta, C.violet][i % 4])}</g>`;
  }
  return s;
}
// the measurement chart, with the reel's one new prop: the settling bracket
const BEFORE = [0.42, 0.47, 0.4, 0.45, 0.43];
function measureChart(o) {
  if (W.chart <= 0.01) return "";
  const { x, y, w, h } = o, k = W.chart, cx = x + w / 2, cy = y + h / 2;
  const x0 = x + 30, x1 = x + w - 30, mx = x0 + (x1 - x0) * 0.4, sx = mx + (x1 - x0) * 0.22;
  const py = (v) => y + h - 64 - v * (h - 150), base = y + h - 52;
  let s = `<g opacity="${Math.min(1, k * 3).toFixed(3)}" transform="translate(${cx} ${cy}) scale(${0.9 + 0.1 * k}) translate(${-cx} ${-cy})">`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="28" fill="#fffaf2" stroke="${INK}" stroke-width="7"/>`;
  s += `<text x="${x + 30}" y="${y + 54}" font-family="${FONT}" font-weight="700" font-size="30" fill="${INK}">Clicks</text>`;
  s += `<path d="M${x0},${base} H${x1}" stroke="${INK}" stroke-width="3" opacity=".25"/>`;
  // the change: a dashed line
  s += `<path d="M${mx},${y + 78} V${base}" stroke="${INK}" stroke-width="3.5" stroke-dasharray="8 8" opacity=".55"/>`;
  // before: drawn in up to the change, and no further
  const pts = BEFORE.map((v, i) => [x0 + (mx - x0) * i / (BEFORE.length - 1), py(v)]);
  const n = W.line * (pts.length - 1), full = Math.floor(n), part = n - full;
  if (W.line > 0) {
    const show = pts.slice(0, full + 1);
    if (full < pts.length - 1) { const [ax, ay] = pts[full], [bx, by] = pts[full + 1]; show.push([ax + (bx - ax) * part, ay + (by - ay) * part]); }
    s += `<polyline points="${show.map(([a, c]) => `${a.toFixed(1)},${c.toFixed(1)}`).join(" ")}" fill="none" stroke="${C.indigo}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  s += `<text x="${(x0 + mx) / 2}" y="${base + 34}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="28" fill="${INK}" opacity="${(0.75 * Math.min(1, W.line * 2)).toFixed(3)}">before</text>`;
  // the settling bracket slides down into place just after the change
  if (W.bracket > 0.01) {
    const by = y + 96 - (1 - W.bracket) * 24, bw = sx - mx - 12;
    s += `<g opacity="${Math.min(1, W.bracket * 2).toFixed(3)}"><path d="M${mx + 6},${by + 14} v-14 h${bw} v14" fill="none" stroke="${C.coral}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    s += `<rect x="${mx + 6}" y="${by + 22}" width="${bw}" height="${base - by - 22}" rx="10" fill="${C.coral}" opacity=".12"/>`;
    s += `<text x="${mx + 6 + bw / 2}" y="${base + 34}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="28" fill="${C.coral}">settle</text></g>`;
  }
  // after: an empty, dashed window, nothing drawn in it yet
  if (W.after > 0.01) {
    const ax = sx + 6, aw = x1 - ax;
    s += `<g opacity="${W.after.toFixed(3)}"><rect x="${ax}" y="${y + 84}" width="${aw}" height="${base - y - 92}" rx="12" fill="none" stroke="${C.indigo}" stroke-width="4" stroke-dasharray="10 9" opacity=".6"/>`;
    s += `<text x="${ax + aw / 2}" y="${base + 34}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="28" fill="${INK}" opacity=".75">after</text></g>`;
  }
  return s + `</g>`;
}
// a soft ring of light around a flower head ("your whole site")
const siteGlow = (f, h) => { if (W.site <= 0.01) return ""; const p = head(f, h); return `<circle cx="${p.x}" cy="${p.y}" r="${(150 + 30 * W.site).toFixed(1)}" fill="#fff1c2" opacity="${(0.75 * W.site).toFixed(3)}"/><circle cx="${p.x}" cy="${p.y}" r="${(170 + 30 * W.site).toFixed(1)}" fill="none" stroke="${C.amber}" stroke-width="6" opacity="${(0.8 * W.site).toFixed(3)}"/>`; };
// where the numbers come from (screen space, above the captions)
const SRC = ["Source: Gary Illyes, Google", "Search Central Live Barcelona, 2 Oct 2026"];
function sourceCard(k) {
  if (k <= 0.01) return "";
  const w = Math.max(...SRC.map((s, i) => PROPS.measure(s, `${i ? 600 : 700} 26px '${FONT}'`))) + 52;
  return `<g opacity="${k.toFixed(3)}" transform="translate(540 1352)"><rect x="${-w / 2}" y="-46" width="${w}" height="92" rx="22" fill="#fffaf2" opacity=".95" stroke="${INK}" stroke-width="4"/>` +
    `<text x="0" y="-7" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="26" fill="${INK}">${PROPS.esc(SRC[0])}</text>` +
    `<text x="0" y="27" text-anchor="middle" font-family="${FONT}" font-weight="600" font-size="26" fill="${INK}" opacity=".75">${PROPS.esc(SRC[1])}</text></g>`;
}
// the Flowra spark logo, intact, on a small paper badge
function logo(k) {
  if (k <= 0.01) return "";
  return `<g opacity="${Math.min(1, k).toFixed(3)}" transform="translate(${LOGO.x} ${LOGO.y}) scale(${(0.8 + 0.2 * k).toFixed(3)})"><circle r="64" fill="#fffaf2" stroke="${INK}" stroke-width="5"/>${HUM.spark(0, 0, 40, C.coral)}</g>`;
}

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  F.pose(t);
  const cam = { camX: W.camX, camY: W.camY, zoom: W.zoom };
  // the far garden only runs so wide: a gentler parallax for the sky and hills,
  // and on the glide to your next page the sky holds still
  const bx = W.camX - DX * W.bg;
  let s = GARDEN.defs() + GARDEN.background(t, { ...cam, camX: 540 + (bx - 540) * 0.35 });
  s += `<g transform="translate(540 960) scale(${W.zoom}) translate(${-W.camX} ${-W.camY})">`;
  s += GARDEN.ground() + `<g transform="translate(2000 0)">${GARDEN.ground()}</g><g transform="translate(-2100 0)">${GARDEN.ground()}</g>`;
  for (const [id, h] of FILL) s += siteGlow(FLOWERS[id], h) + GARDEN.flower(FLOWERS[id], h, t);
  s += GARDEN.flower(FLOWERS.N, H0, t);
  s += burstBack(t, head(FLOWERS.U, W.hU).x, head(FLOWERS.U, W.hU).y);
  s += GARDEN.flower(FLOWERS.U, W.hU, t);
  // tags on the stems
  s += tagOn(stemAt(FLOWERS.U, W.hU, t, TAGAT), 1, "updated", W.wobU);
  s += tagOn(stemAt(FLOWERS.N, H0, t, TAGAT), 1, "updated", W.wobN, W.popN);
  s += tagOn(stemAt(FLOWERS.K, HK, t, 0.45), W.tagK, "core update", 0);
  // the recrawl, and the new title on the page
  { const p = head(FLOWERS.U, W.hU); s += burstFront(t, p.x, p.y) + pill(p.x - 10, p.y - 190, W.newTitle * 0.8, "new title"); }
  // counters
  const du = dayOf(TICK_U, t), dk = dayOf(TICK_K, t);
  s += counter(CNT.U.x, CNT.U.y, du.d, t - du.at);
  s += counter(CNT.N.x, CNT.N.y, 3, t - (b.loop6.start + 0.85));
  s += counter(CNT.K.x, CNT.K.y, dk.d, t - dk.at, W.cntK, false);
  s += measureChart(CH);
  s += F.trail(t) + F.svg(t);  s += `</g>`;
  s += GARDEN.pollen(t, { ...cam, camX: bx }) + GARDEN.vignette();
  s += sourceCard(W.source) + logo(W.logo);
  s += PROPS.captions(LINES, B, t);
  document.getElementById("stage").innerHTML = s;
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), music: Object.values(B).map((x) => x.start) });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.render(0);
</script></body></html>
