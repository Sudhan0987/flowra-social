<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#efe6f3}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r018 "The Dotted Line" (duo style, brand/styles/duo/README.md; shape of reel/duo/template.html).
// Maya, hot coffee frozen at her chin, sees her clicks dive 60% (her own example). Floey: is the end
// of the line dotted? The tip zooms the chart into the dotted tail, Maya gets it, Floey tells her to
// drink her coffee, and nobody moves: the desk lamp clicks on and it is night. The line filled back in,
// the coffee is cold (no more steam), Floey's deadpan to camera, Maya's long look down the lens.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story (the long one is the day-to-night cut)
const GAP = { hook0: 0.25, reframe1: 0.2, doubt2: 0.2, tip3: 0.35, check4: 0.2, check5: 1.4, payoff6: 0.3, payoff7: 0.25, button8: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
// END pushed back 0.9 s so Maya's silent look to camera plays out before the end card
const END = SPOKEN + 0.6 + 0.9, DUR = END + 1.6, b = B, SH = DUO.SHOT, SP = DUO.SPOT;
const HC = HUM.colors, INK = HC.ink;

// her own framings: the hook and the final look share one shot, so the loop matches
const HOOK = { camX: 738, camY: 850, zoom: 1.65 };          // her face, the mug at her chin and the pill
const DOUBT = { camX: 590, camY: 1030, zoom: 1.2 };         // Maya, the mug going down, her jab at the laptop and Floey
const TIGHT = { camX: 645, camY: 865, zoom: 2.2 };         // the realisation (Floey's beak fully out at the left)
const MED = { ...SH.maya, camX: 740 };                      // the payoff (no tip of Floey's tail at the left edge)
// Floey alone, centred and big; the right edge stays clear of Maya's hair (her lean decides how far)
const FT = (camX) => ({ camX, camY: 1050, zoom: 3.2 });
// her hands for the mug: at her chin (frozen mid-sip), at her lips, and down on the desk where DUO.mug() stands
const MUGHI = { L: [262, 640], R: [384, 438], hold: "mug" };
const SIP = { L: [262, 640], R: [312, 372], hold: "mug" };
const DESK_HOLD = { L: [228, 705], R: [477, 667], hold: "mug" };
const DESK_LET = { L: [228, 705], R: [470, 690] };
const JAB = { L: [110, 400], R: [390, 700], kL: "point" };   // jabs at the laptop and Floey, above the lid; the other hand on the desk

// ---------- the Search Console chart: 24 hourly points, the newest hours dotted (still being counted) ----------
const DIP = [0.6, 0.62, 0.61, 0.63, 0.6, 0.62, 0.64, 0.61, 0.62, 0.6, 0.63, 0.62, 0.61, 0.63, 0.62, 0.6, 0.62, 0.63, 0.61, 0.62, 0.62, 0.45, 0.33, 0.25];
const FULL = [...DIP.slice(0, 21), 0.63, 0.64, 0.64]; // the dip filled in; the newest hours dotted and flat
const CH = { x0: 150, x1: 930, y0: 760, y1: 1180 };       // the chart area inside DUO.screenInsert
const NV = 33;                                              // points in the drawn view
const valAt = (pts, u) => { const i = Math.min(pts.length - 2, Math.floor(u)), k = u - i; return pts[i] + (pts[i + 1] - pts[i]) * k; };
// the view from hour a to the newest hour (zk 0 shows all 24 hours, zk 1 the last 8)
const view = (pts, zk) => { const n = pts.length - 1, a = 16 * zk; return { a, pts: Array.from({ length: NV }, (_, j) => valAt(pts, a + (n - a) * j / (NV - 1))) }; };
const XY = (fr, v) => [CH.x0 + (CH.x1 - CH.x0) * fr, CH.y1 - (CH.y1 - CH.y0) * v];
// the dotted tail, drawn on top of the insert with its own slide and fade; it grows with the zoom
function dottedTail(k, t, pts, from, tone, zk) {
  if (k <= 0.01) return "";
  const n = pts.length - 1, a = 16 * zk, fr = (from - a) / (n - a), col = tone === "good" ? "#2f9e62" : "#d24b4b";
  const ps = [XY(fr, valAt(pts, from))];
  for (let j = 0; j < NV; j++) { const u = j / (NV - 1); if (u > fr + 1e-6) ps.push(XY(u, valAt(pts, a + (n - a) * u))); }
  const d = ps.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" "), e = ps[ps.length - 1];
  const ty = 1920 * (1 - k) * 0.6, sw = 11 + 7 * zk, gap = 21 + 13 * zk;
  let s = `<g transform="translate(0 ${ty.toFixed(1)})" opacity="${Math.min(1, k * 2).toFixed(2)}">`;
  s += `<path d="${d} L${e[0].toFixed(1)},${CH.y1} L${ps[0][0].toFixed(1)},${CH.y1}Z" fill="${col}" opacity=".07"/>`;
  s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw.toFixed(1)}" stroke-linecap="round" stroke-dasharray="0.1 ${gap.toFixed(1)}"/>`;
  // the newest point: hollow (not counted yet); once zoomed in it pulses gently, still counting
  if (zk > 0.9) { const p = (t * 1.4) % 1; s += `<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="${(16 + 18 * p).toFixed(1)}" fill="none" stroke="${col}" stroke-width="5" opacity="${(0.6 * (1 - p)).toFixed(2)}"/>`; }
  s += `<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="13" fill="#fffaf2" stroke="${col}" stroke-width="6"/>`;
  return s + `</g>`;
}

// ---------- the desk lamp (right end of the desk) and the night light ----------
function lamp(on) {
  let s = `<g stroke="${INK}" stroke-linejoin="round" stroke-linecap="round">`;
  s += `<path d="M968,1366 L986,1222 L945,1076" fill="none" stroke-width="20"/><path d="M968,1366 L986,1222 L945,1076" fill="none" stroke="#7b6f9e" stroke-width="9"/>`;
  s += `<circle cx="986" cy="1222" r="11" fill="#7b6f9e" stroke-width="5"/>`;
  s += `<path d="M935,1372 q0,-24 33,-24 q33,0 33,24Z" fill="#7b6f9e" stroke-width="6"/>`;
  s += `<g transform="translate(945 1072) rotate(32)">`;
  if (on) s += `<ellipse cx="0" cy="62" rx="44" ry="14" fill="#fff2b0" stroke="none"/>`;
  s += `<path d="M-24,0 L24,0 L50,60 L-50,60Z" fill="${on ? "#ef6f73" : "#c9586c"}" stroke-width="6"/></g></g>`;
  return s;
}
const nightBack = () => `<rect x="-600" y="-400" width="2280" height="1772" fill="#1b1d48" opacity=".34"/>`
  + `<radialGradient id="r18glow" gradientUnits="userSpaceOnUse" cx="900" cy="1240" r="460"><stop offset="0" stop-color="#ffd27a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient><circle cx="900" cy="1240" r="460" fill="url(#r18glow)"/>`;
const nightFront = () => `<radialGradient id="r18dark" gradientUnits="userSpaceOnUse" cx="900" cy="1220" r="1150"><stop offset="0" stop-color="#14163a" stop-opacity="0"/><stop offset=".45" stop-color="#14163a" stop-opacity=".04"/><stop offset="1" stop-color="#14163a" stop-opacity=".42"/></radialGradient><rect x="-600" y="-400" width="2280" height="2800" fill="url(#r18dark)"/>`;
// her mug steams while the coffee is hot; after the time skip it is cold, so the steam lines go
const STEAM = /<path d="M-12,-12 q-8,-12 0,-24 M8,-12 q-8,-12 0,-24"[^>]*\/>/;

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "hello", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: MUGHI, floey: F });
MY.S.lean = 2; // frame one: leaning back from the laptop, coffee frozen at her chin
const W = { ...HOOK, down: 1, up: 0, insert: 0, chart: 0, zk: 0, mugDesk: 0, night: 0, end: 0 };
const wt = gsap.timeline({ paused: true });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => wt.to(W, { ...s, duration: d, ease }, t);
const cut = (t, s) => wt.set(W, { ...s }, t);

// HOOK0: frame one is the panic: mug frozen at her chin, the red -60% (her example) already up
MY.look(0, -0.8, 0.1).say(b.hook0.start, M.hook0 || [], "hook0").jolt(b.hook0.start + 0.05)
  .look(b.hook0.start + 0.9, -0.5, 0.7).tiltTo(b.hook0.start + 0.9, -4);
shot(0, { zoom: 1.74, camY: 840 }, b.hook0.start + 1.85, "none"); // a slow drift in on the panic
// on "cliff": her screen, steady all day, then the dive at the very end (already dotted, small)
wt.to(W, { insert: 1, duration: 0.35, ease: "power3.out" }, b.hook0.start + 1.85)
  .to(W, { down: 0, duration: 0.2 }, b.hook0.start + 1.85);   // the pill goes; the chart carries the number
F.sfx(b.hook0.start + 1.85, "whoosh");
F.look(b.hook0.start + 1.0, -0.2, 0).lookAround(b.hook0.start + 2.2, 0.6);

// REFRAME1: Floey alone on the lid, unbothered: a head tilt, then one small wink on "dotted"
cut(b.hook0.end + 0.1, FT(275));
wt.to(W, { insert: 0, duration: 0.2, ease: "power2.in" }, b.hook0.end + 0.05);
F.mood(b.reframe1.start - 0.15, "think").tiltTo(b.reframe1.start + 0.05, -14).sfx(b.reframe1.start + 0.05, "tk")
  .say(b.reframe1.start, M.reframe1 || [], "reframe1").wink(b.reframe1.end - 0.45).tiltTo(b.reframe1.end - 0.2, 0);
MY.expr(b.reframe1.start, "worried").look(b.reframe1.start, -0.8, 0.2);

// DOUBT2: cut to Maya as Floey finishes; the mug goes down (click), and she is jabbing at the laptop by her first word
cut(b.reframe1.end - 0.25, DOUBT);
MY.pose(b.reframe1.end - 0.25, DESK_HOLD, 0.2).leanTo(b.reframe1.end - 0.25, 0, 0.25).look(b.reframe1.end - 0.25, 0.6, 0.9);
wt.set(W, { mugDesk: 1 }, b.reframe1.end - 0.03);
F.sfx(b.reframe1.end - 0.03, "click");
MY.pose(b.reframe1.end - 0.03, DESK_LET, 0.01).pose(b.reframe1.end + 0.02, JAB, 0.2).look(b.reframe1.end + 0.05, -0.9, 0.1)
  .say(b.doubt2.start, M.doubt2 || [], "doubt2");
F.sfx(b.reframe1.end + 0.45, "swish");
MY.expr(b.doubt2.start + b.doubt2.len * 0.5, "panic").leanTo(b.doubt2.start + b.doubt2.len * 0.45, -3)
  .pose(b.doubt2.start + b.doubt2.len * 0.5, { ...JAB, L: [96, 372] }, 0.12);
// Floey, listening: turns to the mug on the click, then leans back from the jabbing finger
F.look(b.reframe1.end - 0.03, 0.6, 0.4).look(b.doubt2.start + 0.2, -0.8, 0).tiltTo(b.doubt2.start + b.doubt2.len * 0.5, 10, 0.15)
  .tiltTo(b.doubt2.end, 0, 0.2);

// TIP3: the two-shot; Floey tips her head down to the screen side, Maya leans in and listens
cut(b.doubt2.end + 0.1, SH.wide);
MY.pose(b.doubt2.end + 0.1, "rest", 0.35).expr(b.doubt2.end + 0.1, "worried").leanTo(b.tip3.start + 0.15, -4)
  .look(b.tip3.start + 0.15, -0.6, 0.6).expr(b.tip3.start + 0.9, "think");
F.mood(b.tip3.start - 0.1, "happy").tiltTo(b.tip3.start, 20).look(b.tip3.start, 0, 0.8).sfx(b.tip3.start, "tk")
  .say(b.tip3.start, M.tip3 || [], "tip3").tiltTo(b.tip3.start + 1.2, 0).look(b.tip3.start + 1.2, -0.4, 0);
shot(b.tip3.start + 0.3, SH.floey, 0.8, "power2.inOut"); // in on Floey for the tip, both faces in frame
// "dotted means Google's still counting": her screen, then the chart zooms into the tail until the dots are big
wt.to(W, { insert: 1, duration: 0.35, ease: "power3.out" }, b.tip3.start + 1.45);
F.sfx(b.tip3.start + 1.45, "whoosh");
wt.to(W, { zk: 1, duration: 0.9, ease: "power2.inOut" }, b.tip3.start + 1.9);
F.sfx(b.tip3.start + 2.8, "tick");

// CHECK4: out of the screen onto her face: eyes narrow on the dots, then "it is dotted." and the shoulders drop
cut(b.tip3.end + 0.25, TIGHT);
wt.to(W, { insert: 0, duration: 0.2, ease: "power2.in" }, b.tip3.end + 0.2).set(W, { zk: 0 }, b.tip3.end + 0.45);
shot(b.tip3.end + 0.25, { zoom: 2.35, camY: 880 }, b.check4.len + 0.1, "power1.out"); // ends before the cut to Floey
MY.pose(b.tip3.end - 0.1, "chin", 0.3).expr(b.tip3.end + 0.2, "deadpan").leanTo(b.tip3.end, -1).look(b.tip3.end, -0.6, 0.8);
// the shoulders drop: she sinks (no extra lean, so her head stays in the tight frame and clear of Floey's shot)
MY.say(b.check4.start, M.check4 || [], "check4").expr(b.check4.start + 0.6, "surprised").move(b.check4.end - 0.45, SP.maya.x, SP.maya.y + 24, 0.45)
  .expr(b.check4.end - 0.35, "happy");

// CHECK5: Floey preens without looking up ("Good. Now drink your coffee.")
cut(b.check5.start - 0.1, FT(265));
F.mood(b.check5.start - 0.1, "happy").say(b.check5.start, M.check5 || [], "check5").preen(b.check5.start + 0.1, 1.0);
MY.expr(b.check5.start + 0.3, "neutral").look(b.check5.start + 0.3, -0.5, 0.8);
// the time skip: the same wide frame, same lean, mug untouched; the lamp clicks on and it is night
cut(b.check5.end + 0.15, SH.wide);
wt.set(W, { night: 1 }, b.check5.end + 0.55);
F.sfx(b.check5.end + 0.55, "click");

// PAYOFF6: "Oh." over her screen at night: the dip filled back in, only the newest hour is dotted, flat
wt.set(W, { chart: 1 }, b.payoff6.start - 0.3).to(W, { insert: 1, duration: 0.3, ease: "power3.out" }, b.payoff6.start - 0.2);
F.sfx(b.payoff6.start - 0.2, "whoosh");
MY.expr(b.payoff6.start - 0.1, "surprised").say(b.payoff6.start, M.payoff6 || [], "payoff6").look(b.payoff6.start, -0.5, 0.8);
// back on Maya for "Up two percent": the pill flips red to green with one ding
cut(b.payoff6.start + 1.33, { ...MED, down: 1 });
wt.to(W, { insert: 0, duration: 0.2, ease: "power2.in" }, b.payoff6.start + 1.28)
  .to(W, { down: 0, duration: 0.12 }, b.payoff6.start + 1.55).to(W, { up: 1, duration: 0.3, ease: "back.out(2)" }, b.payoff6.start + 1.6);
F.sfx(b.payoff6.start + 1.6, "ding");
MY.expr(b.payoff6.start + 1.33, "happy").move(b.payoff6.start + 1.33, SP.maya.x, SP.maya.y, 0.35).leanTo(b.payoff6.start + 1.33, 0).pose(b.payoff6.start + 1.33, "rest", 0.25)
  .look(b.payoff6.start + 1.4, -0.4, 0.2).nod(b.payoff6.start + 1.6, 1);

// PAYOFF7: she grabs the mug as a reward, sips, and her face goes flat before "Ugh."
MY.pose(b.payoff6.end - 0.45, DESK_LET, 0.22).hold(b.payoff6.end - 0.2, "mug").pose(b.payoff6.end - 0.2, SIP, 0.28);
wt.set(W, { mugDesk: 0 }, b.payoff6.end - 0.2);
F.sfx(b.payoff6.end + 0.05, "sip");
MY.expr(b.payoff7.start - 0.15, "annoyed").expr(b.payoff7.end + 0.1, "deadpan").pose(b.payoff7.start + 0.1, MUGHI, 0.3).look(b.payoff7.start, 0.1, 1)
  .say(b.payoff7.start, M.payoff7 || [], "payoff7");
wt.to(W, { up: 0, duration: 0.3 }, b.payoff7.start + 0.2);
shot(b.payoff7.start, { camX: 738, camY: 850, zoom: 1.65 }, 1.0, "power2.out");

// BUTTON8: Floey turns to the lens, deadpan, one tongue flick after "dotted"
cut(b.button8.start - 0.15, FT(278));
F.pivot(b.button8.start - 0.12, "front").mood(b.button8.start - 0.1, "think").look(b.button8.start - 0.1, 0, 0)
  .say(b.button8.start, M.button8 || [], "button8").tongue(b.button8.end + 0.05, 1);
// cut to the listener: the cold mug at her chin, then her eyes come up to the lens and stay there
cut(b.button8.end + 0.3, HOOK);
MY.look(b.button8.start, 0.1, 1).look(b.button8.end + 0.6, 0, 0, 0.4).tiltTo(b.button8.end + 0.6, 0, 0.4);
shot(b.button8.end + 0.3, { camX: 712, camY: 840, zoom: 1.8 }, END - b.button8.end - 0.3, "none");

// END: the logo card drops in
wt.to(W, { end: 1, duration: 0.5, ease: "back.out(1.6)" }, END);
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// the pill sits on the wall right of her head, below the window, small enough for her close-ups
const PX = 940, PY = 905;
const pill = (k, text, tone) => k > 0.01 ? `<g transform="translate(${PX} ${PY}) scale(.75) translate(${-PX} ${-PY})">${DUO.stat(PX, PY, k, text, tone)}</g>` : "";
window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const night = W.night > 0.5, maya = MY.svg(t);
  const world = DUO.room(t, { night }) + (night ? nightBack() : "") + (night ? maya.replace(STEAM, "") : maya)
    + DUO.deskFront() + DUO.laptop() + lamp(night) + (W.mugDesk > 0.5 ? DUO.mug(880) : "") + F.svg(t)
    + (night ? nightFront() : "") + pill(W.down, "-60%", "bad") + pill(W.up, "+2%", "good");
  const full = W.chart > 0.5, pts = full ? FULL : DIP, from = full ? 21 : 20, tone = full ? "good" : "bad", zk = full ? 0 : W.zk;
  const v = view(pts, zk), fr = (from - v.a) / (pts.length - 1 - v.a);
  document.getElementById("stage").innerHTML = DUO.cam(world, W)
    + DUO.screenInsert(W.insert, fr, { title: zk > 0.5 ? "Clicks, last 8 hours" : "Clicks, last 24 hours", points: v.pts, tone, label: zk > 0.05 ? "" : (full ? "+2%" : "-60%") })
    + dottedTail(W.insert, t, pts, from, tone, zk)
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
window.STYLE = "duo";
window.render(0);
document.fonts.ready.then(() => window.render(0));
</script></body></html>
