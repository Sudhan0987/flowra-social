<!doctype html>
<html><head><meta charset="utf-8">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="../../brand/mascot/hum.js"></script>
<script src="../../brand/mascot/floey.js"></script>
<script src="../../brand/studio/props.js"></script>
<script src="../../brand/cast/maya.js"></script>
<script src="../../brand/cast/duo.js"></script>
<script src="lines.js"></script>
<style>
@font-face{font-family:"Space Grotesk";src:url("../../reel/assets/SpaceGrotesk.woff2") format("woff2");font-weight:300 700}
@font-face{font-family:"Public Sans";src:url("../../reel/assets/PublicSans.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#efe6f3}svg{display:block}
</style>
</head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// r044 "Zero Traffic Drop by Friday". Duo style, day. The shape of reel/duo/template.html.
// Frame one: the client's message is already on screen ("Live Friday. Zero drop, ok?"), Maya's hands are up
// by her head, a red "!" pops over her bun. Tight on her for "New site's live Friday!". Floey answers for
// Google, deadpan. "But I can't redirect every page": tight on her panic, and "212 pages" (her own example)
// pops up. Floey's tip; Maya's hands come down and she leans in. She types; her screen: Search Console,
// Pages, 16 months, sorted by clicks. "And?" "Oh. It's three bread recipes": all three top rows ring.
// "Those three first." "Not the homepage?" "Never. Then the rest." She sips her coffee: cold. She types to
// her client, a small fist. Floey to camera: "Send this to whoever's planning your site move." The client
// replies in the same slot as frame one: "Thanks! Still zero drop?" Maya's long flat look to camera. End card.
const M = window.MOUTHS || {};
const LINES = window.LINES;
// the pause after each line, from the story. payoff9 gets 1.5 s (the story's 0.6 s cannot hold the cold
// coffee beat: grab, sip, the face, Floey's chip).
const GAP = { hook0: 0.3, reframe1: 0.25, doubt2: 0.3, tip3: 0.4, check4: 0.3, check5: 0.5, payoff6: 0.35, payoff7: 0.3, payoff8: 0.2, payoff9: 1.5, payoff10: 0.3, button11: 0.7 };
const { B, DUR: SPOKEN } = DUO.timing(LINES, M, GAP);
const b = B, SH = DUO.SHOT, SP = DUO.SPOT;
const at = (id, k) => b[id].start + k * b[id].len;      // a fraction k of the way through a line
// the client's reply and Maya's flat stare play out before the end card
const END = Math.max(SPOKEN + 0.6, b.button11.end + 2.9), DUR = END + 1.6;

// ---------- shots (the named shots, nudged so nobody is sliced) ----------
const WIDE = { ...SH.wide };
const WIDE_IN = { camX: 590, camY: 990, zoom: 1.2 };
const FL = { ...SH.floey };
const FL_IN = { camX: 478, camY: 996, zoom: 1.38 };
const TIGHT = { camX: 640, camY: 845, zoom: 2.1 };      // mayaTight, a touch lower: Floey's spot stays clear of the caption band
const TIGHT_IN = { camX: 640, camY: 852, zoom: 2.2 };
// floeyTight pushed in and raised: Floey fills the frame, Maya (her hair edge is at world x ~458) fully out of it
const FT = { camX: 240, camY: 1022, zoom: 2.55 };
const FT_IN = { camX: 236, camY: 1020, zoom: 2.65 };

// ---------- the cast ----------
const F = FLOEY.create({ ...SP.floeyLaptop, facing: -1, mood: "hello", perched: true, view: "side" });
const MY = MAYA.create({ ...SP.maya, expr: "panic", pose: "panic", floey: F });
const W = { ...WIDE, n1: 1, n2: 0, bang: 0, pages: 0, list: 0, rows: 0, ring: 0, mug: 1, end: 0 };
const wt = gsap.timeline({ paused: true });
// Every camera move and prop change is a fromTo that starts where the last one on that value ended,
// so any frame seeked in any order gives the same picture. (From r040.)
const last = {}, lastEnd = {};
function key(t, vals, d = 0.3, ease = "power2.out") {
  const from = {}, ks = Object.keys(vals);
  let t0 = t;
  for (const k of ks) { from[k] = k in last ? last[k] : W[k]; t0 = Math.max(t0, lastEnd[k] ?? 0); }
  wt.fromTo(W, from, { ...vals, duration: d, ease, immediateRender: false }, t0);
  for (const k of ks) { last[k] = vals[k]; lastEnd[k] = t0 + d; }
}
const cam = (s) => ({ camX: s.camX, camY: s.camY, zoom: s.zoom });
const shot = (t, s, d = 0.6, ease = "power3.inOut") => key(t, cam(s), d, ease);
const cutTo = (t, s) => key(t, cam(s), 0.001, "none");
// Floey's eyes half shut (deadpan) and open again
const lids = (t, v, d = 0.2) => F.tl.to(F.S, { squint: v, duration: d, ease: "power2.out" }, t);
// Floey's eyes on the lid: at Maya, at the keyboard
const F_MAYA = [0.7, -0.3], F_KEYS = [0.4, 0.9];
// Maya's eyes
const M_LAPTOP = [-0.4, 0.9], M_LID = [-1, 0.3], M_UPLEFT = [-0.8, -0.4], M_NOTE = [0.1, -1];
// Maya's own poses for this reel (the coffee)
const REACH = { L: [228, 705], R: [500, 640], hold: "mug" };  // her hand on the desk mug
const MUGUP = { L: [262, 650], R: [336, 530], hold: "mug" };  // the mug at her chest
const SIP = { L: [262, 650], R: [322, 386], hold: "mug" };    // the mug at her lips
const AWAY = { L: [262, 650], R: [470, 560], hold: "mug" };   // holding the cold mug away from her
const KEYS_X = 330, MUG_X = 900;
// Maya's face: held stares with no stray blink, the panic mouth kept inside her jaw
const STARE = [];
const mayaState = MY.state;
MY.state = (t) => {
  const s = mayaState(t);
  if (STARE.some(([a, z]) => t >= a && t <= z)) s.blink = 0;
  if (s.expr === "panic") s.mouth = Math.min(s.mouth, 0.55);
  return s;
};

// HOOK0: frame one, the problem already up. The client's message sits in the top slot, Maya's hands are up
// by her head, eyes on the laptop. A red "!" pops over her bun; Floey's head snaps to her. On "New site's
// live Friday!" a hard cut to her face with a small shake.
const h = b.hook0.start;
MY.look(0, ...M_LAPTOP, 0.01).say(h, M.hook0 || [], "hook0");
F.sfx(0.05, "ding", { x: 540 });
F.look(0, ...F_KEYS, 0.01);
key(0.6, { bang: 1 }, 0.25, "back.out(3)");
F.sfx(0.6, "pop", { x: 840 });
F.look(0.62, ...F_MAYA, 0.06).tiltTo(0.7, 10, 0.3);
MY.look(0.9, ...M_NOTE, 0.15).look(1.5, ...M_LAPTOP, 0.15);
const fri = at("hook0", 0.5);
key(fri - 0.25, { bang: 0 }, 0.15, "power2.in");
cutTo(fri, TIGHT);
[[0.03, 652, 839], [0.08, 630, 851], [0.13, 648, 843], [0.18, 640, 845]].forEach(([d, x, y]) => key(fri + d, { camX: x, camY: y }, 0.05, "sine.inOut"));
shot(fri + 0.25, TIGHT_IN, b.hook0.end - fri, "sine.inOut");
MY.jolt(fri + 0.02).tiltTo(fri + 0.1, -5, 0.15).tiltTo(fri + 0.6, 3, 0.2).tiltTo(at("hook0", 0.85), -2, 0.15);
STARE.push([0, b.hook0.end]);

// REFRAME1: the two-shot favouring Floey; the client's message slides away. Floey answers for Google,
// deadpan: a slow blink on "wobble", a small tilt on "Love, Google." Behind her, Maya presses her cheeks.
const r = b.reframe1.start;
key(r - 0.3, { n1: 0 }, 0.25, "power2.in");
cutTo(r - 0.2, FL);
shot(r, FL_IN, b.reframe1.len + 0.2, "sine.inOut");
lids(r - 0.2, 0.45, 0.2);
F.mood(r - 0.2, "think").look(r - 0.2, ...F_MAYA, 0.1).tiltTo(r - 0.2, 0, 0.2).say(r, M.reframe1 || [], "reframe1");
const wob = at("reframe1", 0.38);
lids(wob, 1, 0.18); lids(wob + 0.35, 0.45, 0.2);
F.tiltTo(at("reframe1", 0.62), -12, 0.35);
MY.expr(r - 0.1, "worried").pose(r - 0.15, "cheeks", 0.35).look(r, ...M_LID, 0.15).tiltTo(r, 0, 0.2);
MY.expr(at("reframe1", 0.7), "deadpan");

// DOUBT2: tight on Maya, she jolts and her hands fly back up. On "every page" her own page count pops up:
// "212 pages". The camera creeps in.
const d2 = b.doubt2.start;
cutTo(d2 - 0.1, TIGHT);
shot(d2, TIGHT_IN, b.doubt2.len, "sine.in");
lids(d2, 0, 0.1);
F.tiltTo(d2, 0, 0.1);
MY.expr(d2 - 0.1, "panic").pose(d2 - 0.08, "panic", 0.2).look(d2, ...M_LAPTOP, 0.12).jolt(d2 + 0.05).say(d2, M.doubt2 || [], "doubt2");
const every = at("doubt2", 0.45);
key(every, { pages: 1 }, 0.3, "back.out(2.5)");
F.sfx(every + 0.05, "tick", { x: 780 });
MY.tiltTo(every, 5, 0.15).tiltTo(every + 0.5, -3, 0.2).tiltTo(b.doubt2.end, 0, 0.2);
STARE.push([d2, b.doubt2.end]);

// TIP3: Floey, one chip on "Start". Maya's hands come down on "most clicked pages"; she leans in to the
// laptop. Floey tilts her head on each screen she names, while the camera drifts in.
const tp = b.tip3.start;
key(tp - 0.35, { pages: 0 }, 0.2, "power2.in");
cutTo(tp - 0.25, FL);
shot(tp + 0.4, FL_IN, b.tip3.len - 0.4, "sine.inOut");
F.mood(tp - 0.2, "determined").look(tp - 0.2, ...F_MAYA, 0.1).say(tp, M.tip3 || [], "tip3").chips(tp + 0.05, 1);
MY.expr(tp - 0.1, "worried").look(tp, ...M_LID, 0.15);
const most = at("tip3", 0.22);
MY.pose(most, "rest", 0.5).expr(most + 0.2, "surprised");
const sc = at("tip3", 0.5), perf = at("tip3", 0.7), tab = at("tip3", 0.88);
F.mood(sc - 0.1, "hello").tiltTo(sc, 12, 0.18).tiltTo(perf, -10, 0.18).tiltTo(tab, 14, 0.18);
MY.expr(sc, "think").leanTo(sc, -5, 0.4).look(sc, ...M_LAPTOP, 0.2).nod(perf, 1);

// CHECK4: the wide. Maya types, Floey watches her hands. Then a whoosh to her screen: Search Console, the
// Pages tab, 16 months, sorted by clicks; the rows slide in one by one.
const c4 = b.check4.start;
cutTo(b.tip3.end + 0.05, WIDE);
F.tiltTo(b.tip3.end + 0.05, 0, 0.2).look(b.tip3.end + 0.1, ...F_KEYS, 0.15);
MY.pose(b.tip3.end, "type", 0.25).look(b.tip3.end, ...M_LAPTOP, 0.15).expr(b.tip3.end, "think");
F.sfx(b.tip3.end + 0.1, "typing", { d: 0.9, x: KEYS_X });
MY.say(c4, M.check4 || [], "check4");
const ins = at("check4", 0.42);
key(ins, { list: 1 }, 0.35, "power3.out");
F.sfx(ins, "whoosh");
key(ins + 0.25, { rows: 1 }, b.check5.end - ins - 0.1, "power1.out");

// CHECK5: "And?" over her screen; the last row settles. (Floey, unseen, tilts and waits.)
const c5 = b.check5.start;
F.look(c5 - 0.1, ...F_MAYA, 0.1).tiltTo(c5, 14, 0.2).say(c5, M.check5 || [], "check5");
MY.expr(c5, "think");

// PAYOFF6: "Oh." The top three rows, all bread, ring at once (ding). On "bread recipes" cut to her face:
// think, then surprised, then a happy half smile.
const p6 = b.payoff6.start;
MY.expr(p6 - 0.1, "surprised").pose(p6, "rest", 0.3).leanTo(p6, 0, 0.3).say(p6, M.payoff6 || [], "payoff6");
key(p6 + 0.05, { ring: 1 }, 0.3, "power2.out");
F.sfx(p6 + 0.05, "ding", { x: 540 });
const back6 = at("payoff6", 0.6);
key(back6, { list: 0 }, 0.001, "none");
cutTo(back6, TIGHT);
shot(back6 + 0.001, TIGHT_IN, b.payoff6.end - back6 + 0.3, "sine.inOut");
MY.look(back6, ...M_LAPTOP, 0.1).jolt(back6 + 0.05).expr(at("payoff6", 0.82), "happy").look(at("payoff6", 0.85), ...M_LID, 0.15);
F.tiltTo(back6, 0, 0.2);

// PAYOFF7: pull out to the wide. Floey, warm, one small nod on "first". Maya types: her only action.
const p7 = b.payoff7.start;
shot(p7 - 0.2, WIDE, 0.6, "power3.out");
F.mood(p7 - 0.1, "happy").look(p7, ...F_MAYA, 0.1).say(p7, M.payoff7 || [], "payoff7");
const first = at("payoff7", 0.25);
F.tiltTo(first, -14, 0.1).tiltTo(first + 0.14, 4, 0.16).tiltTo(first + 0.32, 0, 0.15);
MY.expr(p7, "happy").pose(p7 + 0.5, "type", 0.25).look(p7 + 0.5, ...M_LAPTOP, 0.15);
F.sfx(p7 + 0.8, "typing", { d: 1.4, x: KEYS_X });
F.look(at("payoff7", 0.6), ...F_KEYS, 0.12);

// PAYOFF8: tight. Her hands stop; she looks up over her glasses at Floey, half suspicious, head tilted.
const p8 = b.payoff8.start;
cutTo(p8 - 0.1, TIGHT);
MY.pose(p8 - 0.1, "rest", 0.25).expr(p8 - 0.1, "think").look(p8 - 0.05, ...M_UPLEFT, 0.15).tiltTo(p8, 6, 0.3).say(p8, M.payoff8 || [], "payoff8");
STARE.push([p8, b.payoff8.end + 0.1]);

// PAYOFF9: Floey, dry tilt on "Never.", a wink on "Then the rest." Maya behind her, eyebrows up on the wink.
const p9 = b.payoff9.start;
cutTo(p9 - 0.1, FL);
F.mood(p9 - 0.1, "hello").look(p9 - 0.1, ...F_MAYA, 0.1).say(p9, M.payoff9 || [], "payoff9").tiltTo(p9 + 0.05, -12, 0.2);
lids(p9 - 0.1, 0.4, 0.15);
const rest = at("payoff9", 0.55);
lids(rest - 0.05, 0, 0.05);
F.wink(rest).tiltTo(rest, 0, 0.2);
MY.expr(rest + 0.05, "surprised").tiltTo(rest, 0, 0.25);

// the cold coffee (the silent pause): wide, she grabs her mug, a sip... cold. She holds it away. Floey chips.
const cof = b.payoff9.end + 0.05;
cutTo(cof, WIDE);
MY.expr(cof, "happy").pose(cof, REACH, 0.28).look(cof, 0.6, 0.8, 0.15);
key(cof + 0.28, { mug: 0 }, 0.001, "none");
F.sfx(cof + 0.28, "tick", { x: MUG_X });
MY.pose(cof + 0.3, SIP, 0.3).look(cof + 0.35, 0, 0.3, 0.12);
F.sfx(cof + 0.6, "sip", { x: 680 });
const cold = cof + 0.85;
MY.expr(cold, "annoyed").pose(cold + 0.1, AWAY, 0.3).look(cold + 0.1, 0.8, 0.1, 0.15);
[0, 0.06, 0.12, 0.18].forEach((d, i) => MY.tiltTo(cold + d, i % 2 ? -2.5 : 2.5, 0.05));
MY.tiltTo(cold + 0.24, -4, 0.12);
F.chips(cold + 0.45, 1).tiltTo(cold + 0.45, 10, 0.2);
STARE.push([cold, b.payoff10.start]);

// PAYOFF10: a slow push on the wide. Mug down, fast purposeful typing, a small fist as she finishes.
const p10 = b.payoff10.start;
shot(p10, WIDE_IN, b.payoff10.len + 0.3, "sine.inOut");
MY.expr(p10 - 0.1, "proud").pose(p10 - 0.15, REACH, 0.2).tiltTo(p10, 0, 0.2).say(p10, M.payoff10 || [], "payoff10");
key(p10 + 0.05, { mug: 1 }, 0.001, "none");
F.sfx(p10 + 0.05, "tick", { x: MUG_X });
MY.pose(p10 + 0.1, "type", 0.2).look(p10 + 0.1, ...M_LAPTOP, 0.12);
F.tiltTo(p10, 0, 0.2).look(p10 + 0.1, ...F_KEYS, 0.12);
F.sfx(p10 + 0.3, "typing", { d: 0.8, x: KEYS_X });
const fist = b.payoff10.end - 0.2;
MY.pose(fist, "fist", 0.2).expr(fist, "happy").nod(fist + 0.15, 1);
F.sfx(fist + 0.1, "click", { x: 760 });

// BUTTON11: Floey alone, she pivots to the camera with a swish: flat and deadpan, straight down the lens.
const bt = b.button11.start;
cutTo(bt - 0.25, FT);
shot(bt, FT_IN, b.button11.len, "sine.inOut");
F.sfx(bt - 0.2, "swish");
F.pivot(bt - 0.15, "front").mood(bt - 0.1, "hello").look(bt - 0.1, 0, 0, 0.08).say(bt, M.button11 || [], "button11");
lids(bt - 0.05, 0.45, 0.2);
lids(b.button11.end - 0.05, 1, 0.18); lids(b.button11.end + 0.25, 0.45, 0.2);

// the button: wide, the client replies in the same slot as frame one (ding). Maya's fist sags. Then tight
// on her face: a long flat look straight at the camera.
const rep = b.button11.end + 0.2;
cutTo(rep - 0.05, WIDE);
MY.pose(rep - 0.05, "fist", 0.01).expr(rep - 0.05, "happy");
key(rep, { n2: 1 }, 0.35, "back.out(1.4)");
F.sfx(rep + 0.05, "ding", { x: 540 });
F.pivot(rep + 0.3, "side").look(rep + 0.4, ...F_MAYA, 0.2);
lids(rep + 0.3, 0.2, 0.2);
MY.look(rep + 0.1, ...M_NOTE, 0.15).expr(rep + 0.35, "surprised").pose(rep + 0.4, "rest", 0.6).slump(rep + 0.5, 0.5);
const stare = rep + 1.15;
cutTo(stare, TIGHT);
shot(stare + 0.001, TIGHT_IN, END - stare, "sine.inOut");
MY.expr(stare, "deadpan").look(stare + 0.2, 0, 0, 0.4).sit(stare, 0.3).tiltTo(stare + 0.3, 3, 0.6);
STARE.push([stare, stare + 1.0]);

// END: the logo card drops in
key(END, { end: 1 }, 0.5, "back.out(1.6)");
F.sfx(END + 0.05, "thump");
wt.set({}, {}, DUR);

// ---------- screen-space parts ----------
const NOTE_Y = 236;
const notes = () => DUO.notification(W.n1, "Client", "Live Friday. Zero drop, ok?", NOTE_Y) + DUO.notification(W.n2, "Client", "Thanks! Still zero drop?", NOTE_Y);
// Maya's own example page count, top right, clear of her bun
const pages = () => DUO.stat(800, 330, W.pages, "212 pages", "bad");
const ROWS = [
  { label: "/sourdough-starter/", value: "4,210", tone: "good", hi: true },
  { label: "/no-knead-bread/", value: "2,980", tone: "good", hi: true },
  { label: "/banana-bread/", value: "1,640", tone: "good", hi: true },
  { label: "/about/", value: "310" },
  { label: "/tag/flour/", value: "12" },
];
const list = () => DUO.listInsert(W.list, W.rows, { title: "Search Console · Performance", sub: "Pages tab · 16 months · 212 pages", cols: ["Page", "Clicks"], rows: ROWS, hiK: W.ring });

// ---------- world parts ----------
// the rig draws every open mouth as a grin. On her upset faces, turn the open mouth over (arched top,
// flat bottom) so a worried line reads as worry, not delight. (Same fix as r027 to r043.)
const UPSET = new Set(["panic", "worried", "annoyed", "sad", "surprised", "deadpan", "think"]);
const MOUTH_RE = /<path d="(M[^"]+Z)" fill="#5a1f22"[^>]*\/>\s*<clipPath id="mq\d+"><path d="[^"]+"\/><\/clipPath>\s*<g clip-path="url\(#mq\d+\)">(<ellipse[^>]*\/>)<rect[^>]*\/><\/g>/;
function frown(s, e) {
  if (!UPSET.has(e)) return s;
  const sy = e === "deadpan" ? 0.5 : e === "annoyed" ? 0.42 : e === "think" ? 0.6 : 1;
  return s.replace(MOUTH_RE, (all, d, tongue) => {
    const ys = d.match(/-?\d+(\.\d+)?/g).map(Number).filter((_, i) => i % 2);
    const lo = Math.min(...ys), hi = Math.max(...ys), mid = (lo + hi) / 2;
    return `<g transform="translate(0 ${mid.toFixed(1)}) scale(1 ${(-sy).toFixed(2)}) translate(0 ${(-mid).toFixed(1)})">${all.replace(tongue, "")}</g>`;
  });
}
// her coffee is cold: the mug in her hand has no steam
const noSteam = (s) => s.replace(/<path d="M-12,-12 q-8,-12 0,-24[^>]*\/>/, "");
const mayaSvg = (t) => `<g data-maya="1">${noSteam(frown(MY.svg(t), MY.state(t).expr))}</g>`;
// Floey is drawn only when her body is in the frame: in Maya's close-ups a stray beak tip would poke in
const floeyVisible = (t) => { const p = F.pose(t), x = 540 + (p.x - W.camX) * W.zoom; return x > -60 && x < 1140; };
// the "!" over her bun (world space), with a soft wall-coloured puff so the window frame does not run through it
// (beside her head, screen right, so it never meets the notification text in the top slot)
const bang = () => W.bang > 0.01 ? `<circle cx="842" cy="${(582 - 20 * W.bang).toFixed(1)}" r="${(48 * Math.min(1, W.bang * 1.4)).toFixed(1)}" fill="#efe6f3" opacity="${Math.min(0.92, W.bang * 1.8).toFixed(2)}"/>` + DUO.mark("!", 820, 620, W.bang) : "";

window.render = function (t) {
  wt.seek(Math.min(DUR, t), false);
  const world = DUO.room(t) + mayaSvg(t) + DUO.deskFront() + DUO.laptop() + (W.mug > 0.5 ? DUO.mug(MUG_X) : "")
    + (floeyVisible(t) ? F.svg(t) : "") + bang();
  document.getElementById("stage").innerHTML = DUO.cam(world, W)
    + pages() + list() + notes()
    + (W.end < 0.5 ? DUO.captions(LINES, B, t) : "")
    // a quick opaque wash first, so the end card never sits over a faded Maya or the client's message
    + (W.end > 0.01 ? `<rect width="1080" height="1920" fill="#fffaf2" opacity="${Math.min(1, W.end * 4).toFixed(2)}"/>` : "")
    + DUO.endCard(W.end, t);
};
window.DURATION = DUR;
window.SOUND = () => ({ ...F.sound(DUR), style: "duo", musicFile: "assets/music/mk162.mp3" });
window.CAMERA = (t) => { wt.seek(Math.min(DUR, t), false); return { camX: W.camX, camY: W.camY, zoom: W.zoom }; };
window.FLOEY = F;
window.BEATS = B;
